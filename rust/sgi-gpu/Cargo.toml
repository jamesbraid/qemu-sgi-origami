# SPDX-License-Identifier: BSD-3-Clause
# Standalone workspace: QEMU's root workspace is resolved crate by crate
# through meson wraps, which wgpu's dependency tree does not fit.
[workspace]

[package]
name = "sgi-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "BSD-3-Clause"
publish = false

[lib]
name = "sgi_gpu"
crate-type = ["staticlib"]

[dependencies]
iris-wgpu = { git = "https://github.com/jamesbraid/iris", rev = "dc46b3c6a8a8bc569a4438b70ede2b32deadfadf" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
log = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = "0.38"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wgpu-hal = { version = "30", default-features = false, features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu-hal = { version = "30", default-features = false, features = ["metal"] }
objc2 = "0.6"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3"

[profile.release]
opt-level = 2
debug = false
panic = "unwind"
