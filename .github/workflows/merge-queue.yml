# SPDX-License-Identifier: BSD-3-Clause
# Rebase and land eligible pull requests on the fast-forward-only trunk, up to
# two at a time through one combined build and full suite.
# Green pull requests land unless they are drafts or carry the `hold` label.
# The schedule backs up the green-build dispatch and catches changes that do
# not start a build, such as removing a hold from an already-green pull request.
# The schedule is registered from the default branch; do not add a
# pull-request trigger that would run branch copies against the trunk.
name: merge-queue

on:
  push:
    branches: [sgi-origami]
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  queue:
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ${{ vars.CI_QUEUE_RUNNER }}
    # A job that stops making progress must not hold the line for ever. The
    # driver bounds its own work with RUN_BUDGET; nothing bounded the job around
    # it, so when the runner cannot reach its container engine mid-job the run
    # stays running until a person cancels it -- forty and sixty minutes on two
    # runs in one morning on the project repository, with every other pull
    # request waiting behind the group. Generous enough that only a stuck job
    # reaches it, not a slow one.
    timeout-minutes: 20
    steps:
      # Fetch the configured queue driver and reject an empty response.
      - name: fetch the queue driver
        env:
          CI_QUEUE_URL: ${{ vars.CI_QUEUE_URL }}
        run: |
          : "${CI_QUEUE_URL:?CI_QUEUE_URL is required}"
          mkdir -p .merge-queue
          curl -sSf -H "Authorization: token ${{ secrets.CI_BOT_TOKEN }}" \
            -o .merge-queue/merge-queue \
            "$CI_QUEUE_URL"
          test -s .merge-queue/merge-queue

      - name: process the queue
        env:
          FORGE: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TRUNK: sgi-origami
          CHECKS: build and register suite / build-and-qtest (pull_request)
          TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          LAND_WORKFLOW: "build.yml"
          LAND_INPUTS: "suite=full"
          # One run waits through a normal full suite. The suite takes 15 to 16
          # minutes, so with the driver's defaults (a 540 s wait inside a 600 s
          # budget) the run that dispatched it gave up first and the landing
          # waited for the next scheduled run, up to half an hour later.
          # LAND_WAIT is how long the run waits for the suite, about 22
          # minutes to leave room for a slow builder. RUN_BUDGET bounds the
          # whole run, so it must exceed LAND_WAIT by the time the run spends
          # before and after the wait. A run still holds the queue's
          # concurrency group while it waits, which the small shared runner
          # can afford.
          RUN_BUDGET: "1500"
          LAND_WAIT: "1320"
          # Land up to two green pull requests per pull-request check and full suite
          # instead of one each. Two, not more: a batch goes red whenever any
          # member's full suite would, and with about a fifth of full suites
          # red, larger batches split often enough to save nothing. The driver
          # combines them in WORKTREE, tests the combination through a held
          # integration pull request on its own merge-queue/batch-<time>
          # branch, then moves each member's branch to its tested commits and
          # merges it, so the job needs a clone it can push from. A batch in
          # flight lives on the forge, so a run that ends mid-batch loses
          # nothing.
          BATCH_MAX: "2"
          WORKTREE: ${{ github.workspace }}/.merge-queue/worktree
        # The clone is blob-less: a run with nothing to batch pays for commits
        # and trees, and file contents arrive only when a batch is built. It is
        # removed first so a reused workspace cannot make the clone fail. The
        # token reaches git through the environment, never the remote URL, so
        # it is not written into the clone or quoted back in a git error the
        # driver prints, and its base64 form is masked in the log like the
        # secret itself. user.name and user.email are the committer of the
        # replayed commits; authorship stays with each commit's author.
        run: |
          auth=$(printf 'jamesb-ci-bot:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          export GIT_CONFIG_KEY_1=user.name GIT_CONFIG_VALUE_1=jamesb-ci-bot
          export GIT_CONFIG_KEY_2=user.email
          export GIT_CONFIG_VALUE_2=jamesb-ci-bot@noreply.git.octanix.dev
          rm -rf "$WORKTREE"
          git clone -q --filter=blob:none --no-checkout \
            "$FORGE/$REPO.git" "$WORKTREE"
          python3 -u .merge-queue/merge-queue
