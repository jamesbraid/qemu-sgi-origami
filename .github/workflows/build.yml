# SPDX-License-Identifier: BSD-3-Clause
# Build QEMU and run native MIPS64 checks. Smoke and the full run's
# functional part first run the script and model suites, which need no
# build. Smoke covers changed qtests, SGI unit tests, the one-CPU Linux boot
# and the source-built ROM suite; full adds every register test and the
# PROM and IRIX miniroot boots. The two- and four-CPU Linux boots run only
# in the nightly's Monday, Wednesday and Friday matrix workload. Guest
# assets are checksum-verified.
# scripts/ci/sgi-check holds the checks themselves, so a developer can run
# them in the same image; scripts/ci/runner-setup holds the job-container
# steps around them.
name: build and register suite

on:
  # Pull requests run smoke; dispatch selects smoke or full. The merge queue
  # dispatches full before landing a pull request.
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          which job a manual or queue dispatch runs: smoke (the fast
          per-pull-request subset, the default) or full (the complete register
          suite plus every boot, the set the merge queue runs before a land).
        type: choice
        options: [smoke, full]
        default: smoke

# New commits supersede older runs for the same pull request. Runs use an
# ephemeral workspace, so cancelling a superseded run is safe.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qtest:
    if: ${{ github.server_url != 'https://github.com' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')) }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 175
    # Save the current step name for failure reporting.
    env:
      CI_STEP: /tmp/ci-current-step
      CI_ASSET_BASE_URL: ${{ vars.CI_ASSET_BASE_URL }}
      FORGE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    # Keep the checkout action's JavaScript runtime and provide the Docker
    # client in the job image.
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_BOT_TOKEN }}
    steps:
      # Forgejo checks out the pull request head here, one commit deep. The
      # base fetch below deepens only as far as the merge base, so smoke
      # selects every changed test without downloading the whole history.
      - uses: actions/checkout@v4

      - name: docker client
        run: |
          echo "docker client" > "$CI_STEP"
          bash scripts/ci/runner-setup docker

      - name: name the runner
        run: bash scripts/ci/runner-setup describe

      - name: fetch the pull request base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "fetch the pull request base" > "$CI_STEP"
          bash scripts/ci/runner-setup fetch-base

      - name: every qtest source is one the suite runs
        run: |
          echo "every qtest source is one the suite runs" > "$CI_STEP"
          python3 scripts/check-qtest-registered.py
          python3 scripts/test_check_qtest_registered.py

      - name: build the QEMU test image
        run: |
          echo "build the QEMU test image" > "$CI_STEP"
          bash scripts/ci/runner-setup image

      - name: find the workspace volume
        run: |
          echo "find the workspace volume" > "$CI_STEP"
          bash scripts/ci/runner-setup volume

      - name: fetch SGI test assets
        env:
          ASSET_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          echo "fetch SGI test assets" > "$CI_STEP"
          bash scripts/ci/runner-setup assets

      - name: check the build container can see the checkout and TAP device
        run: |
          echo "check the build container can see the checkout and TAP device" > "$CI_STEP"
          bash scripts/ci/runner-setup check tap

      # These need no QEMU build, so run them first: a broken model file
      # or script fails the job in minutes instead of after the build.
      - name: script and model suites
        run: |
          echo "script and model suites" > "$CI_STEP"
          bash scripts/ci/runner-setup run -v "$WORKSPACE_VOLUME:/src" -w /src \
              "$IMAGE_ID" python3 scripts/ci/sgi-check scripts

      - name: configure and build QEMU
        run: |
          echo "configure and build QEMU" > "$CI_STEP"
          bash scripts/ci/runner-setup run -v "$WORKSPACE_VOLUME:/src" -w /src "$IMAGE_ID" \
              sh -euxc 'git submodule update --init --depth=1
                        python3 scripts/ci/sgi-check build'

      - name: smoke checks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "smoke checks" > "$CI_STEP"
          bash scripts/ci/runner-setup run-tests -v "$WORKSPACE_VOLUME:/src" -w /src \
              -e PR_BASE_SHA="$PR_BASE_SHA" \
              -e QEMU_TEST_SGI_ASSET_DIR=/src/sgi-assets \
              "$IMAGE_ID" python3 scripts/ci/sgi-check smoke

      - name: retain failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v3
        with:
          name: smoke-failure-diagnostics
          # Keep text logs and test reports, excluding guest disks and assets.
          path: |
            build-ci/meson-logs/*.txt
            build-ci/meson-logs/*.json
            build-ci/meson-logs/*.xml
            build-ci/tests/functional/**/*.log
            !build-ci/tests/functional/**/scratch/**
          if-no-files-found: warn
          retention-days: 7

      - name: publish the failing step
        if: ${{ failure() }}
        env:
          FORGE_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/ci/runner-setup report-failure

      - name: tell the merge queue this build is green
        if: ${{ success() }}
        env:
          FORGE_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: bash scripts/ci/runner-setup nudge-queue

  # The full run is three jobs on separate builders, each building its own
  # QEMU: half the qtests each in two, and the boots, ROMs and unit tests in
  # the third. full-suite below collects them.
  full-part:
    if: ${{ github.server_url != 'https://github.com' && github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    strategy:
      # Let every part finish, so one failure does not hide another.
      fail-fast: false
      matrix:
        part: [qtest-1-of-2, qtest-2-of-2, functional]
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 175
    # Save the current step name for failure reporting.
    env:
      CI_STEP: /tmp/ci-current-step
      CI_ASSET_BASE_URL: ${{ vars.CI_ASSET_BASE_URL }}
      FORGE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
      PART: ${{ matrix.part }}
    # Keep the checkout action's JavaScript runtime and provide the Docker
    # client in the job image.
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: docker client
        run: |
          echo "$PART: docker client" > "$CI_STEP"
          bash scripts/ci/runner-setup docker

      - name: name the runner
        run: bash scripts/ci/runner-setup describe

      # The checks that need no build run once, in the functional part.
      - name: every qtest source is one the suite runs
        if: ${{ matrix.part == 'functional' }}
        run: |
          echo "$PART: every qtest source is one the suite runs" > "$CI_STEP"
          python3 scripts/check-qtest-registered.py
          python3 scripts/test_check_qtest_registered.py

      - name: build the QEMU test image
        run: |
          echo "$PART: build the QEMU test image" > "$CI_STEP"
          bash scripts/ci/runner-setup image

      - name: find the workspace volume
        run: |
          echo "$PART: find the workspace volume" > "$CI_STEP"
          bash scripts/ci/runner-setup volume

      # Only the boots read guest assets.
      - name: fetch SGI test assets
        if: ${{ matrix.part == 'functional' }}
        env:
          ASSET_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          echo "$PART: fetch SGI test assets" > "$CI_STEP"
          bash scripts/ci/runner-setup assets

      - name: check the build container can see the checkout and TAP device
        run: |
          echo "$PART: check the build container can see the checkout and TAP device" > "$CI_STEP"
          bash scripts/ci/runner-setup check tap

      # These need no QEMU build, so run them first: a broken model file
      # or script fails the job in minutes instead of after the build.
      - name: script and model suites
        if: ${{ matrix.part == 'functional' }}
        run: |
          echo "$PART: script and model suites" > "$CI_STEP"
          bash scripts/ci/runner-setup run -v "$WORKSPACE_VOLUME:/src" -w /src \
              "$IMAGE_ID" python3 scripts/ci/sgi-check scripts

      - name: configure and build QEMU
        run: |
          echo "$PART: configure and build QEMU" > "$CI_STEP"
          bash scripts/ci/runner-setup run -v "$WORKSPACE_VOLUME:/src" -w /src "$IMAGE_ID" \
              sh -euxc 'git submodule update --init --depth=1
                        python3 scripts/ci/sgi-check build'

      - name: run this part of the SGI test suite
        run: |
          echo "$PART: run this part of the SGI test suite" > "$CI_STEP"
          bash scripts/ci/runner-setup run-tests -v "$WORKSPACE_VOLUME:/src" -w /src \
              -e QEMU_TEST_SGI_ASSET_DIR=/src/sgi-assets \
              "$IMAGE_ID" python3 scripts/ci/sgi-check full --part "$PART"

      - name: retain failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v3
        with:
          name: full-failure-diagnostics-${{ matrix.part }}
          # Keep text logs and test reports, excluding guest disks and assets.
          path: |
            build-ci/meson-logs/*.txt
            build-ci/meson-logs/*.json
            build-ci/meson-logs/*.xml
            build-ci/tests/functional/**/*.log
            !build-ci/tests/functional/**/scratch/**
          if-no-files-found: warn
          retention-days: 7

      - name: publish the failing step
        if: ${{ failure() }}
        env:
          FORGE_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/ci/runner-setup report-failure

  # The merge queue lands on the dispatched run's overall status, which
  # Forgejo computes from every job, so a failed or cancelled part already
  # fails the run. This job runs whatever the parts' results were. It
  # nudges the queue once when the whole run passed, publishes the failing
  # step when a part was cancelled rather than failing, and checks the
  # parts' results itself in case the queue ever reads this job instead.
  full-suite:
    needs: [full-part]
    if: ${{ always() && github.server_url != 'https://github.com' && github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 20
    env:
      CI_STEP: /tmp/ci-current-step
      FORGE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Forgejo gives a matrix job's needs result as success only if every
      # part succeeded or was skipped, and the parts share one condition.
      - name: every part of the full run passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "full-suite: a part did not succeed" > "$CI_STEP"
          python3 scripts/ci/sgi-check needs-passed full-part

      # A failed part has already published its own failing step. Publish
      # here only when no part did: a cancelled part, or this job failing.
      - name: publish the failing step
        if: ${{ failure() }}
        env:
          FORGE_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          ONLY_IF_UNREPORTED: 1
        run: bash scripts/ci/runner-setup report-failure

      - name: tell the merge queue this build is green
        if: ${{ success() }}
        env:
          FORGE_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: bash scripts/ci/runner-setup nudge-queue
