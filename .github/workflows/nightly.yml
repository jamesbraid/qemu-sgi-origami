# SPDX-License-Identifier: BSD-3-Clause
# Run native MIPS64 workloads nightly. The regular matrix runs three days a
# week; IRIX diagnostics run Tuesday, Thursday, and Saturday. Sunday alternates
# installation and network tests. Manual dispatch selects a workload.
name: periodic functional tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      workload:
        description: workload to run (auto follows the weekly schedule)
        type: choice
        options: [auto, matrix, diag-a, diag-b, diag-c, install, openbsd]
        default: auto

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  functional:
    name: functional
    timeout-minutes: 200
    if: ${{ github.server_url != 'https://github.com' }}
    env:
      CI_ASSET_BASE_URL: ${{ vars.CI_ASSET_BASE_URL }}
    runs-on: ${{ vars.CI_NIGHTLY_RUNNER }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_BOT_TOKEN }}
    steps:
      - name: check Docker access
        run: |
          command -v docker >/dev/null || {
            apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io
          }
          if ! docker version --format '{{.Server.Version}}' >/dev/null; then
            echo "The Docker daemon is not reachable from this job."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: select the workload
        env:
          REQUESTED_WORKLOAD: ${{ inputs.workload }}
        shell: bash
        run: |
          workload="$REQUESTED_WORKLOAD"
          if [ -z "$workload" ] || [ "$workload" = auto ]; then
            case "$(date -u +%u)" in
              1|3|5) workload=matrix ;;
              2) workload=diag-a ;;
              4) workload=diag-b ;;
              6) workload=diag-c ;;
              7) if [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then
                   workload=install
                 else
                   workload=openbsd
                 fi ;;
            esac
          fi
          case "$workload" in
            matrix|diag-a|diag-b|diag-c|install|openbsd) ;;
            *) echo "unknown workload: $workload"; exit 2 ;;
          esac
          echo "NIGHTLY_WORKLOAD=$workload" >> "$GITHUB_ENV"
          echo "selected $workload on $(date -u +%Y-%m-%d)"

      - name: build QEMU's MIPS64 test image
        run: |
          image_id=$(docker build -q \
              -f tests/docker/dockerfiles/debian-sgi.docker \
              tests/docker/dockerfiles)
          if [ -z "$image_id" ]; then
            echo "QEMU test image build returned no image ID"
            exit 1
          fi
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: find the workspace volume
        run: sh scripts/ci/runner-setup volume

      - name: check the build container can see the checkout
        run: sh scripts/ci/runner-setup check

      - name: configure and build QEMU
        run: |
          docker run --rm -v "$WORKSPACE_VOLUME:/src" -w /src "$IMAGE_ID" \
              sh -euxc '
                git submodule update --init --depth=1
                mkdir -p build-nightly
                cd build-nightly
                ../configure --target-list=mips64-softmmu --enable-tests \
                    --enable-hmp --enable-slirp --enable-debug-tcg
                ninja
              '

      - name: run the selected functional tests
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          docker run --rm -v "$WORKSPACE_VOLUME:/src" -w /src \
              -e NIGHTLY_WORKLOAD \
              -e QEMU_TEST_SGI_ASSET_DIR=/src/sgi-assets \
              -e QEMU_TEST_ALLOW_SLOW=1 \
              -e QEMU_TEST_ALLOW_LARGE_STORAGE=1 \
              -e CI_BOT_TOKEN \
              -e CI_ASSET_BASE_URL \
              "$IMAGE_ID" bash -euxc '
            build=/src/build-nightly
            meson="$build/pyvenv/bin/meson"
            checker=/src/scripts/check-sgi-test-results.py
            expected="$build/nightly-expected.txt"
            names="$build/nightly-names.txt"
            workload="$NIGHTLY_WORKLOAD"
            case "$workload" in
              matrix)
                python3 "$checker" --list-meson-tests "$build" \
                  --prefix func-mips64- \
                  --exclude-suite func-diag \
                  --exclude-suite func-install \
                  --exclude-suite func-openbsd > "$expected"
                jobs=8
                ;;
              diag-a)
                printf "%s\n" \
                  func-mips64-irix_diag func-mips64-irix_diag_origin200 \
                  > "$names"
                python3 "$checker" --list-meson-tests "$build" \
                  --names-from "$names" > "$expected"
                jobs=1
                ;;
              diag-b)
                printf "%s\n" \
                  func-mips64-irix_diag_origin2000_one_node \
                  func-mips64-irix_diag_origin2000_pci_shoehorn \
                  > "$names"
                python3 "$checker" --list-meson-tests "$build" \
                  --names-from "$names" > "$expected"
                jobs=1
                ;;
              diag-c)
                printf "%s\n" \
                  func-mips64-irix_diag_origin2000_pci_carrier \
                  func-mips64-irix_diag_origin300 > "$names"
                python3 "$checker" --list-meson-tests "$build" \
                  --names-from "$names" > "$expected"
                jobs=1
                ;;
              install)
                printf "%s\n" func-mips64-openbsd_install > "$names"
                python3 "$checker" --list-meson-tests "$build" \
                  --names-from "$names" > "$expected"
                jobs=8
                ;;
              openbsd)
                printf "%s\n" \
                  func-mips64-openbsd_net_transfer func-mips64-xframe_pci \
                  > "$names"
                python3 "$checker" --list-meson-tests "$build" \
                  --names-from "$names" > "$expected"
                jobs=8
                ;;
              *)
                echo "unknown workload: $workload" >&2
                exit 2
                ;;
            esac

            mapfile -t targets < "$expected"
            if [ "${#targets[@]}" -eq 0 ]; then
              echo "no Meson targets selected for $workload" >&2
              exit 1
            fi
            MESON_BUILD_ROOT="$build" "$build/pyvenv/bin/python3" \
              /src/scripts/ci/provision-sgi-test-assets.py \
              --source /src --names "$expected" \
              --asset-root /src/sgi-assets
            unset CI_BOT_TOKEN
            logbase="nightly-$workload"
            find "$build/meson-logs" -maxdepth 1 -type f \
              -name "$logbase*.junit.xml" -delete
            test_rc=0
            if "$meson" test -C "$build" --setup qemu:thorough \
                --logbase "$logbase" --num-processes "$jobs" \
                --max-lines=300 --print-errorlogs "${targets[@]}"; then
              :
            else
              test_rc=$?
            fi
            report=$(find "$build/meson-logs" -maxdepth 1 -type f \
              -name "$logbase*.junit.xml" -print)
            if [ -z "$report" ] || \
                [ "$(printf "%s\n" "$report" | wc -l)" -ne 1 ]; then
              echo "expected one fresh JUnit report for $workload" >&2
              exit 1
            fi
            python3 "$checker" --junit "$report" --expect "$expected"
            exit "$test_rc"
          '
