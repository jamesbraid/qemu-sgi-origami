# SPDX-License-Identifier: BSD-3-Clause
# Fuel composition with a VPro board in its graphics slot.
configuration_version: 1
layers:
  - layers/architectures/sn1.yaml
  - layers/assemblies/ip34.yaml
  - layers/modules/fuel-base.yaml
  - layers/products/fuel-vpro.yaml
module_instances:
  - model: layers/modules/fuel-vpro.yaml
    prefix: vpro-
    parent: graphics-connector
    bus_bindings: {graphics-xio: crosstalk}
connector_population:
  - component: graphics-connector
    occupancy: occupied
    occupant: vpro-v12
    reason: One VPro board answers on the XBridge crossbar's widget 13.
    provenance: observed-hardware
    sources: ["boot-logs/tingo-sgi-fuel-irix-console.html raw HTML lines 138 to 146", "boot-logs/miod-openbsd-sgi-story-all.html raw HTML lines 5519 to 5541"]
