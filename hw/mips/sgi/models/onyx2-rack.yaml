# The Onyx2 rack: the eight-processor compute module with a BaseIO-G in IO1
# and one InfiniteReality pipe whose Xtown occupies IO3, Crossbow 0 widget F,
# where the real rack capture has it (docs/datasheets/onyx2.md, Rack).
# Launch it with tools/origami run irix --machine onyx2 (QEMU: -M onyx2,
# whose default topology this is).
configuration_version: 1
# The catalogue citation checker (tools/check-citations) resolves a sources: entry
# directly against docs/library/docs.tsv or docs/library/techpubs.tsv, or against a
# public commit. The key left here backs the seventeen connector_population
# selections below only, whose strict evidence policy
# (tools/origami_lib/model_validation.py) requires non-empty sources for each one
# regardless of provenance. It cites only this configuration's own reasoning, not
# an independently obtainable source, so the checker reports it under "facts whose
# only sources are internal documents" rather than resolving it; an empty-
# occupancy selection has no external document to cite in the first place.
sources:
  four-node-reference-composition: "The four-node reference composition explicitly selects this connector empty."
  rack-pipe-placement: "docs/datasheets/onyx2.md Xtown placement and pipe limits: the real rack capture has its one pipe at io3, Crossbow 0 widget F."
layers:
- layers/architectures/sn0.yaml
- layers/assemblies/ip27.yaml
- layers/modules/origin2000-module.yaml
- layers/products/onyx2-rack.yaml
module_instances:
- model: layers/modules/mediaio-g.yaml
  prefix: mediaio-
  parent: baseio
  bus_bindings: {upstream: baseio-pci}
- model: layers/modules/kona-pipe.yaml
  prefix: io3-
  parent: xio-slot-3
  bus_bindings: {upstream: xbow0-io3}
- model: layers/modules/kona-ge16-4.yaml
  prefix: io3-ge-
  parent: io3-pipe
  bus_bindings: {pipe-one-wire: io3-one-wire}
- model: layers/modules/ir-graphics-module.yaml
  prefix: gfx-
  parent: xio-slot-3
  physical_slot: {kind: io, number: 3}
  adopt_roots: true
  bus_bindings: {upstream: xbow0-io3, pipe-one-wire: io3-one-wire}
connector_population:
- component: router-1-external-0
  occupancy: &empty-occupancy empty
  reason: &empty-reason Select a module without optional boards or external fabric cables.
  provenance: &empty-provenance derived
  sources: [four-node-reference-composition]
- {component: router-1-external-1, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: router-1-external-2, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: router-2-external-0, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: router-2-external-1, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: router-2-external-2, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: pci-expansion, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- component: xio-slot-3
  occupancy: occupied
  occupant: gfx-xtown
  reason: >-
    Fit the Xtown for pipe 0 into IO3, the slot the real rack capture uses,
    cabled to the pipe in the graphics module.
  provenance: derived
  sources: [rack-pipe-placement]
- {component: xio-slot-4, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-5, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-6, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-7, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-8, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-9, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-10, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-11, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
- {component: xio-slot-12, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [four-node-reference-composition]}
