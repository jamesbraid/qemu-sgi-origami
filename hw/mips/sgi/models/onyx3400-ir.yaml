# SPDX-License-Identifier: BSD-3-Clause
# Onyx 3400 with InfiniteReality3: the brick set of 007-4264-002 Figure 1-10
# (four C-bricks, an I-brick, an N-brick and two G-bricks) as an emulation
# target. It differs from onyx3400.yaml in carrying one R-brick, and in
# cabling three pipes through the N-brick and none to the I-brick's port B,
# which the stock PROM cannot yet start with a pipe on it; the product layer
# has the reasons. Resolve before validation or generation.
configuration_version: 1
layers:
  - layers/architectures/sn1.yaml
  - layers/assemblies/ip35.yaml
  - layers/products/onyx3400-ir.yaml
