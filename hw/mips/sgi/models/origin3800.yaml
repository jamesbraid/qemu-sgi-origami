module_instances:
  - model: layers/modules/r-brick.yaml
    prefix: rbrick0-
    parent: rack
    # The two router-to-router cables are product buses.
    omit_buses: [port-1-cable, port-6-cable]
  - model: layers/modules/r-brick.yaml
    prefix: rbrick1-
    parent: rack
    # The two router-to-router cables are product buses.
    omit_buses: [port-1-cable, port-6-cable]
  - model: layers/modules/c-brick.yaml
    prefix: c0-
    parent: rack
    observed_hardware: &cbrick-basis
      mode: projected
      sources: [qemu:docs/system/mips/sgi/hardware/bedrock.rst#sgi-sn-family-bedrock]
      note: >-
        The C-brick layer's Bedrock identity, revision 2 at 200 MHz, is what
        every published Origin 3000 inventory reports; it is not a capture of
        this C-brick.
  - model: layers/modules/c-brick.yaml
    prefix: c1-
    parent: rack
    observed_hardware: *cbrick-basis
  - model: layers/modules/c-brick.yaml
    prefix: c2-
    parent: rack
    observed_hardware: *cbrick-basis
  - model: layers/modules/c-brick.yaml
    prefix: c3-
