blocks:
  model-cbrick-links:
    kind: cbrick-links
    reason: "{c} on {r} port {port}."
    sources: ["007-4311-002 printed pages 36 and 37: a C-brick is cabled only to router port 2, 3, 4 or 5"]
  model-link-ports:
    kind: link-ports
    reason: "{own} port {port} cabled to {other} port {other_port}, as the cabling draft's table has it (inferred)."
    sources: ["007-4311-002 printed pages 36 and 37: ports 1, 6, 7 and 8 join R-bricks", "108-xxxx-PR2 Table 2-23: the R-brick cables (a preliminary draft, inferred)"]
  model-empty-ports:
    kind: empty-ports
    order: port
    routers: [rbrick16, rbrick17, rbrick18, rbrick19]
    groups:
      - ports: [1, 2, 5, 6]
        reason: A MetaRouter's ports 3, 4, 7 and 8 carry the rack-router uplinks; the others join MetaRouters in larger systems only.
        sources: ["007-4311-002 printed page 58: the 256-processor interconnect drawing numbers 3, 4, 7 and 8 beside each MetaRouter", "108-xxxx-PR2 printed page 2-79, Table 2-23: no two MetaRouters are cabled together at 256 processors"]
  model-xio-empty:
    kind: empty-components
    cbricks_from: 1
    suffix: -xio-ii-connector
    reason: This composition fits one I/O brick, on C-brick 0.
    sources: ["007-4311-002 printed pages 55 and 89: one I-brick on the first C-brick's XIO (II) connector"]
  model-router-instances:
    kind: instances
    model: layers/modules/r-brick.yaml
    prefixes: [rbrick00, rbrick01, rbrick02, rbrick03, rbrick04, rbrick05, rbrick06, rbrick07, rbrick08, rbrick09, rbrick10, rbrick11, rbrick12, rbrick13, rbrick14, rbrick15, rbrick16, rbrick17, rbrick18, rbrick19]
    parent: rack
    comment: The router-to-router cables are product buses.
    omit_buses: [port-1-cable, port-6-cable, port-7-cable, port-8-cable]
  model-cbrick-instances:
    kind: instances
    model: layers/modules/c-brick.yaml
    cbricks_from: 1
    parent: rack
    alias: cbrick-basis
  layer-bedrock-aliases:
    kind: aliases
    cbricks_from: 1
    suffix: -bedrock
    anchor: cbrick-bedrock
  layer-l1-aliases:
    kind: aliases
    cbricks_from: 1
    suffix: -l1
    anchor: cbrick-l1
  layer-chassis-numbers:
    kind: chassis-numbers
    reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit {unit} of rack {rack}."
  layer-node-identities:
    kind: identities
    of: cbricks
    suffix: -bedrock
    serial_base: 0x51454d554e00
    reason: Synthetic node identity N{i}, carrying the "QEMU" marker; not hardware evidence.
  layer-router-identities:
    kind: identities
    of: routers
    suffix: -router
    serial_base: 0x51454d555200
    reason: Synthetic router descriptor identity; no physical barcode is claimed.
  layer-link-buses:
    kind: link-buses
    sources: [007-4311-002-256p, 007-4311-002-router-ports, 108-xxxx-PR2-256p]
    notes: The port numbers are the cabling draft's table (inferred, not established).
  layer-cbrick-cables:
    kind: cbrick-cables
    sources: [007-4311-002-router-ports, 007-4240-002-cbrick-ports]
  layer-link-connections:
    kind: link-connections
    sources: [007-4311-002-256p, 007-4311-002-router-ports, 108-xxxx-PR2-256p]
  layer-router-numbers:
    kind: chassis-numbers
    of: routers
    suffix: -brick
    reason: "The cabling draft's 256-processor table, Table 2-23: this R-brick at unit {unit} of rack {rack}."
  layer-router-roles:
    kind: router-roles
    reasons:
      14: "{r} at unit {unit} of rack {rack} takes rack-router uplinks on ports 3, 4, 7 and 8, so it is a MetaRouter. The cabling draft labels no role: inferred from the wiring."
