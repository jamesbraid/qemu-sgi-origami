blocks:
  model-cbrick-links:
    kind: cbrick-links
    reason: "{c} on {r} port {port}."
    sources: ["007-4311-002 printed pages 36 and 37: a C-brick is cabled only to router port 2, 3, 4 or 5"]
  model-link-ports:
    kind: link-ports
    reason: "{own} port {port} cabled to {other} port {port}, as the cabling draft's table has it (inferred)."
    sources: ["007-4311-002 printed pages 36 and 37: ports 1, 6, 7 and 8 join R-bricks", "108-xxxx-PR2 Table 2-18: the R-brick cables (a preliminary draft, inferred)"]
  model-xio-empty:
    kind: empty-components
    cbricks_from: 1
    suffix: -xio-ii-connector
    reason: This composition fits one I/O brick, on C-brick 0.
    sources: ["007-4311-002 printed pages 55 and 89: one I-brick on the first C-brick's XIO (II) connector"]
  model-router-instances:
    kind: instances
    model: layers/modules/r-brick.yaml
    prefixes: [rbrick0, rbrick1, rbrick2, rbrick3, rbrick4, rbrick5, rbrick6, rbrick7]
    parent: rack
    comment: The router-to-router cables are product buses.
    omit_buses: [port-1-cable, port-6-cable, port-7-cable, port-8-cable]
  model-cbrick-instances:
    kind: instances
    model: layers/modules/c-brick.yaml
    cbricks_from: 1
    parent: rack
    alias: cbrick-basis
  layer-bedrock-aliases:
    kind: aliases
    cbricks_from: 1
    suffix: -bedrock
    anchor: cbrick-bedrock
  layer-l1-aliases:
    kind: aliases
    cbricks_from: 1
    suffix: -l1
    anchor: cbrick-l1
  layer-router-numbers:
    kind: chassis-numbers
    of: routers
    suffix: -brick
    reason: "The cabling draft's 128-processor table, Table 2-18: this R-brick at unit {unit} of rack {rack}."
  layer-chassis-numbers:
    kind: chassis-numbers
    reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit {unit} of rack {rack}."
  layer-node-identities:
    kind: identities
    of: cbricks
    suffix: -bedrock
    serial_base: 0x51454d554e00
    reason: Synthetic node identity N{i}, carrying the "QEMU" marker; not hardware evidence.
  layer-router-identities:
    kind: identities
    of: routers
    suffix: -router
    serial_base: 0x51454d555200
    reason: Synthetic router descriptor identity; no physical barcode is claimed.
  layer-link-buses:
    kind: link-buses
    sources: [007-4311-002-128p, 007-4311-002-router-ports, 108-xxxx-PR2-128p]
    notes: The port numbers are the cabling draft's table (inferred, not established).
  layer-cbrick-cables:
    kind: cbrick-cables
    sources: [007-4311-002-router-ports, 007-4240-002-cbrick-ports]
  layer-link-connections:
    kind: link-connections
    sources: [007-4311-002-128p, 007-4311-002-router-ports, 108-xxxx-PR2-128p]
