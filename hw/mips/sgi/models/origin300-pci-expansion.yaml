# SPDX-License-Identifier: BSD-3-Clause
# Origin 300 with a PCI expansion module on its LINK (NI) connector.
configuration_version: 1
layers:
  - layers/architectures/sn1.yaml
  - layers/assemblies/ip45.yaml
  - layers/products/origin300-pci-expansion.yaml
module_instances:
  - model: layers/modules/origin300-base.yaml
    prefix: compute-
    module_role: MASTER
    parent: compute-module
    adopt_roots: true
    observed_hardware:
      mode: direct
      sources: ["web:marc-openbsd-sgi-139223952727384 lines 17 to 62: a direct-cabled pair's PROM hinv, module 001c01 with four 500 MHz R14000s, 2 MB caches, and bridges at widgets 14 and 15", "web:nekonomicon-17314 IRIX hinv of a direct-cabled pair, module 001c01 node and IO-8 at xtalk 14 and 15"]
      note: >-
        Reuses the existing Origin 300 compute component observations. The
        PCI expansion connection is the documented direct LINK (NI) cabling;
        how the model builds it carries the approximations the product layer
        lists.
  - model: layers/modules/origin300-pci-expansion-experiment.yaml
    prefix: expansion-
    parent: compute-link-connector
    bus_bindings: {upstream-numalink: expansion-cable}
connector_population:
  - component: compute-xio-connector
    occupancy: empty
    reason: The PCI expansion module uses LINK/NI rather than the rear XIO connector.
    provenance: vendor-document
    sources: ["007-4499-002 printed pages 12 and 38"]
