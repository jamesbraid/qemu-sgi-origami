configuration_version: 1
layers:
- layers/architectures/sn1.yaml
- layers/assemblies/ip45.yaml
- layers/products/origin300-numalink-pci-expansion-experiment.yaml
module_instances:
- model: layers/modules/origin300-base.yaml
  prefix: master-
  parent: master-module
  adopt_roots: true
  observed_hardware:
    mode: projected
    sources:
    - 'boot-logs/openbsd-sgi-list/marc-139223952727384-origin-300-numalink-1.html lines 17 to 62: a direct-cabled
      pair''s PROM hinv, module 001c01 with four 500 MHz R14000s, 2 MB caches, and bridges at widgets
      14 and 15'
    - 'boot-logs/nekonomicon-thread-17314-origin300-8cpu-hinv-prom.html: IRIX hinv of a direct-cabled
      pair, module 001c01 node and IO-8 at xtalk 14 and 15'
    note: Transfers published matching Origin 300 component observations into this explicit routed experiment.
      It does not establish this selected cabling as observed hardware.
- model: layers/modules/origin300-base.yaml
  prefix: slave-
  parent: slave-module
  adopt_roots: true
  observed_hardware:
    mode: projected
    sources:
    - 'boot-logs/openbsd-sgi-list/marc-139223952727384-origin-300-numalink-1.html lines 17 to 62: a direct-cabled
      pair''s PROM hinv, module 001c02 with four 500 MHz R14000s, 2 MB caches, and bridges at widgets
      14 and 15'
    - 'boot-logs/nekonomicon-thread-17314-origin300-8cpu-hinv-prom.html: IRIX hinv of a direct-cabled
      pair, module 001c02 node and IO-8 at xtalk 14 and 15'
    note: Transfers published matching Origin 300 component observations into this explicit routed experiment.
      It does not establish this selected cabling as observed hardware.
- model: layers/modules/origin300-pci-expansion-experiment.yaml
  prefix: expansion-
  parent: rack
  bus_bindings:
    upstream-numalink: expansion-cable
