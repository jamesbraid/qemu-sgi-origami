# SPDX-License-Identifier: BSD-3-Clause
#
# The public references the machine models cite. A model citation names an
# entry here by its id, so a reader can find and check the source without
# any other repository. references.schema.json describes the fields, and
# scripts/sgi_model/citations.py checks the models' citations against them.
#
# rights says what a reader may do with the source: published documents and
# public-web pages can be read where the url points; obtain-only sources are
# public but carry no redistribution grant, so cite and link them, never
# copy them into this tree.

references_version: 1

trees:
  linux:
    title: "Linux kernel, mainline"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
    browse: https://github.com/torvalds/linux
  linux-history:
    title: "Linux kernel history from before the move to git"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/tglx/history.git
  linux-mips:
    title: "Linux/MIPS tree, including the abandoned linux-2.4 branch"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/ralf/linux.git
  openbsd-sgi:
    title: "OpenBSD with the sgi port kept alive, branch sgi-is-alive-at-7.9"
    url: https://github.com/the-machine-hall/openbsd-sgi
    branch: sgi-is-alive-at-7.9
  linux-ip35:
    title: "Linux kernel with IP35 platform support, branch sgi-ip35"
    author: Alastair Bridgewater
    url: https://archive.org/download/git.linux-mips.org_bundles_20240209/git%3A__git.linux-mips.org_pub_scm_nyef_linux-ip35.bundle
    sha256: 3df0ede74539ed9a08ec70ba2fb945b8aa7ebda1b551b18e8c5a96b97b83572c
    branch: sgi-ip35
    note: >-
      An out-of-tree Linux port to the Origin 300 and Origin 3000 (GPL). Its
      original home, git.linux-mips.org/pub/scm/nyef/linux-ip35, is gone;
      an FTP index of it survives at
      https://www.mmnt.net/db/0/0/ftp.linux-mips.org/pub/scm/nyef/linux-ip35/.
      The url is a git bundle of the whole repository kept by the Internet
      Archive in the Linux/MIPS bundle set of 2024-02-09. Clone it with
      git clone, then check out the cited commit.
  netbsd:
    title: "NetBSD source, mainline"
    url: https://github.com/NetBSD/src.git
    browse: https://github.com/NetBSD/src

