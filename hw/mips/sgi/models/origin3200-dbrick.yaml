# SPDX-License-Identifier: BSD-3-Clause
# Origin 3200 composition: two four-processor C-bricks, an I-brick and a
# D-brick on the I-brick's Fibre Channel loop. Resolve before validation or
# generation.
configuration_version: 1
# A reference on the Origin 3200 rules: the Fibre Channel cable to the
# D-brick is stated here and not built, so the emulator takes no module
# number for it.
model_role: reference
layers:
  - layers/architectures/sn1.yaml
  - layers/assemblies/ip35.yaml
  - layers/products/origin3200.yaml
connector_population:
  - component: c0-link-connector
    occupancy: cabled
    peer: c1-link-connector
    reason: The two C-bricks join LINK (NI) to LINK (NI), with no R-brick.
    provenance: vendor-document
    sources: ["007-4240-002 printed pages 124 and 125: the LINK (NI) connector joins a C-brick to another C-brick when the system has no R-brick"]
  - component: c1-link-connector
    occupancy: cabled
    peer: c0-link-connector
    reason: The two C-bricks join LINK (NI) to LINK (NI), with no R-brick.
    provenance: vendor-document
    sources: ["007-4240-002 printed pages 124 and 125: the LINK (NI) connector joins a C-brick to another C-brick when the system has no R-brick"]
module_instances:
  # module_role marks c0, the bottom C-brick that carries the console and
  # the I-brick, as the console node. No source gives the two C-bricks'
  # L1s a master and slave designation, and this asserts none.
  - model: layers/modules/c-brick.yaml
    prefix: c0-
    module_role: MASTER
    parent: rack
    observed_hardware: &cbrick-basis
      mode: projected
      sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-bedrock]
      note: >-
        The C-brick layer's Bedrock identity, revision 2 at 200 MHz, is what
        every published Origin 3000 inventory reports; it is not a capture of
        this C-brick.
  - model: layers/modules/c-brick.yaml
    prefix: c1-
    module_role: SLAVE
    parent: rack
    observed_hardware: *cbrick-basis
  - model: layers/modules/i-brick.yaml
    prefix: ibrick-
    parent: rack
    bus_bindings: {host-port-a-xio: c0-xio-ii}
    observed_hardware:
      mode: direct
      sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-ibrick]
      note: >-
        The IO7 device identities are the closure record's own three
        independent owners' IRIX inventories, reused directly for this
        reference I-brick rather than a distinct capture of this exact set.
  # Loop A's GBIC input is cabled to the I-brick's Fibre Channel card
  # (007-4240-002 printed page 168), so the D-brick's disks share that
  # loop with the I-brick's own boot disks (printed page 134). The model
  # has no Fibre Channel bus record, so the cable is stated here and not
  # built; the disks join the loop through the sgi-dbrick device.
  - model: layers/modules/d-brick.yaml
    prefix: dbrick-
    parent: rack
links:
  # The two C-brick L1s reach each other over the NUMAlink cable
  # (108-0240-002 printed page 2-47).
  - kind: l1-peer
    source: c0-l1
    target: c1-l1
  - kind: l1-peer
    source: c1-l1
    target: c0-l1
