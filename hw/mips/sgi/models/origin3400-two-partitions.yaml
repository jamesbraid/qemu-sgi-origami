# SPDX-License-Identifier: BSD-3-Clause
# Two partitions of an Origin 3400 in one cabinet: two C-bricks on one
# R-brick and an I-brick on each. Resolve before validation or generation.
configuration_version: 1
layers:
  - layers/architectures/sn1.yaml
  - layers/assemblies/ip35.yaml
  - layers/products/origin3400-two-partitions.yaml
connector_population:
  - component: c0-link-connector
    occupancy: cabled
    peer: rbrick-port-2
    reason: C-brick 0 on R-brick port 2, one of the four ports a C-brick may use.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: four C-bricks on one R-brick, each on port 2, 3, 4 or 5"]
  - component: rbrick-port-2
    occupancy: cabled
    peer: c0-link-connector
    reason: C-brick 0 on R-brick port 2, one of the four ports a C-brick may use.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: four C-bricks on one R-brick, each on port 2, 3, 4 or 5"]
  - component: c1-link-connector
    occupancy: cabled
    peer: rbrick-port-3
    reason: C-brick 1 on R-brick port 3, one of the four ports a C-brick may use.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: four C-bricks on one R-brick, each on port 2, 3, 4 or 5"]
  - component: rbrick-port-3
    occupancy: cabled
    peer: c1-link-connector
    reason: C-brick 1 on R-brick port 3, one of the four ports a C-brick may use.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: four C-bricks on one R-brick, each on port 2, 3, 4 or 5"]
  - component: rbrick-port-4
    occupancy: empty
    reason: Port 4 carries no cable in this two-C-brick composition.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: a C-brick uses router port 2, 3, 4 or 5"]
  - component: rbrick-port-5
    occupancy: empty
    reason: Port 5 carries no cable in this two-C-brick composition.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: a C-brick uses router port 2, 3, 4 or 5"]
  - component: rbrick-port-1
    occupancy: empty
    reason: Port 1 carries no cable in a single-router system; it joins another R-brick, and this composition has one.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: the 8- to 16-processor interconnect uses router ports 2 to 5 only"]
  - component: rbrick-port-6
    occupancy: empty
    reason: Port 6 carries no cable in a single-router system; it joins another R-brick, and this composition has one.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: the 8- to 16-processor interconnect uses router ports 2 to 5 only"]
  - component: rbrick-port-7
    occupancy: empty
    reason: Port 7 carries no cable in a single-router system; it joins another R-brick, and this composition has one.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: the 8- to 16-processor interconnect uses router ports 2 to 5 only"]
  - component: rbrick-port-8
    occupancy: empty
    reason: Port 8 carries no cable in a single-router system; it joins another R-brick, and this composition has one.
    provenance: vendor-document
    sources: ["007-4311-002 printed pages 36 and 55: the 8- to 16-processor interconnect uses router ports 2 to 5 only"]
  - component: ibrick0-port-b
    occupancy: empty
    reason: The I-brick's port B is left uncabled; one cable to C-brick 0 is fitted.
    provenance: vendor-document
    sources: ["108-0240-002 printed pages 2-28 and 2-29: I-brick ports A and B go to compute nodes"]
  - component: ibrick1-port-b
    occupancy: empty
    reason: The I-brick's port B is left uncabled; one cable to C-brick 1 is fitted.
    provenance: vendor-document
    sources: ["108-0240-002 printed pages 2-28 and 2-29: I-brick ports A and B go to compute nodes"]
module_instances:
  - model: layers/modules/r-brick.yaml
    prefix: rbrick-
    parent: rack
  - model: layers/modules/c-brick.yaml
    prefix: c0-
    parent: rack
    observed_hardware: &cbrick-basis
      mode: projected
      sources: [qemu:docs/system/mips/sgi/hardware/bedrock.rst#sgi-sn-family-bedrock]
      note: >-
        The C-brick layer's Bedrock identity, revision 2 at 200 MHz, is what
        every published Origin 3000 inventory reports; it is not a capture of
        this C-brick.
  - model: layers/modules/c-brick.yaml
    prefix: c1-
    parent: rack
    observed_hardware: *cbrick-basis
  - model: layers/modules/i-brick.yaml
    prefix: ibrick0-
    parent: rack
    bus_bindings: {host-port-a-xio: c0-xio-ii}
    observed_hardware:
      mode: direct
      sources: [qemu:docs/system/mips/sgi/hardware/bricks.rst#sgi-sn-family-ibrick]
      note: >-
        The IO7 device identities are the closure record's own three
        independent owners' IRIX inventories, reused directly for this
        reference I-brick rather than a distinct capture of this exact set.
  - model: layers/modules/i-brick.yaml
    prefix: ibrick1-
    parent: rack
    bus_bindings: {host-port-a-xio: c1-xio-ii}
    observed_hardware:
      mode: direct
      sources: [qemu:docs/system/mips/sgi/hardware/bricks.rst#sgi-sn-family-ibrick]
      note: >-
        The IO7 device identities are the closure record's own three
        independent owners' IRIX inventories, reused directly for this
        reference I-brick rather than a distinct capture of this exact set.
