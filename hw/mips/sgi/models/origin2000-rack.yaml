# SPDX-License-Identifier: BSD-3-Clause
# The Origin 2000 rack module: the eight-processor module with its two
# Standard Routers, one to four node boards (nodes=, four by default), the
# BaseIO in IO1 and every other XIO slot empty. A shipped Origin 2000 has no
# graphics. Launch it with tools/origami run irix --machine origin2000
# (QEMU: -M origin2000, whose default topology this is).
configuration_version: 1
layers:
- layers/architectures/sn0.yaml
- layers/assemblies/ip27.yaml
- layers/modules/origin2000-module.yaml
- layers/products/origin2000-rack.yaml
connector_population:
- component: router-1-external-0
  occupancy: &empty-occupancy empty
  reason: &empty-reason Select a module without optional boards or external fabric cables.
  provenance: &empty-provenance derived
  sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-board-devices]
- {component: router-1-external-1, occupancy: *empty-occupancy, reason: *empty-reason, provenance: *empty-provenance, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-board-devices]}
