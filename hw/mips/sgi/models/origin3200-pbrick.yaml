# SPDX-License-Identifier: BSD-3-Clause
# Origin 3200 reference composition with a P-brick: the dual-C-brick
# bundle, its I-brick on the first C-brick, and a P-brick on the second.
# Resolve before validation or generation.
configuration_version: 1
# A reference on the Origin 3200 rules: the emulator builds no X- or
# P-brick yet.
model_role: reference
layers:
  - layers/architectures/sn1.yaml
  - layers/assemblies/ip35.yaml
  - layers/products/origin3200.yaml
module_instances:
  - model: layers/modules/c-brick.yaml
    prefix: c0-
    module_role: MASTER
    parent: rack
    observed_hardware: &cbrick-basis
      mode: projected
      sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-bedrock]
      note: >-
        The C-brick layer's Bedrock identity, revision 2 at 200 MHz, is what
        every published Origin 3000 inventory reports; it is not a capture of
        this C-brick.
  - model: layers/modules/c-brick.yaml
    prefix: c1-
    module_role: SLAVE
    parent: rack
    observed_hardware: *cbrick-basis
  - model: layers/modules/i-brick.yaml
    prefix: ibrick-
    parent: rack
    bus_bindings: {host-port-a-xio: c0-xio-ii}
    observed_hardware:
      mode: direct
      sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-ibrick]
      note: >-
        The IO7 device identities are the closure record's own three
        independent owners' IRIX inventories, reused directly for this
        reference I-brick rather than a distinct capture of this exact set.
  - model: layers/modules/p-brick.yaml
    prefix: pbrick-
    parent: rack
    bus_bindings: {host-port-a-xio: c1-xio-ii}
xio_cables:
  - id: c1-to-pbrick
    ends: [c1-xio-ii-connector, pbrick-port-a]
    provenance: vendor-document
    sources: ["007-4240-002 printed page 124: the XIO (II) connector joins a C-brick to an I-, P- or X-brick", "007-4240-002 printed page 125, Table 4-2: a C-brick has one XIO (II) connector"]
    notes: >-
      Each C-brick has one XIO (II) connector and the first carries the
      I-brick, so the P-brick hangs off the second, at U0 port A by this
      composition's choice. The builder refuses the brick's four links
      between U0 and U1 and U2 until a reviewed contract gives the
      downstream chips' mode, so the entry is a reference only.
