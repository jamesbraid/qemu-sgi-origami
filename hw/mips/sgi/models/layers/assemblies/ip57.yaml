layer_version: 1
layer:
  kind: assembly
  id: ip57
  platform: sn2
  requires: {architecture: ia64}
  contract: {board_ip: IP57}
  capacity:
    cpu_slots_per_node: 2
    dimm_slots_per_node: 1
    memory_banks_per_node: 1
    dimms_per_bank: 1
    supported_bank_sizes_mib: [2048]
    provenance: derived
    sources: ["qemu:docs/system/ia64/altix350.rst#altix350"]
    notes: The model fits exactly 2 GiB; its DIMM and bank layout is a model selection, not socket wiring.
  memory_kits:
  - id: selected-2g
    dimms: 1
    dimm_mib: 2048
    banks: [2048]
    provenance: derived
    sources: ["qemu:docs/system/ia64/altix350.rst#altix350"]
