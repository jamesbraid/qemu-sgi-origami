# SPDX-License-Identifier: BSD-3-Clause
# IP35 C-brick board identity and documented slot capacity.
layer_version: 1
layer:
  kind: assembly
  id: ip35
  platform: ip35
  requires: {architecture: sn1}
  contract: {board_ip: IP35}
  capacity:
    cpu_slots_per_node: 4
    dimm_slots_per_node: 8
    memory_banks_per_node: 8
    # A DIMM pair holds two banks, each split across both DIMMs, so eight
    # DIMMs carry eight banks and a bank is as large as one of its DIMMs.
    dimms_per_bank: 1
    banks_per_dimm_pair: 2
    supported_bank_sizes_mib: [256, 512, 1024]
    provenance: vendor-document
    sources: ["108-0240-002 printed page 2-4: two or four processors on one or two PIMMs", "108-0240-002 printed pages 2-5 and 2-6: 512 MB to 8 GB in up to eight banks, banks 2n and 2n+1 on DIMM pair n, the two DIMMs of a pair matching, 256 MB, 512 MB and 1 GB DIMMs"]
    notes: >-
      Two processors on one PIMM or four on two. The bank sizes are the
      DIMM sizes the architecture manual lists; that a bank is as large as
      one of its pair's DIMMs is inferred from eight banks on four pairs.
  memory_kits:
    - id: kit-4096-eight-512-banks
      dimms: 8
      dimm_mib: 512
      banks: [512, 512, 512, 512, 512, 512, 512, 512]
      provenance: observed-hardware
      sources: ["web:nekonomicon-16723604 hinv -mv of an Origin 3200, each module's Bank 0 to Bank 7 lines, 512 MB each and 4096 MB per module", "108-0240-002 printed pages 2-5 and 2-6: eight 512 MB banks give 4 GB"]
