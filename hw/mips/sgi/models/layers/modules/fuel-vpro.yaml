# SPDX-License-Identifier: BSD-3-Clause
# One VPro graphics board in the Fuel's graphics slot.
layer_version: 1
layer:
  kind: module
  id: fuel-vpro
  requires: {architecture: sn1}
  data:
    components:
      - id: v12
        name: VPro graphics board
        kind: board
        hardware_kind: odyssey
        provenance: derived
        identity:
          widget_revision: 10
          notes: >-
            Revision 0xa is the measured V12's, which IRIX prints as BUZZ
            B.1. An OpenBSD Fuel capture reports Odyssey revision 11 (B.2)
            on a board whose model is not stated. Two Fuel V10 boards have
            reported B.1 (030-1725-001) and B.2 (030-1826-002).
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/graphics.rst#sgi-graphics-odyssey]
        sources: [qemu:docs/system/mips/sgi/hardware/graphics.rst#sgi-graphics-odyssey-identity, "web:miod-openbsd-sgi-story raw HTML lines 5519 to 5541", "web:usenet-slrndi91sn ASTODY 030-1726-003 rev E at /hw/module/001c01/Ibrick/xtalk/13, Graphics board: V12"]
        notes: >-
          Fuels are captured with a V10 (ASTODYB 030-1725-001, 32 MiB) and
          with a V12 (ASTODY 030-1726-003) at this widget. The model fits
          the Odyssey device's default V12 configuration. Its one-wire
          record names the Octane V12 board, not ASTODY, and display output
          remains unverified.
    connections:
      - component: v12
        bus: graphics-xio
        role: endpoint
        provenance: derived
        sources: ["web:tingo-fuel-irix-console raw HTML lines 138 to 146", "web:miod-openbsd-sgi-story raw HTML lines 5519 to 5541"]
        notes: >-
          The board is the widget the system board's XBridge crossbar
          reaches at port 13; the connector carries that observed position.
