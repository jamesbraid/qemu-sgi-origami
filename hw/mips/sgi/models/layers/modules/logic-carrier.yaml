      - id: boot-flash
        name: boot flash
        kind: flash
        provenance: public-header
        parent: ip29-system-board
        description: One megabyte of firmware storage, presented at two addresses.
        views:
          - id: reset
            name: reset vector view
            space: memory
            offset: "0x1fc0_0000"
            size: "0x10_0000"
            notes: >-
              Where the processor's reset vector reaches it. The reset vector
              0xffff_ffff_bfc0_0000 lands in the **uncached** compatibility segment
              at 0xffff_ffff_a000_0000, not the cached one at
              0xffff_ffff_8000_0000 — the cached segment is what the guests read the
              firmware parameter block through. The two behave differently and the
              distinction has cost this team a week once already.
          - id: lboot
            name: Hub special view
            space: hub-special
            offset: "0x1000_0000"
            size: "0x1000_0000"
            notes: >-
              One region aliased into both views. Which bus the flash hangs off is
              settled — the memory and directory unit — and that also explains the
              part that looked odd: the reset vector reaches the flash in uncached
              *memory* space rather than through an I/O space because memory space
              is what that unit decodes, so the flash sits inside it rather than
              beside it. What remains open is narrower: how a compatibility-segment
              access physically resolves to flash rather than to memory at the same
              offset, traced in the compatibility-segment routing note, whose source
              reading is settled and three-sourced but whose hardware implication is
              contradicted by real-hardware evidence. The alias gives every guest
              what it expects meanwhile.
          - id: rboot
            name: remote Hub special view
            space: hub-special
            offset: "0x3000_0000"
            size: "0x1000_0000"
            notes: Node-explicit maintenance view of the same flash storage.
        datasheet_contracts: [docs/datasheets/boot-flash.md]
        sources: ["linux:arch/mips/include/asm/sn/sn0/addrs.h IP27PROM_FLASH_HDR and IP27PROM_FLASH_DATA, plus a mapped and an unmapped PROM base"]

      - id: rtc
        name: MK48T35-class Timekeeper
        kind: rtc
        provenance: vendor-source
        parent: ip29-system-board
        aliases: ["M48T35-70PCI (package marking)", "M48T35 (Linux driver name)", "DS1742W (what OpenBSD prints)", "DS1747"]
        description: Battery-backed non-volatile memory with a real-time clock, on the IOC3's byte bus.
        datasheet_contracts: [docs/datasheets/timekeeper.md]
        sources: ["photos/theretroweb-origin200/sgi-origin-1-6a784d737f602597049387.jpg battery-backed clock package, marked M48T35-70PCI"]
        notes: >-
          Byte-bus chip select 0 is what makes this a Timekeeper. Chip selects 1 and 2 mean a
          DS1687 instead, which is the Octane's clock and is indirectly addressed. The two are not
          interchangeable. The provenance is SGI's own clock driver for this generation rather than
          a guest's, and the distinction was worth making: mainline Linux does carry a driver for
          this part, but its build condition names no SGI machine at all, so citing it would have
          been a fact about a driver that exists rather than about this board. The public header
          that does name this board defines its subsystem identifier and says nothing about a clock.

      - id: board-identity
        name: board-identity NIC
        kind: identity
        provenance: derived
        parent: origin200-chassis
        identity:
          part: "030-1244-001"
        aliases: ["Number In a Can", "DS2505-family serial EPROM", "one-wire family code 0x0b — how Linux recognises it on this master"]
        description: >-
          The board-identity NIC reached through the Bridge's own one-wire master.
          Its physical attachment within the Origin 200 assembly is not established.
        notes: >-
          What must be on the far side is specific: Linux looks for family code 0x0b on this
          master and ignores anything else, then reads the first 64 bytes as two independent
          32-byte blocks, each with an inverted CRC-16 in its last two bytes so a CRC over the
          whole block leaves a fixed residue. Both blocks must check out or the memory is treated
          as unreadable. Existence and contents are observed: a real Origin 200 printed this
          board's identity string. Placement behind the Bridge one-wire master is derived by
          pairing that observation with the cited public Linux driver, not claimed as part of the
          hardware capture.

