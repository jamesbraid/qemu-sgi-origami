              OpenBSD and the IRIX headers all give this offset, so it is a genuine
              decode. Counts at 1.25 MHz.
          - id: interrupt-modify
            name: interrupt-modify register
            space: io
            offset: "0x0180_0090"
            size: "0x8"
            notes: >-
