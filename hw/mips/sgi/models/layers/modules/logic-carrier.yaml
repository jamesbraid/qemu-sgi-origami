              bank. This is the **node-named** half of the Hub's small window, not
              the local half at 0x0100_0090. Both halves decode and only one is what
              the Bridge writes; Linux and OpenBSD compute this address from
              opposite directions and agree on it.
        sources: ["linux:arch/mips/include/asm/sn/sn0/hubpi.h"]

