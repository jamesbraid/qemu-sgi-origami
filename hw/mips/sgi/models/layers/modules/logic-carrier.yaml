      - id: ioc3-uart-a
        name: IOC3 serial port A
        kind: subfunction
        provenance: public-header
        parent: ioc3
        description: The console UART. Presents a 16550 programming model over a DMA ring-descriptor engine.
        regions:
          - id: console-port
            name: console port
            relative_to: ioc3
            offset: "0x20178"
            size: "0x8"
            notes: >-
              Measured from the chip's own register block, not from an address
              space — computing an absolute address by adding this to a space base
              gives a number that means nothing. The chip's serial block sits in a
              window at 0x20000 and port A is at 0x178 inside it, so 0x20178 is the
              offset that reaches the port's first 16550 register. Its low twelve
              bits, 0x178, are separately what a guest reads to decide which
              controller generation this is; at or above 0x380 it would read a
              configuration register that does not exist here. Two facts, two
              masks, one number.
        sources: ["linux:arch/mips/include/asm/sn/ioc3.h names UARTA and UARTB"]

