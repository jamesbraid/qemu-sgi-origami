        description: Number In a Can (NIC) holding the board's Ethernet address.
        sources: ["boot-logs/dmesgd-ip27/dmesgd-8994.html lines 197-199, observes owmac0 on the real Origin 200"]
        notes: >-
          The capture observes owmac0 and prints the low seven-bit family type. The full family
          byte is decoder-derived rather than directly observed, so this projection keeps the
          component generic and leaves that decoder detail in the cited IOC3 datasheet.

      - id: pcf8584
        name: PCF8584
        kind: bus-controller
        provenance: observed-hardware
        parent: ip29-system-board
        aliases: ["PCF8584T (package marking)", "I2C chip (the firmware's own progress-code table)", "PCD8584 (a different Philips part, miscited for this one in a vendor driver comment)"]
        description: >-
          The Philips I2C-bus controller wired into the Hub's local register space.
          It is the only path from the Hub onto the I2C bus, and the system
          controller answers as a slave on that bus. A generic third-party part
          rather than an SGI design, which is why it is named by its part number.
        regions:
          - id: data-register
            name: Data register
            relative_to: hub
            offset: "0x22_0000"
          - id: control-status-register
            name: Control/status register
            relative_to: hub
            offset: "0x22_0008"
            notes: >-
              Write-only control and read-only status share this offset; which one
              an access reaches is decided by the serial-interface-enable bit.
        datasheet_contracts: [docs/datasheets/pcf8584-elsc.md]
        sources: ["photos/theretroweb-origin200/sgi-origin-1-6a784d737f602597049387.jpg I2C section, package marked PCF8584T", "108-0161-002 Origin2000 and Onyx2 Power-On Diagnostics, PDF page 113", "108-0164-002 Origin2000 and Onyx2 Diagnostic Roadmap, PDF page 86"]
        notes: >-
          The Origin 200 board photograph directly shows the PCF8584T package. The
          Origin 2000 and Onyx2 manuals independently identify the shared firmware's
          initialization progress code and tie the controller to the system-controller
          path. A real PCF8584 can also be addressed as a slave.

      - id: sgi-elsc
        name: ELSC
        kind: system-controller
        system_controller: {kind: msc}
        provenance: vendor-document
        parent: cpu-module
        aliases: ["MSC", "Module System Controller", "Entry Level System Controller"]
        description: >-
          The Origin 200's instance of the SN0 Module System Controller (MSC;
          "ELSC" is SGI's own older name for the same part): a separate board
          answering as a slave on the I2C bus the PCF8584 masters. It takes a
          checksummed ASCII command and response protocol covering power control,
          reset and switch readback on the Origin 200 (the family protocol also
          carries an 8-character display and multi-module commands the Origin 200
          has no hardware for), and separately multiplexes a serial terminal on
          its own rear diagnostic connector onto the same link.
        datasheet_contracts: [docs/datasheets/pcf8584-elsc.md]
        sources: ["007-3708-002 Origin 200 and Origin 200 GIGAchannel Owner's Guide, printed page 123"]
        notes: >-
          This one is attested by our own machine's manual rather than a
          neighbour's: the Origin 200 Owner's Guide documents reaching the
          controller with a control-T escape and gives its prompt. The Origin 2000
          and Onyx2 carry a different controller with a keyswitch, an
          eight-character display and eight debug switches, and none of that
          describes this part.

      - id: i2c-nvram
        name: I2C configuration NVRAM
        kind: flash
        provenance: vendor-source
        parent: cpu-module
        aliases: ["NVRAM (the firmware's own term for it)"]
        description: >-
          A serial non-volatile store answering as a slave on the same I2C bus the
          system controller sits on. It holds the module, partition, domain, cluster
          and cell numbers, the supervisor password, the debug-switch values and the
          built-in-self-test flag.
        datasheet_contracts:
          - docs/datasheets/pcf8584-elsc.md
        notes: >-
          NOT the same part as the machine's other non-volatile store: the clock
          component is a battery-backed Timekeeper on the I/O controller's BYTE BUS at
          chip select 0, and this is a separate device on the HUB'S I2C BUS, reached by
          raw transactions the system controller never sees. The distinction's history
          is in the pcf8584-elsc datasheet's behavioral notes. It answers EIGHT
          CONSECUTIVE SLAVE ADDRESSES FROM 0x50, the top three bits of an eleven-bit
          byte address choosing among them and the low
          byte addressing within one. Whether that is one 2 KB part consuming eight addresses or
          several smaller ones is not established, and the firmware cannot tell either. The system
          controller's own reserved area is the last of the eight, which SGI's PROM Technical
          Reference corroborates independently by reserving the top 256 bytes for the controller's
          use. The `kind` is the least-wrong available value: this is an EEPROM rather than flash,
          and what the field is carrying here is the role of non-volatile storage.

      - id: i2c-device-20
        name: Unidentified I2C device at slave address 0x20
        kind: flash
        provenance: vendor-source
        parent: cpu-module
        description: >-
          A single-byte read and write target answering on the Hub's I2C bus at slave
          address 0x20, driven directly by a pair of firmware routines the interactive
          monitor calls.
        datasheet_contracts:
          - docs/datasheets/pcf8584-elsc.md
        notes: >-
          WHAT THIS DEVICE IS HAS NOT BEEN ESTABLISHED, and the reviewed datasheet deliberately
          declines to guess. The entry exists because an unidentified part that provably answers is
          inventory: a model implementing only the system controller leaves this address unanswered,
          and leaving the entry out because the part cannot be named is the omission a completeness
          audit exists to surface rather than a reason to stay silent. The `kind` is a PLACEHOLDER
          and should not be read as a claim -- the enum has no value for an unidentified device, and
          nothing establishes that this one is storage. What would settle it is a firmware routine
          read for what it does with the byte, or a board document naming a part at this address.

    # How this machine describes itself to the guest. The record layout lives in
    # klconfig-layout.yaml and is proved against the reference kernel's headers by
    # tools/tests/test-klconfig-layout; what follows is the content those
    # records carry.
    #
    # The board list follows what a real machine of this generation emits rather
    # than what would be tidiest: the midplane board carries a module serial number
    # and no crossbar component at all, which is why a guest falling back to
    # assuming the Hub sits at a fixed widget is the normal path here and not a
    # degraded one.
