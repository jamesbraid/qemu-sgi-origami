# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: module
  id: octane2-module
  requires:
    architecture: ip30
    assembly: ip30
  data:
    components:
    - id: ip30-board
      name: ip30-board
      kind: board
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-products
      hardware_kind: ip30
      identity:
        part: 030-1467-001
    - id: cpu0
      name: cpu0
      kind: cpu
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-processors
      parent: ip30-board
      hardware_kind: r12000
      identity:
        # Inferred. One running IRIX 6.5.30m Octane2 kernel recorded these
        # CPU and FPU identity words for its 360 MHz R12000 (chip revision
        # 3.5); they are kernel inventory state, not raw CP0 or CP1 reads
        # (docs/system/mips/sgi/ip30.rst, R12000 catalogue defaults). The machine's
        # r12000-prid and r12000-fpu-id properties override them.
        processor_identification: '0x0e35'
        fpu_identification: '0x0900'
    - id: heart
      name: heart
      kind: node-asic
      datasheet_contracts: [qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-octane2-heart-id
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-octane2-heart-status
      parent: ip30-board
      hardware_kind: heart
      identity:
        widget_revision: 6
        widget_id_64: '0x6c00106d'
        widget_status_f_measured: true
        # Measured: the reference Octane2's PROM read returned 0x60 (sgi-ip30.rst, sgi-ip30-octane2-heart-status).
    - id: memory
      name: memory
      kind: memory
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-memory
      parent: ip30-board
    - id: crossbow
      name: crossbow
      kind: crossbar
      datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/xbow.rst]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-octane2-xbow-id
      parent: ip30-board
      hardware_kind: xbow
      crossbar:
        kind: xbow
      identity:
        widget_revision: 5
    - id: bridge
      name: bridge
      kind: pci-host-bridge
      datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/bridge.rst]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      parent: ip30-board
      hardware_kind: bridge
      identity:
        widget_revision: 4
        notes: Measured on the reference Octane2 (IP30 board 030-1467-001 revision B, HEART revision F, Crossbow 1.4), PROM Command Monitor 'dump -w -x 0xffffffffbf000004#1' returned 0x4c00206d, revision 4 in bits 31:28.
      pci_host_bridge:
        heads: 1
    - id: isp1040-internal
      name: isp1040-internal
      kind: storage-hba
      datasheet_contracts: [qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-storage]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      parent: ip30-board
      hardware_kind: isp1040
    - id: isp1040-external
      name: isp1040-external
      kind: storage-hba
      datasheet_contracts: [qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-storage]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      parent: ip30-board
      hardware_kind: isp1040
    - id: ioc3
      name: ioc3
      kind: io-controller
      datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/ioc3.rst]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      parent: ip30-board
      hardware_kind: ioc3
      identity:
        gpio_classic: false
    - id: ethernet
      name: ethernet
      kind: subfunction
      provenance: public-header
      sources:
      - linux:db2ddb87143519e20a95aa36c60b36107b736a58 drivers/mfd/ioc3.c lines 449 to 459 (ip30_sysboard_setup creates the IOC3 Ethernet function on the IP30 board)
      parent: ioc3
      hardware_kind: ioc3-ethernet
    - id: rtc
      name: rtc
      kind: rtc
      datasheet_contracts: [qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-timekeeper]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      parent: ioc3
      hardware_kind: ds1685
    - id: rad
      name: rad
      kind: io-controller
      datasheet_contracts: [qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components]
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      parent: ip30-board
      hardware_kind: rad1
    - id: record-0
      name: record-0
      kind: identity
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-board-identity
      parent: ip30-board
      board_record:
        role: processor
        barcode: EMUU00
        part: 030-1590-002
        revision: B
        name: PM10360MHZ
        serial: '0x51454d555500'
    - id: record-1
      name: record-1
      kind: identity
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-board-identity
      parent: ip30-board
      board_record:
        role: system-board
        barcode: EMUN00
        part: 030-1467-001
        revision: B
        name: IP30
        serial: '0x51454d554e00'
    - id: record-2
      name: record-2
      kind: identity
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-board-identity
      parent: ip30-board
      board_record:
        role: frontplane
        barcode: EMUF00
        part: 030-0891-003
        revision: H
        name: FP1
        serial: '0x51454d554600'
    - id: record-3
      name: record-3
      kind: identity
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-board-identity
      parent: ip30-board
      board_record:
        role: power-supply
        barcode: EMUS00
        part: 060-0035-002
        revision: A
        name: PWR.SPPLY.ER
        serial: '0x51454d555300'
    buses:
    - id: sysad
      kind: sysad
      master: cpu0
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      name: sysad
    - id: xio
      kind: xio
      master: crossbow
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      name: xio
    - id: pci
      kind: pci
      master: bridge
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
      name: pci
    connections:
    - component: cpu0
      bus: sysad
      role: master
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
    - component: heart
      bus: sysad
      role: endpoint
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
    - component: heart
      bus: xio
      widget: 8
      role: endpoint
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
    - component: bridge
      bus: xio
      widget: 15
      controlled_by: ip30-board
      role: endpoint
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
    - component: isp1040-internal
      bus: pci
      pci_device: 0
      pci_function: 0
      role: endpoint
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
    - component: isp1040-external
      bus: pci
      pci_device: 1
      pci_function: 0
      role: endpoint
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
    - component: ioc3
      bus: pci
      pci_device: 2
      pci_function: 0
      role: endpoint
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
    - component: rad
      bus: pci
      pci_device: 3
      pci_function: 0
      role: endpoint
      provenance: derived
      sources:
      - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-components
