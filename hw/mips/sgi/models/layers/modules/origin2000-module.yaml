      - {id: router-1-external-2, name: Router 1 external connector C, kind: connector, provenance: vendor-document, parent: router-board-1, connector: {interface: CrayLink, location: unresolved external port, occupancy: opaque}, sources: ["108-0175-001 Figures 3-4 printed pages 4-5 PDF pages 18-19 mapping trusted; 007-3439-002 Figure 2-17 printed page 58 PDF page 72 mapping trusted"]}
