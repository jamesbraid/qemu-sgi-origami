# SPDX-License-Identifier: BSD-3-Clause
# Reusable physical four-node Origin 2000 module.
layer_version: 1
# The catalogue citation checker (tools/check-citations) resolves a sources: entry
# directly against docs/library/docs.tsv or docs/library/techpubs.tsv, or against a
# public commit; every fact above has moved to that direct form. The one key left
# here backs the module management I2C bus and its six connections only, whose
# strict evidence policy (tools/origami_lib/model_validation.py) requires
# non-empty sources for every one regardless of provenance -- unlike a component,
# which may carry none. It cites only an internal datasheet, so the checker
# reports it under "facts whose only sources are internal documents" rather than
# resolving it; replacing it with an independently obtainable citation is
# follow-up work on the evidence itself, not a citation-form change.
sources:
  origin2000-module-management-datasheet: "docs/datasheets/origin2000-module-management.md"
layer:
  kind: module
  id: origin2000-module
  requires:
    assembly: ip27
  data:
