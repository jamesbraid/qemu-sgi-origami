      - {id: router-1, name: Router 1, kind: router-asic, hardware_kind: router, router_asic: {port_count: 6, role: router}, identity: {part: "0x1", hardware_revision: 1, chip_inputs: 15, notes: "Select the supported part/revision; chip inputs follow the physical R1/R2 slot mapping in the cleared Router contract."}, datasheet_contracts: [docs/datasheets/router.md], provenance: vendor-document, parent: router-board-1, sources: ["108-0175-001 Figures 3-4 printed pages 4-5 PDF pages 18-19 mapping trusted; 007-3439-002 Figure 2-17 printed page 58 PDF page 72 mapping trusted"]}
