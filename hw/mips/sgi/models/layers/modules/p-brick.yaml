# SPDX-License-Identifier: BSD-3-Clause
# Origin 3000 P-brick: three XBridges and twelve PCI slots on six buses.
# U0 takes the Crosstown2 cable on port A or B and joins U1 and U2 by two
# links each. The builder refuses those links until a reviewed contract
# gives the downstream chips' mode.
layer_version: 1
layer:
  kind: module
  id: p-brick
  requires: {architecture: sn1}
  data:
    components:
      - id: brick
        name: P-brick
        kind: module
        provenance: vendor-document
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)"]
        notes: >-
          The L1 manual's type letter for the P-brick is outside the L1
          contract's established set, so the layer carries no brick_type.
      - id: u0
        name: XBridge U0
        kind: pci-host-bridge
        hardware_kind: xbridge
        pci_host_bridge: {heads: 2}
        provenance: vendor-document
        parent: brick
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)"]
        notes: >-
          Head E drives PCI bus 4 and head F bus 3. The chip's revision
          and mode strap are unknown.
      - id: u0-crossbar
        name: XBridge U0 crossbar section
        kind: crossbar
        hardware_kind: xbridge
        crossbar: {kind: xbridge}
        provenance: vendor-document
        parent: u0
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)"]
      - id: u1
        name: XBridge U1
        kind: pci-host-bridge
        hardware_kind: xbridge
        pci_host_bridge: {heads: 2}
        provenance: vendor-document
        parent: brick
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)"]
        notes: >-
          Head E drives PCI bus 2 and head F bus 1. The chip's revision
          and mode strap are unknown.
      - id: u1-crossbar
        name: XBridge U1 crossbar section
        kind: crossbar
        hardware_kind: xbridge
        crossbar: {kind: xbridge}
        provenance: vendor-document
        parent: u1
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)"]
        notes: >-
          The record carries this chip's two link ports. Whether the chip
          runs its crossbar or presents each head on its own link is
          unknown.
      - id: u2
        name: XBridge U2
        kind: pci-host-bridge
        hardware_kind: xbridge
        pci_host_bridge: {heads: 2}
        provenance: vendor-document
        parent: brick
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)"]
        notes: >-
          Head E drives PCI bus 6 and head F bus 5. The chip's revision
          and mode strap are unknown.
      - id: u2-crossbar
        name: XBridge U2 crossbar section
        kind: crossbar
        hardware_kind: xbridge
        crossbar: {kind: xbridge}
        provenance: vendor-document
        parent: u2
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)"]
        notes: >-
          The record carries this chip's two link ports. Whether the chip
          runs its crossbar or presents each head on its own link is
          unknown.
      - id: port-a
        name: Crosstown2 port A connector
        kind: connector
        provenance: vendor-document
        parent: u0-crossbar
        connector:
          interface: Crosstown2
          location: rear panel, through a host interface card
          occupancy: opaque
          port: 0xa
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)", "108-0240-002 printed page 2-31, Figure 2-24: host interface card 1 on U0 port A"]
      - id: port-b
        name: Crosstown2 port B connector
        kind: connector
        provenance: vendor-document
        parent: u0-crossbar
        connector:
          interface: Crosstown2
          location: rear panel, through a host interface card
          occupancy: opaque
          port: 0xb
        sources: ["108-0240-002 printed pages 2-30 and 2-31, Figure 2-24: three XBridges; U0 serves buses 3 and 4 and is the Crosstown2 interface for U1 (buses 1, 2) and U2 (buses 5, 6)", "108-0240-002 printed page 2-31, Figure 2-24: host interface card 2 on U0 port B"]
      - id: u0-port-d
        name: XBridge U0 port D
        kind: connector
        provenance: vendor-document
        parent: u0-crossbar
        connector: {interface: Crosstalk, location: internal, occupancy: occupied, port: 0xd}
        sources: ["108-0240-002 printed page 2-31, Figure 2-24: U0 D to U2 D, U0 C to U2 8, U0 9 to U1 8, U0 8 to U1 D"]
