layer_version: 1
sources:
  tezro-deskside-trial: 'Origami revision 6db3a6cbfacec3b02f81e9e6b28e70bed50149f5, docs/datasheets/tezro-deskside-compatibility-trial.md, SHA-256 10610817dce8ba94ead45e44fb0dc25faa6a389bc1df86ef8535570446354979: selected deskside software tuple'
  tezro-deskside-trial-review: 'Origami revision 6db3a6cbfacec3b02f81e9e6b28e70bed50149f5, docs/reviews/chimera-tezro-deskside-trial-evidence-review-20261006.md, SHA-256 6029aea835f7315f5f9ff357b2ae4a682582d41a3136a5001a43a1f0482b5715: clears only the deskside tuple as local software inputs'
  tezro-board-guide: '007-4564-001 printed pages 26-29 and 38; 007-4643-003 printed pages 21-29: supported processor populations and PCI/IO9 location'
  tezro-software-choice-limit: 'Origami revision 6db3a6cbfacec3b02f81e9e6b28e70bed50149f5, docs/reviews/chimera-tezro-deskside-compatibility-review-20261006.md, SHA-256 64528fa4b1acad7d73e5cbaf0f195ec42f14dd360b6adbd86149fb08f9ba8fd7: selected tuple values cleared only as software choices; does not clear
    tower or rack configuration'
layer:
  kind: module
  id: tezro-serial-compat-module
  requires:
    architecture: sn1
    assembly: ip53-tezro
  data:
    components:
    - id: chassis
      name: Tezro processor enclosure
      kind: chassis
      provenance: vendor-document
      sources:
      - tezro-deskside-trial
    - id: ip53-board
      name: IP53 board in selected compatibility model
      kind: board
      hardware_kind: ip53
      parent: chassis
      provenance: derived
      sources:
      - tezro-board-guide
      - tezro-software-choice-limit
    - id: bedrock
      name: Bedrock
      kind: node-asic
      hardware_kind: bedrock
      datasheet_contracts:
      - docs/datasheets/bedrock-processor-interface.md
      - docs/datasheets/bedrock-local-block.md
      - docs/datasheets/bedrock-network-interface.md
      - docs/datasheets/bedrock-io-interface.md
      - docs/datasheets/bedrock-memory-directory.md
      - docs/datasheets/bedrock-crossbar.md
      parent: ip53-board
      node_asic:
        processor_interfaces: 2
        cpus_per_interface: 2
      identity:
        ni_revision: 2
        widget_revision: 2
        clock_mhz: 200
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: cpu0
      name: R16000
      kind: cpu
      hardware_kind: r16000
      parent: bedrock
      identity:
        cache_clock_mhz: 350
        r16000_reset_mode: 0x009bad85
        r16000_scache_bytes: 4194304
        required_properties:
        - r16000-experimental
        - r16000-reset-mode
        - r16000-scache-bytes
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: memory
      name: node memory
      kind: memory
      parent: bedrock
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: l1
      name: L1 system controller
      kind: system-controller
      hardware_kind: l1
      datasheet_contracts:
      - docs/datasheets/l1-controller.md
      system_controller:
        kind: l1
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: pic-board-f
      name: PIC board at widget 15
      kind: board
      parent: chassis
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: pic-xio-f
      name: PIC at widget 15
      kind: pci-host-bridge
      hardware_kind: pic
      datasheet_contracts:
      - docs/datasheets/pic.md
      - docs/datasheets/pic-direct64-dma.md
      parent: pic-board-f
      pci_host_bridge:
        heads: 2
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: io9
      name: IO9 compatibility device
      kind: board
      hardware_kind: io9
      parent: chassis
      identity:
        part: 030-1771-005-A
      provenance: derived
      sources:
      - tezro-software-choice-limit
      notes: The part identifies the selected deskside-compatible IO9 software input; tower and rack fitment is unknown.
    - id: ioc4
      name: IOC4
      kind: io-controller
      hardware_kind: ioc4
      datasheet_contracts:
      - docs/datasheets/ioc4.md
      - docs/datasheets/ioc4-serial-dma.md
      parent: io9
      identity:
        pci_revision: 83
      ioc4:
        clock_hz: 66666667
        serial_dma_experimental: true
      provenance: derived
      sources:
      - tezro-deskside-trial
      - tezro-deskside-trial-review
    - id: ds1742
      name: DS1742-compatible clock resource
      kind: rtc
      hardware_kind: ds1742
      datasheet_contracts:
      - docs/datasheets/ds1742.md
      - docs/datasheets/ds1742-ioc4.md
      parent: io9
      ds1742_fresh_year_base: 1968
      provenance: derived
      sources:
      - tezro-deskside-trial
      - tezro-deskside-trial-review
      notes: Software-selected persistent clock resource for this trial. IO9 fitted-part identity, byte address decode, and physical IOC4 clock wiring are not established for Tezro.
    - id: isp12160
      name: QLogic ISP12160
      kind: subfunction
      hardware_kind: isp12160
      parent: io9
      identity:
        pci_revision: 6
      provenance: derived
      sources:
      - tezro-deskside-trial
      - tezro-deskside-trial-review
    - id: bcm5701
      name: Broadcom BCM5701
      kind: subfunction
      hardware_kind: bcm5701
      parent: io9
      identity:
        pci_revision: 0
      provenance: derived
      sources:
      - tezro-deskside-trial
      - tezro-deskside-trial-review
    buses:
    - id: sysad0
      name: SysAD
      kind: sysad
      master: cpu0
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: xio
      name: XIO
      kind: xio
      master: bedrock
      provenance: derived
      sources:
      - tezro-deskside-trial
    - id: io9-pci
      name: IO9 PCI bus
      kind: pci
      master: pic-xio-f
      provenance: derived
      sources:
      - tezro-deskside-trial
    connections:
    - component: bedrock
      bus: sysad0
      role: endpoint
      provenance: derived
      sources:
      - tezro-deskside-trial
    - component: cpu0
      bus: sysad0
      role: master
      provenance: derived
      sources:
      - tezro-deskside-trial
    - component: bedrock
      bus: xio
      role: master
      widget: 10
      provenance: derived
      sources:
      - tezro-deskside-trial
    - component: pic-xio-f
      bus: xio
      role: bridge-upstream
      widget: 15
      controlled_by: bedrock
      xio:
        physical_attachment: direct-link
        enumerated_widget: 15
        discovery_widget: 15
        decoded_widgets:
        - 15
        identity_aliases:
        - widget: 15
          roles:
          - enumerated
          - discovery
          - decoded
          - legacy
      provenance: derived
      sources:
      - tezro-deskside-trial
    - component: pic-xio-f
      bus: io9-pci
      role: bridge-downstream
      pci_head: 0
      provenance: derived
      sources:
      - tezro-deskside-trial
    - component: ioc4
      bus: io9-pci
      role: endpoint
      pci_device: 1
      pci_function: 0
      intx_pin: inta
      pic_input: 0
      provenance: derived
      sources:
      - tezro-deskside-trial
      - tezro-deskside-trial-review
    - component: isp12160
      bus: io9-pci
      role: endpoint
      pci_device: 3
      pci_function: 0
      intx_pin: inta
      pic_input: 2
      provenance: derived
      sources:
      - tezro-deskside-trial
      - tezro-deskside-trial-review
    - component: bcm5701
      bus: io9-pci
      role: endpoint
      pci_device: 4
      pci_function: 0
      intx_pin: inta
      pic_input: 3
      provenance: derived
      sources:
      - tezro-deskside-trial
      - tezro-deskside-trial-review
    links:
    - kind: ioc4-clock
      source: ds1742
      target: ioc4
