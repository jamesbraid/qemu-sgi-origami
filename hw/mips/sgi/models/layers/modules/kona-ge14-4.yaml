# SPDX-License-Identifier: BSD-3-Clause
# The GE14-4 geometry board of an InfiniteReality pipe, with its one-wire
# record, part 030-1129-002 in the real deskside capture web:irixnet-post-32192
# (docs/specs/sgi-onyx2.rst, One-wire records). A composition fits it beside
# or under a layers/modules/kona-pipe.yaml instance and binds the
# placeholder `pipe-one-wire` bus to that pipe's one-wire bus, before any
# other record joins the chain. QEMU's sgi-kona stores this part in its
# geometry record; a pipe configured with a product (sgi-kona "product")
# names and revises that record as its configuration says.
layer_version: 1
layer:
  kind: module
  id: kona-ge14-4
  requires:
    assembly: ip27
  data:
    components:
      - id: geometry
        name: GE14-4 geometry board
        kind: board
        hardware_kind: geometry-board
        provenance: datasheet
        sources: [qemu:docs/specs/sgi-onyx2.rst#sgi-onyx2-one-wire]
        notes: The XG ASIC the host reaches sits on this board; the pipe layer carries it.

      - id: geometry-identity
        name: GE14-4 one-wire identity
        kind: identity
        parent: geometry
        provenance: datasheet
        identity:
          part: "030-1129-002"
        sources: ["web:irixnet-post-32192 board list, GE14-4 board part 030-1129-002 revision F at /hw/module/1/slot/io4/kona"]

    connections:
      - component: geometry-identity
        bus: pipe-one-wire
        role: endpoint
        provenance: datasheet
        sources: [qemu:docs/specs/sgi-onyx2.rst#sgi-onyx2-one-wire]
        notes: A placeholder the composition binds to its pipe's own one-wire bus.
