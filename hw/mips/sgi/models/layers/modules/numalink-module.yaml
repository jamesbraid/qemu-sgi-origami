      - {id: router-port-4, name: Router to port 4, kind: fabric, master: router, provenance: derived, sources: ["007-4498-002 p.10, 132-133: eight numbered external ports; logical association to inferred SN1 family only"]}
      - {id: router-port-5, name: Router to port 5, kind: fabric, master: router, provenance: derived, sources: ["007-4498-002 p.10, 132-133: eight numbered external ports; logical association to inferred SN1 family only"]}
