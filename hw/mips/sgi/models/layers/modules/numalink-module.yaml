# SPDX-License-Identifier: BSD-3-Clause
# Origin 300 NUMAlink enclosure: eight external ports and an inferred SN1 family.
# Tall-rack population ranges from two to eight base modules.
layer_version: 1
layer:
  kind: module
  id: numalink-module
  requires: {architecture: sn1}
  data:
    components:
      - id: numalink-module
        name: NUMAlink module
        kind: module
        provenance: vendor-document
        sources: ["007-4498-002 p.4, 10, 11, 16, 87, 93, 96, 98, 132: two to eight base modules; ports 1, 6, 7, 8 (labels A, F, G, H) base modules only; ports 2-5 (labels B-E) base or PCI expansion modules and carry USB to the L2; global master is the lowest base module"]
        notes: AC or DC enclosure with internal L1 and USB hub. Rack L2 is external. Fitted ASIC part, count and silicon revision remain unknown.
      - id: router
        name: SN1 Router family candidate
        kind: router-asic
        hardware_kind: router
        router_asic: {port_count: 8, role: router}
        provenance: derived
        parent: numalink-module
        sources: ["linux-history:381ab1f538162eb985c9244aa7d56e54315881ab include/asm-ia64/sn/sn1/router.h lines 15-18, 45-47: public eight-port SN1 router family", "007-4498-002 p.10, 132-133: eight NUMAlink module ports", "web:nekonomicon-16727514 posts: router board 030-1634-003 rev -A and router Revision 1"]
        notes: Inferred software-family mapping, not measured fitted silicon. Owner inventory reports board 030-1634-003 revision -A and router Revision 1. One logical router in this reference does not establish ASIC count. Board and reported router revisions are distinct. No chip revision is selected.
      - id: l1
        name: L1 system controller
        kind: system-controller
        hardware_kind: l1
        system_controller: {kind: l1}
        provenance: vendor-document
        parent: numalink-module
        sources: ["007-4498-002 p.14, 96, 130, 132: internal L1 controller logic, display and rear power control"]
        notes: Internal module-level controller; board part and revision are unresolved.
      - id: usb-hub
        name: Internal USB hub
        kind: bus-controller
        provenance: vendor-document
        parent: numalink-module
        sources: ["007-4498-002 p.132: rear L1 port connects the internal USB hub to rack L2"]
        notes: Reaches attached L1 controllers through ports 2-5. Its own L1 branch is unresolved.
      - {id: port-1, name: "Port 1 (label A)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base modules only.}}
      - {id: port-2, name: "Port 2 (label B)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base or PCI expansion module; carries USB to the L2.}}
      - {id: port-3, name: "Port 3 (label C)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base or PCI expansion module; carries USB to the L2.}}
      - {id: port-4, name: "Port 4 (label D)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base or PCI expansion module; carries USB to the L2.}}
      - {id: port-5, name: "Port 5 (label E)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base or PCI expansion module; carries USB to the L2.}}
      - {id: port-6, name: "Port 6 (label F)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base modules only.}}
      - {id: port-7, name: "Port 7 (label G)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base modules only.}}
      - {id: port-8, name: "Port 8 (label H)", kind: connector, provenance: derived, parent: numalink-module, connector: {interface: NUMAlink 3, occupancy: opaque, notes: Base modules only.}}
    buses:
      - {id: router-port-1, name: Router to port 1, kind: fabric, master: router, provenance: derived, sources: ["007-4498-002 p.10, 132-133: eight numbered external ports; logical association to inferred SN1 family only"]}
      - {id: router-port-2, name: Router to port 2, kind: fabric, master: router, provenance: derived, sources: ["007-4498-002 p.10, 132-133: eight numbered external ports; logical association to inferred SN1 family only"]}
