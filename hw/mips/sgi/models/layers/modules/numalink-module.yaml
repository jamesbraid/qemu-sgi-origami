      - {component: port-5, bus: router-port-5, role: endpoint, provenance: vendor-document, sources: [sn-family-closure-tall-rack-cabling]}
      - {component: port-6, bus: router-port-6, role: endpoint, provenance: vendor-document, sources: [sn-family-closure-tall-rack-cabling]}
      - {component: port-7, bus: router-port-7, role: endpoint, provenance: vendor-document, sources: [sn-family-closure-tall-rack-cabling]}
