# SPDX-License-Identifier: BSD-3-Clause
# Origin 3000 C-brick: one Bedrock node, no onboard crossbar.
layer_version: 1
layer:
  kind: module
  id: c-brick
  requires: {architecture: sn1, assembly: ip35}
  data:
    components:
      - id: chassis
        name: C-brick
        kind: chassis
        provenance: derived
      - id: bedrock
        name: Bedrock
        kind: node-asic
        hardware_kind: bedrock
        node_asic: {processor_interfaces: 2, cpus_per_interface: 2}
        identity: {widget_part: "0xc110", widget_mfg: "0x036", hardware_revision: 2, clock_mhz: 200}
        provenance: observed-hardware
        parent: chassis
      - id: cpu0
        name: R12000-family CPU
        kind: cpu
        hardware_kind: r12000
        provenance: derived
        parent: chassis
        notes: >-
          The closure record names R12000 360 MHz and R12000A 400 MHz for this
          board without a cache size; no clock or cache identity is asserted.
      - id: cpu1
        name: R12000-family CPU
        kind: cpu
        hardware_kind: r12000
        provenance: derived
        parent: chassis
      - id: node-memory
        name: node memory
        kind: memory
        provenance: derived
        parent: chassis
        description: Eight DIMM slots, banks 0-7, 512 MB to 8 GB.
      - id: xio-ii-connector
        name: XIO (II) connector
        kind: connector
        provenance: vendor-document
        parent: chassis
        connector:
          interface: Crosstown2
          location: rear panel
          occupancy: opaque
          notes: >-
            The C-brick's one XIO connector, which joins it to an I-, P- or
            X-brick. The brick at the far end owns the crossbar and its
            ports; the composition says what is cabled here.
        sources: ["007-4240-002 printed page 124: the XIO (II) connector joins a C-brick to an I-, P- or X-brick", "108-0240-002 printed page 2-26: the C-brick has no crossbar; its Bedrock reaches I/O through a Crosstown2 port of the I/O brick's XBridge"]
    buses:
      - {id: sysad0, name: "SysAD, processor interface 0", kind: sysad, master: cpu0, provenance: vendor-document, sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {id: xio-ii, name: "XIO, the Bedrock's I/O interface", kind: xio, master: bedrock, provenance: vendor-document, sources: ["007-4240-002 printed page 124: the XIO (II) connector joins a C-brick to an I-, P- or X-brick", "108-0240-002 printed page 2-26: the Bedrock reaches I/O through a Crosstown2 port of the I/O brick's XBridge"]}
    connections:
      - {component: cpu0, bus: sysad0, role: master, provenance: vendor-document, sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {component: cpu1, bus: sysad0, role: master, provenance: vendor-document, sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {component: bedrock, bus: sysad0, role: endpoint, provenance: vendor-document, sources: [qemu:docs/system/mips/sgi/sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {component: xio-ii-connector, bus: xio-ii, role: endpoint, provenance: vendor-document, sources: ["007-4240-002 printed page 124: the XIO (II) connector joins a C-brick to an I-, P- or X-brick"]}
