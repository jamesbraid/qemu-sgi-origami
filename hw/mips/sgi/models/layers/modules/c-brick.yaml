# SPDX-License-Identifier: BSD-3-Clause
# Origin 3000 C-brick: one Bedrock node, no onboard crossbar.
layer_version: 1
layer:
  kind: module
  id: c-brick
  requires: {architecture: sn1, assembly: ip35}
  data:
    components:
      - id: chassis
        name: C-brick
        kind: chassis
        provenance: derived
      - id: bedrock
        name: Bedrock
        kind: node-asic
        hardware_kind: bedrock
        node_asic: {processor_interfaces: 2, cpus_per_interface: 2}
        identity: {widget_part: "0xc110", widget_mfg: "0x036", hardware_revision: 2, clock_mhz: 200}
        provenance: observed-hardware
        parent: chassis
      - id: cpu0
        name: R12000-family CPU
        kind: cpu
        hardware_kind: r12000
        provenance: derived
        parent: chassis
        notes: >-
          The closure record names R12000 360 MHz and R12000A 400 MHz for this
          board without a cache size; no clock or cache identity is asserted.
      - id: cpu1
        name: R12000-family CPU
        kind: cpu
        hardware_kind: r12000
        provenance: derived
        parent: chassis
      - id: node-memory
        name: node memory
        kind: memory
        provenance: derived
        parent: chassis
        description: Eight DIMM slots, banks 0-7, 512 MB to 8 GB.
      - id: host-port-a
        name: Host port A (widget 0xA)
        kind: connector
        provenance: derived
        parent: chassis
        connector: {interface: xio, location: "0xA", occupancy: opaque, notes: One of two host ports an I-brick or other expansion brick attaches to.}
      - id: host-port-b
        name: Host port B (widget 0xB)
        kind: connector
        provenance: derived
        parent: chassis
        connector: {interface: xio, location: "0xB", occupancy: opaque, notes: One of two host ports an I-brick or other expansion brick attaches to.}
    buses:
      - {id: sysad0, name: "SysAD, processor interface 0", kind: sysad, master: cpu0, provenance: vendor-document, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {id: xio, name: XIO, kind: xio, master: bedrock, provenance: vendor-document, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-family-ibrick]}
    connections:
      - {component: cpu0, bus: sysad0, role: master, provenance: vendor-document, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {component: cpu1, bus: sysad0, role: master, provenance: vendor-document, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {component: bedrock, bus: sysad0, role: endpoint, provenance: vendor-document, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-family-origin3000-cbrick]}
      - {component: host-port-a, bus: xio, role: endpoint, provenance: vendor-document, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-family-ibrick], notes: Widget 0xA; opaque unless module_instances wires an attached brick.}
      - {component: host-port-b, bus: xio, role: endpoint, provenance: vendor-document, sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-family-ibrick], notes: Widget 0xB; opaque unless module_instances wires an attached brick.}
