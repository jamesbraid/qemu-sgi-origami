      - {component: u2, bus: u0-u2, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 40"]}
      - {component: pci-1-slot-1, bus: pci-1, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {component: pci-1-slot-2, bus: pci-1, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
