# SPDX-License-Identifier: BSD-3-Clause
# Experimental composition of the published PCI expansion component graph.
layer_version: 1
layer:
  kind: module
  id: origin300-pci-expansion-experiment-module
  requires: {architecture: sn1}
  data:
    components:
      - id: enclosure
        name: Origin 300 PCI expansion module
        kind: module
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 12 and 38 to 40"]
      - id: bic
        name: Bedrock interface card
        kind: board
        parent: enclosure
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 38 to 40 and 50"]
      - id: bedrock
        name: I/O-only Bedrock
        kind: bus-controller
        hardware_kind: bedrock
        parent: bic
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 40 and 50"]
        identity: {hardware_revision: 2}
        datasheet_contracts: [docs/datasheets/origin300-pci-expansion-module.md]
        notes: Explicit inferred revision and synthetic identity belong to the isolated emulator experiment; processor and memory interfaces are unused.
      - id: link-port
        name: PCI expansion LINK connector
        kind: connector
        parent: enclosure
        connector: {interface: NUMAlink 3, location: enclosure rear, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 12, 38 and 52"]
      - id: u0
        name: XBridge U0
        kind: pci-host-bridge
        hardware_kind: xbridge
        pci_host_bridge: {heads: 2}
        parent: enclosure
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
        notes: Serves buses 3 and 4 and connects to U1 and U2. Widget addresses and forwarding are unknown.
      - id: u1
        name: XBridge U1
        kind: pci-host-bridge
        hardware_kind: xbridge
        pci_host_bridge: {heads: 2}
        parent: enclosure
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
        notes: Serves buses 1 and 2. Widget addresses are unknown.
      - id: u2
        name: XBridge U2
        kind: pci-host-bridge
        hardware_kind: xbridge
        pci_host_bridge: {heads: 2}
        parent: enclosure
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
        notes: Serves buses 5 and 6. Widget addresses are unknown.
      - id: l1
        name: PCI expansion L1 controller
        kind: system-controller
        hardware_kind: l1
        system_controller: {kind: l1}
        parent: enclosure
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 36, 48 and 50"]
        notes: Protocol, identity and slot-power effects are unknown.
      - id: serial-id
        name: Serial ID EEPROM
        kind: identity
        parent: enclosure
        provenance: vendor-document
        sources: ["007-4499-002 printed page 46"]
        notes: Contents and read path are unknown.
      - id: pci-1-slot-1
        name: PCI bus 1 slot 1
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 1 slot 1, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-1-slot-2
        name: PCI bus 1 slot 2
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 1 slot 2, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-2-slot-1
        name: PCI bus 2 slot 1
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 2 slot 1, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-2-slot-2
        name: PCI bus 2 slot 2
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 2 slot 2, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-3-slot-1
        name: PCI bus 3 slot 1
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 3 slot 1, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-3-slot-2
        name: PCI bus 3 slot 2
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 3 slot 2, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-4-slot-1
        name: PCI bus 4 slot 1
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 4 slot 1, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-4-slot-2
        name: PCI bus 4 slot 2
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 4 slot 2, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-5-slot-1
        name: PCI bus 5 slot 1
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 5 slot 1, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-5-slot-2
        name: PCI bus 5 slot 2
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 5 slot 2, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-6-slot-1
        name: PCI bus 6 slot 1
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 6 slot 1, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
      - id: pci-6-slot-2
        name: PCI bus 6 slot 2
        kind: connector
        parent: enclosure
        connector: {interface: PCI, location: bus 6 slot 2, occupancy: opaque}
        provenance: vendor-document
        sources: ["007-4499-002 printed pages 39 to 41"]
    buses:
      - {id: numalink, name: PCI expansion local LINK interface, kind: fabric, master: bedrock, provenance: vendor-document, sources: ["007-4499-002 printed pages 38 to 40 and 50"]}
      - {id: bic-ii, name: BIC I/O interface, kind: xio, master: bedrock, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 40 and 50"]}
      - {id: u0-u1, name: U0 to U1, kind: xio, master: u0, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 40"]}
      - {id: u0-u2, name: U0 to U2, kind: xio, master: u0, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 40"]}
      - {id: pci-1, name: PCI bus 1, kind: pci, master: u1, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {id: pci-2, name: PCI bus 2, kind: pci, master: u1, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {id: pci-3, name: PCI bus 3, kind: pci, master: u0, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {id: pci-4, name: PCI bus 4, kind: pci, master: u0, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {id: pci-5, name: PCI bus 5, kind: pci, master: u2, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {id: pci-6, name: PCI bus 6, kind: pci, master: u2, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
    connections:
