      - {component: pci-2-slot-2, bus: pci-2, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {component: pci-3-slot-1, bus: pci-3, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {component: pci-3-slot-2, bus: pci-3, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {component: pci-4-slot-1, bus: pci-4, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
      - {component: pci-4-slot-2, bus: pci-4, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 41"]}
