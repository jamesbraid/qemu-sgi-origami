      - {component: link-port, bus: numalink, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 12 and 52"]}
      - {component: bedrock, bus: upstream-numalink, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 38 to 40 and 50"]}
      - {component: bedrock, bus: bic-ii, role: master, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 40 and 50"]}
      - {component: u0, bus: bic-ii, role: endpoint, provenance: vendor-document, sources: ["007-4499-002 printed pages 39 to 40"]}
