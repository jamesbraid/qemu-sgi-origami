# SPDX-License-Identifier: BSD-3-Clause
# Origin 3000 R-brick: one eight-port SN1 router with its L1 and USB hub.
# A composition cables a port by attaching its far end to port-<n>-cable.
layer_version: 1
layer:
  kind: module
  id: r-brick
  requires: {architecture: sn1}
  data:
    components:
      - id: brick
        name: R-brick
        kind: module
        provenance: vendor-document
        sources: ["007-4240-002 printed pages 191 to 194 and 007-4311-002 printed page 36: one router ASIC with eight NUMAlink 3 ports, an L1 controller, a USB hub, a power board and two fans; no processors, memory or I/O"]
        notes: >-
          The L1 brick-type character is not set: no reviewed L1 contract
          gives the R-brick's. The rear L1 PORT, which carries the USB hub's
          upstream link to the rack's L2, the two fans and the power board's
          +48 Vdc domain are not modelled.
      - id: router
        name: SN1 router
        kind: router-asic
        hardware_kind: router
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/router.rst]
        router_asic:
          port_count: 8
          role: router
          node_ports: [2, 3, 4, 5]
        identity: {part: "0x3017", hardware_revision: 1, chip_inputs: 0}
        provenance: derived
        parent: brick
        sources: ["007-4311-002 printed pages 36 and 37: eight ports, and a C-brick connects only to port 2, 3, 4 or 5, since only those carry the USB signals that reach its L1", "007-4240-002 printed page 196: the C-bricks are cabled only to ports 2, 3, 4 and 5", "linux-history:381ab1f538162eb985c9244aa7d56e54315881ab include/asm-ia64/sn/sn1/bedrock.h lines 19-20: router chip identity 0x3017"]
        notes: >-
          The part number is the public SN1 router family's; that it is the
          R-brick's fitted ASIC is inferred from the family and the shared
          software-reported router Revision 1, not measured. Zero chip inputs
          are an emulator configuration policy. Router-to-router links may
          use any port, the C-brick ports included, so only nodes are bound
          to ports 2 to 5.
      - id: l1
        name: L1 system controller
        kind: system-controller
        hardware_kind: l1
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/l1.rst]
        system_controller: {kind: l1}
        provenance: vendor-document
        parent: brick
        sources: ["007-4240-002 printed page 194: the R-brick's L1 monitors temperature, voltage margins and LEDs, reads serial EEPROMs and drives the front display", "007-4240-002 printed page 234: only L1 index 0, the local brick, is valid for an R-brick"]
        notes: >-
          The R-brick L1's request set, router-type setting and serial-number
          checks have no reviewed contract.
      - id: usb-hub
        name: Router-board USB hub
        kind: bus-controller
        datasheet_contracts: [qemu:docs/system/mips/sgi/sn.rst]
        provenance: vendor-document
        parent: brick
        sources: ["108-0240-002 printed page 2-42 and 007-4240-002 printed page 73: a six-port hub: one port to the R-brick's own L1, four through the cables on ports 2 to 5 to the attached C-bricks' L1s, one to the L2"]
        notes: >-
          Management only. It is not a data path, and the L2 it serves is
          not modelled.
      - {id: port-1, name: "Port 1 (A)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 1, occupancy: opaque, notes: "R-brick to R-brick; carries no USB."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H; ports 1, 6, 7 and 8 carry no USB and join R-bricks"]}
      - {id: port-2, name: "Port 2 (B)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 2, occupancy: opaque, notes: "A C-brick, or an R-brick, whose cable then ignores the USB signals."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed pages 36 and 37: ports 2 to 5 lettered B to E carry USB and take C-bricks; an R-brick link on one ignores the USB"]}
      - {id: port-3, name: "Port 3 (C)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 3, occupancy: opaque, notes: "A C-brick, or an R-brick, whose cable then ignores the USB signals."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed pages 36 and 37: ports 2 to 5 lettered B to E carry USB and take C-bricks; an R-brick link on one ignores the USB"]}
      - {id: port-4, name: "Port 4 (D)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 4, occupancy: opaque, notes: "A C-brick, or an R-brick, whose cable then ignores the USB signals."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed pages 36 and 37: ports 2 to 5 lettered B to E carry USB and take C-bricks; an R-brick link on one ignores the USB"]}
      - {id: port-5, name: "Port 5 (E)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 5, occupancy: opaque, notes: "A C-brick, or an R-brick, whose cable then ignores the USB signals."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed pages 36 and 37: ports 2 to 5 lettered B to E carry USB and take C-bricks; an R-brick link on one ignores the USB"]}
      - {id: port-6, name: "Port 6 (F)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 6, occupancy: opaque, notes: "R-brick to R-brick; carries no USB."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H; ports 1, 6, 7 and 8 carry no USB and join R-bricks"]}
      - {id: port-7, name: "Port 7 (G)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 7, occupancy: opaque, notes: "R-brick to R-brick; carries no USB."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H; ports 1, 6, 7 and 8 carry no USB and join R-bricks"]}
      - {id: port-8, name: "Port 8 (H)", kind: connector, provenance: vendor-document, parent: brick, connector: {interface: NUMAlink 3, location: rear panel port 8, occupancy: opaque, notes: "R-brick to R-brick; carries no USB."}, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H; ports 1, 6, 7 and 8 carry no USB and join R-bricks"]}
    buses:
      - {id: port-1-cable, name: NUMAlink 3 cable at port 1, kind: fabric, master: router, link: {kind: cable}, provenance: vendor-document, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H, each a 100-pin NUMAlink 3 connector"], notes: "The cable a composition fits here; one fitted to nothing joins no link."}
      - {id: port-2-cable, name: NUMAlink 3 cable at port 2, kind: fabric, master: router, link: {kind: cable}, provenance: vendor-document, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H, each a 100-pin NUMAlink 3 connector"], notes: "The cable a composition fits here; one fitted to nothing joins no link."}
      - {id: port-3-cable, name: NUMAlink 3 cable at port 3, kind: fabric, master: router, link: {kind: cable}, provenance: vendor-document, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H, each a 100-pin NUMAlink 3 connector"], notes: "The cable a composition fits here; one fitted to nothing joins no link."}
      - {id: port-4-cable, name: NUMAlink 3 cable at port 4, kind: fabric, master: router, link: {kind: cable}, provenance: vendor-document, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H, each a 100-pin NUMAlink 3 connector"], notes: "The cable a composition fits here; one fitted to nothing joins no link."}
      - {id: port-5-cable, name: NUMAlink 3 cable at port 5, kind: fabric, master: router, link: {kind: cable}, provenance: vendor-document, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H, each a 100-pin NUMAlink 3 connector"], notes: "The cable a composition fits here; one fitted to nothing joins no link."}
      - {id: port-6-cable, name: NUMAlink 3 cable at port 6, kind: fabric, master: router, link: {kind: cable}, provenance: vendor-document, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H, each a 100-pin NUMAlink 3 connector"], notes: "The cable a composition fits here; one fitted to nothing joins no link."}
      - {id: port-7-cable, name: NUMAlink 3 cable at port 7, kind: fabric, master: router, link: {kind: cable}, provenance: vendor-document, sources: ["007-4240-002 printed pages 194 to 197 and 007-4311-002 printed page 37: ports 1 to 8 lettered A to H, each a 100-pin NUMAlink 3 connector"], notes: "The cable a composition fits here; one fitted to nothing joins no link."}
