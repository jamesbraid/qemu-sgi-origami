      - {component: port-5, bus: port-5-link, role: endpoint, provenance: vendor-document, sources: ["007-4311-002 p.36-37: ports 1-8 are chip A-H; C-bricks must use 2-5; router to router normally 1, 6, 7, 8 but not restricted; 3400 R-bricks disable 7 and 8; 108-0266-001 p.40-41"]}
      - {component: port-6, bus: port-6-link, role: endpoint, provenance: vendor-document, sources: ["007-4311-002 p.36-37: ports 1-8 are chip A-H; C-bricks must use 2-5; router to router normally 1, 6, 7, 8 but not restricted; 3400 R-bricks disable 7 and 8; 108-0266-001 p.40-41"]}
      - {component: port-7, bus: port-7-link, role: endpoint, provenance: vendor-document, sources: ["007-4311-002 p.36-37: ports 1-8 are chip A-H; C-bricks must use 2-5; router to router normally 1, 6, 7, 8 but not restricted; 3400 R-bricks disable 7 and 8; 108-0266-001 p.40-41"]}
      - {component: port-8, bus: port-8-link, role: endpoint, provenance: vendor-document, sources: ["007-4311-002 p.36-37: ports 1-8 are chip A-H; C-bricks must use 2-5; router to router normally 1, 6, 7, 8 but not restricted; 3400 R-bricks disable 7 and 8; 108-0266-001 p.40-41"]}
      - {component: bedrock, bus: c-brick-link, role: master, provenance: vendor-document, sources: ["007-4311-002 p.36-37: ports 1-8 are chip A-H; C-bricks must use 2-5; router to router normally 1, 6, 7, 8 but not restricted; 3400 R-bricks disable 7 and 8; 108-0266-001 p.40-41"]}
      - {component: router, bus: c-brick-link, role: endpoint, provenance: vendor-document, sources: ["007-4311-002 p.36-37: ports 1-8 are chip A-H; C-bricks must use 2-5; router to router normally 1, 6, 7, 8 but not restricted; 3400 R-bricks disable 7 and 8; 108-0266-001 p.40-41"]}
