# The SGI MENET (MENET/MSER) XIO board: a Bridge and four IOC3s giving four
# Fast Ethernet ports and six serial ports. It fits any XIO slot, an
# Origin 2000 module's or an Origin 200 GIGAchannel cabinet's. A
# composition fits it into a slot connector with a product-level
# module_instances entry whose parent is that connector and selects the
# connector occupied; the connector supplies the XIO widget,
# controlling node and physical port. The Bridge's upstream attachment
# names the placeholder bus `upstream`, which the instance binds to its
# connector's XIO bus. docs/datasheets/sgi-ioc3-boards.md owns the
# board's evidence, its model selections and its open questions.
layer_version: 1
layer:
  kind: module
  id: menet
  data:
    components:
      - id: menet
        name: MENET 4-port Fast Ethernet and 6-port serial XIO board
        kind: board
        hardware_kind: menet
        identity:
          part: "030-0873-003"
          notes: >-
            A real Origin 2000's hinv -vm prints MENET Board part
            030-0873-003 at revisions C and J; an Onyx2 prints 030-0873-004
            rev A. The model presents 030-0873-003 rev J with the Bridge
            revision the same real board reports.
        provenance: derived
        datasheet_contracts: [docs/datasheets/sgi-ioc3-boards.md]
        sources: ["forum/mimgfx-origin2000-owner-inventory.html real Origin 2000 hinv -vm: Location /hw/module/1/slot/io8/menet, MENET Board part 030-0873-003 rev J; Origin MENET board, module 1 slot 8: Revision 4", "io-chip/108-0151-001-iris-4port-fast-ethernet-adapter.pdf printed pages 1-6 and 1-7, a Bridge and four IOC3s"]
