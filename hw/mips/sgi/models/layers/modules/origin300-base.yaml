    interrupts:
      - id: scsi-interrupt
        source: scsi
        provenance: observed-hardware
        description: >-
          The fixed board route is ISP12160 INTA to head-F physical pin 1. Every
          pending-bit and processor destination after that pin is programmed by
          the guest.
        sources: ["boot-logs/openbsd-sgi-list/marc-125897882029839-origin-300-installation-issues.html lines 55 to 90", "boot-logs/openbsd-sgi-list/marc-139223952727384-origin-300-numalink-1.html lines 150 to 183", "openbsd:2df91d80c1 sys/arch/sgi/xbow/xbridge.c lines 1220 to 1290 and 1336 to 1411", "linux-ip35:9f613a321ea0 arch/mips/pci/pci-sgipic.c"]
        chain:
          - { at: scsi, as: "PCI INTA at 00:01.0", mechanism: level }
          - { at: xbridge-bridge-f, as: "physical interrupt pin 1", mechanism: wire }
          - &io8-route-program { at: xbridge-bridge-f, as: "guest-programmed set and optional clear XIO writes", mechanism: xio-write }
          - &io8-route-crossbar { at: xbridge-crossbar, as: "route to Bedrock host port 0xa", mechanism: xio-write }
          - &io8-route-pending { at: bedrock, as: "guest-selected pending bit", mechanism: pending-bit, notes: "The processor mask and hardware interrupt line are also guest-selected and are not fixed machine-chain endpoints." }

      - id: ioc3-superio-interrupt
        source: ioc3
        provenance: observed-hardware
        description: >-
          The IOC3 SuperIO block has a separate board output to head-F physical pin
          0. It does not share the Ethernet function's PCI INTA route.
        sources: ["boot-logs/openbsd-sgi-list/marc-125897882029839-origin-300-installation-issues.html lines 55 to 90", "boot-logs/openbsd-sgi-list/marc-139223952727384-origin-300-numalink-1.html lines 150 to 183", "openbsd:2df91d80c1 sys/arch/sgi/xbow/xbridge.c lines 1220 to 1290 and 1336 to 1411", "linux-ip35:9f613a321ea0 arch/mips/pci/pci-sgipic.c"]
        chain:
          - { at: ioc3, as: "SuperIO interrupt output", mechanism: level }
          - { at: xbridge-bridge-f, as: "physical interrupt pin 0", mechanism: wire }
          - *io8-route-program
          - *io8-route-crossbar
          - *io8-route-pending

      - id: ioc3-ethernet-interrupt
        source: ioc3
        provenance: observed-hardware
        description: >-
          The IOC3 Ethernet PCI function asserts INTA at 00:04.0, wired to head-F
          physical pin 4 independently of the SuperIO output.
        sources: ["boot-logs/openbsd-sgi-list/marc-125897882029839-origin-300-installation-issues.html lines 55 to 90", "boot-logs/openbsd-sgi-list/marc-139223952727384-origin-300-numalink-1.html lines 150 to 183", "openbsd:2df91d80c1 sys/arch/sgi/xbow/xbridge.c lines 1220 to 1290 and 1336 to 1411", "linux-ip35:9f613a321ea0 arch/mips/pci/pci-sgipic.c"]
        chain:
          - { at: ioc3, as: "Ethernet PCI INTA at 00:04.0", mechanism: level }
          - { at: xbridge-bridge-f, as: "physical interrupt pin 4", mechanism: wire }
          - *io8-route-program
          - *io8-route-crossbar
          - *io8-route-pending

      - id: usb-interrupt
        source: usb
        provenance: observed-hardware
        description: >-
          The OHCI controller's INTA at 00:05.0 is wired to head-F physical pin 5.
          The observed Bedrock interrupt number 59 is a guest allocation, not board
          wiring.
        sources: ["boot-logs/openbsd-sgi-list/marc-125897882029839-origin-300-installation-issues.html lines 55 to 90", "boot-logs/openbsd-sgi-list/marc-139223952727384-origin-300-numalink-1.html lines 150 to 183", "openbsd:2df91d80c1 sys/arch/sgi/xbow/xbridge.c lines 1220 to 1290 and 1336 to 1411", "linux-ip35:9f613a321ea0 arch/mips/pci/pci-sgipic.c"]
        chain:
          - { at: usb, as: "PCI INTA at 00:05.0", mechanism: level }
          - { at: xbridge-bridge-f, as: "physical interrupt pin 5", mechanism: wire }
          - *io8-route-program
          - *io8-route-crossbar
          - *io8-route-pending

    open_questions:
      - id: option-slot-intx-swizzle
        question: Which PCI INTx source and riser swizzle produce each observed head-E device-to-XBridge interrupt number?
        about: [xbridge-bridge-e, pci-option-slot-1, pci-option-slot-2]
        candidates:
          - answer: Record only device 1 to XBridge interrupt number 1 and device 2 to interrupt number 2.
            source: The retained 2009 Origin 300 OpenBSD capture observes those associations but does not report either card's PCI Interrupt Pin field.
            notes: Current model position; no PCI INTx source or unsupported swizzle is invented.
          - answer: Apply the conventional rotating PCI swizzle for all four INTx inputs.
            source: A generic PCI convention would suggest it, but no board source read for this handoff establishes the IO-8 trace.
            notes: Rejected until this exact riser wiring is observed or documented.
        consequence: >-
          Empty slots and their observed device numbers are represented. No option
          card interrupt source can be wired from this observation alone because
          the asserted PCI INTx input and riser swizzle are unknown.
        settled_by: An IO-8 riser schematic or a public hardware capture that identifies the occupied slot, asserted INTx input and resulting head-E physical pin.
      - id: io8-pci-subsystem-identities
        question: What subsystem vendor and device values do the IP45 ISP12160, IOC3 and OHCI functions expose?
        about: [scsi, ioc3, usb]
        candidates:
          - answer: Expose 0xffff:0xffff on ISP12160 and Lucent OHCI, and 0x10a9:0xffff on IOC3.
            source: Bounded hardware review plus current QEMU inventory showing that unset fields acquire unrelated generic PCI defaults and an unset IOC3 instance inherits the Origin 200 system-board device value 0xc303.
            notes: Current emulator policy; 0xffff device values mean unobserved and unavailable, not IP45 hardware. IOC3 retains the public class-wide SGI subsystem vendor.
          - answer: Program exact values from an Origin 300 PCI configuration-space capture.
            source: No such capture was resolved during this bounded research.
        consequence: >-
          The ISP12160 and Lucent identity qtests must read 0xffff:0xffff and
          reject unrelated generic PCI defaults. The placeholders do not establish IP45
          hardware and must be replaced when an Origin 300 capture supplies exact
          subsystem values. The IOC3 identity qtest must read 0x10a9:0xffff and
          reject the inherited Origin 200 system-board value 0x10a9:0xc303.
        settled_by: A public full PCI configuration-space dump from the fixed ISP12160, IOC3 and OHCI functions on an Origin 300 IO-8.
      - id: io8-timekeeper-decode
        question: Which Timekeeper package and complete NVRAM decode are fitted behind IOC3 byte-bus select 0 on IP45?
        about: [ioc3]
        candidates:
          - answer: Model the existing M48T35-compatible 32 KB byte-wide device as an explicit compatibility choice.
            source: Current QEMU sgi-ioc3 inventory; OpenBSD's IP35 consumer attaches a DS1742W-compatible interface at select 0.
            notes: Does not identify the physical IP45 package or prove its capacity.
          - answer: Use the exact physical package, capacity and decode once a board-specific source establishes them.
            source: No retained board document or capture read for this handoff settles those fields.
        consequence: >-
          Time and persistent NVRAM can be exposed for guest integration only with
          an Origin 300 qtest that realizes population 0x17 with timekeeper-kind 1,
          verifies select 0 and the consumer-used clock-register placement, checks
          persistence, and migrates the state between identical builds. Existing
          Origin 200 qtests cover the emulator M48T35 class's 32 KB storage, top
          clock registers, persistence, reset and explicit kind selection; they do
          not establish the IP45 package or full decode.
        settled_by: >-
          The compatibility boundary is protected by the required Origin 300 qtest.
          An IP45 IO-8 schematic, parts list or bounded hardware decode and package
          capture is still required to establish the physical package and full decode.
      - id: board-identification-decode
        question: How should IP45 board identification be modeled without independent decoder evidence?
        about: [bedrock]
        candidates:
          - {answer: "leave the region unassigned pending independent IP45 evidence", source: "James, 2026-09-05; docs/library/origin300-identity-evidence.md", notes: "current model position"}
          - {answer: "propose a guest-specific compatibility response", source: "OpenBSD consumer observation recorded in docs/library/origin300-identity-evidence.md", notes: "not approved; cannot be presented as a fitted ASIC or a hardware reset value"}
        consequence: OpenBSD has an identification read, but its register name and a boot banner do not establish the physical decoder, complete register value, or a second register on IP45. No identity region is assigned from that evidence alone.
        settled_by: Independent IP45 hardware documentation or a hardware register capture with address, width and value. A PROM trace can establish firmware use, not the physical decoder.
      - id: physical-reset-decoder
        question: How does an IP45 processor reset request select the fitted PROM?
        candidates:
          - answer: A board or Bedrock decoder selects a physical flash device.
            source: No retained public source establishes the decoder, fitted part, complete selected range or priority over RAM.
          - answer: The observed software views require a different physical route.
            source: A hardware access capture or published IP45 decoder specification must identify it.
        consequence: The emulator maps one exact stock payload into four bounded views as compatibility policy and makes no physical decoder claim.
        settled_by: A published IP45 decoder specification or a hardware measurement that identifies the responding device, selected range and alias behavior.
      - id: widget-zero-remap
        question: Is the widget-0 remap through translation entry 6 still needed on a Bedrock?
        about: [bedrock, xbridge-crossbar]
        candidates:
          - {answer: "yes; every consumer applies it and OpenBSD never allocates entry 6", source: "OpenBSD ip27_machdep.c lines 478 to 486 and 535 to 536"}
          - {answer: "no; the raw small window answers", source: "refs/linux-ip35 ip35-xtalk.c lines 49, 86 and 169 read widget 0 through the raw window, with no record of it working"}
        consequence: The model answers both forms until settled.
        settled_by: Reading entry 6 after a stock PROM boot on the emulated machine, which observes what the PROM programs.
      - id: firmware-configuration-block
        question: Does an IP45 firmware configuration block exist at boot window offset 0x60?
        about: [bedrock]
        candidates:
          - {answer: "yes, as the Itanium port reads it", source: "Linux v2.5.40 sn1/ip27config.h lines 23 to 28; io/hubspc.c lines 149 to 150"}
          - {answer: "no MIPS consumer depends on it", source: "OpenBSD reads the block on its IP27 branch only, ip27_machdep.c lines 194 to 198"}
        consequence: Which configuration data the stock PROM exposes to the guest; no synthesized replacement is in scope.
        settled_by: A PROM trace or a memory read after boot.
