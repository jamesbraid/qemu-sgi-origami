# SPDX-License-Identifier: BSD-3-Clause
# The BaseIO-G MediaIO daughtercard: a second IOC3 fitted only to the
# BaseIO-G board variant, carrying the PS/2 keyboard and mouse controller a
# plain BaseIO's own IOC3 lacks. The "BaseIO-G and MediaIO" section of
# docs/system/mips/sgi/hardware/baseio.rst is the contract this module follows: a real
# owner's `hinv -v` places the BaseIO-G's two IOC3s at PCI devices 2 and 6,
# and the MediaIO IOC3 at device 6 is the one that fits the keyboard and
# mouse pair. A board whose IOC3 population includes a keyboard-mouse
# subfunction selects the BASEIO_G board kind and QEMU's `io6g` preset; a
# board naming none compiles as plain BASEIO/`io6`. Fitting this module
# under a product's own `baseio` component is what selects BaseIO-G, not a
# separate declared flag.
#
# A composition instances this under its own `baseio` component with
# `parent: baseio` and binds the placeholder `upstream` bus to that
# product's own BaseIO PCI bus, the way layers/modules/
# onyx2-deskside-module.yaml's directly-authored mediaio-ioc3/
# mediaio-keyboard-mouse components already do; this module exists so a
# product built on a shared module layer (onyx2-rack) can select the same
# fitted daughtercard.
layer_version: 1
layer:
  kind: module
  id: mediaio-g
  requires:
    assembly: ip27
  data:
    components:
      - id: ioc3
        name: MediaIO IOC3
        kind: io-controller
        hardware_kind: ioc3
        identity:
          pci_revision: 1
          notes: "The MediaIO daughtercard's own IOC3."
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/baseio.rst#sgi-baseio-g, qemu:docs/system/mips/sgi/hardware/ioc3.rst]
        provenance: datasheet

      - id: keyboard-mouse
        name: MediaIO PS/2 keyboard and mouse
        kind: subfunction
        hardware_kind: ioc3-keyboard-mouse
        parent: ioc3
        provenance: datasheet

    connections:
      - component: ioc3
        bus: upstream
        role: endpoint
        pci_device: 6
        pci_function: 0
        provenance: datasheet
        sources: ["qemu:docs/system/mips/sgi/hardware/baseio.rst#sgi-baseio-pci"]
        notes: >-
          A placeholder each instance binds to its own product's BaseIO PCI
          bus (bus_bindings). A real owner's hinv -v places the BaseIO-G's
          IOC3s at PCI devices 2 and 6; RAD1 at device 7 is built by QEMU's
          io6g preset and not authored here.
