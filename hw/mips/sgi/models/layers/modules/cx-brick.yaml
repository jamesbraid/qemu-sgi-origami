        description: Eight DIMM slots, 512 MB or 1 GB DIMMs in matched pairs, the first pair in slots 0 and 1, 1 to 8 GB.
        sources: [cx-memory]
      - id: xio-0-connector
        name: XIO 0 connector
        kind: connector
        provenance: vendor-document
        parent: chassis
        connector:
