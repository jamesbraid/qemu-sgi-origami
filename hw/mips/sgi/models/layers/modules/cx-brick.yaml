# SPDX-License-Identifier: BSD-3-Clause
# Origin 3000 Cx-brick: four IP53 node boards and one router board in one
# brick, with four external NUMAlink 3 ports and one XIO port per node board.
layer_version: 1
sources:
  cx-composition: "007-4572-001 printed pages 1 and 3, Table 1: the Cx-brick holds one to four IP53 node boards, one router board and a power entry module, with 4 internal and 4 external NUMAlink 3 ports and 4 internal and 4 external XIO ports"
  cx-node-board: "007-4572-001 printed pages 3 and 4: each IP53 node board carries one Bedrock, zero or four processors A to D, and up to eight DIMMs, with one XIO and one NUMAlink 3 MegArray connector to the router board"
  cx-memory: "007-4572-001 printed pages 4 and 13: 512 MB or 1 GB DDR DIMMs added in matched pairs, the first pair in slots 0 and 1, 1 to 8 GB per node board"
  cx-router: "007-4572-001 printed pages 4 and 5: the router board's router ASIC is the same ASIC as the R-brick's, with four internal NUMAlink 3 links, one per node board, and four external NUMAlink 3 connectors"
  cx-numalink-labels: "007-4572-001 printed pages 5 and 11: the rear NUMAlink connectors are labelled, left to right, NUMAlink 1 Port A, NUMAlink 8 Port H, NUMAlink 7 Port G and NUMAlink 6 Port F; ports A and F both join one neighbouring Cx-brick"
  cx-xio: "007-4572-001 printed page 10: XIO 2 to node 2, XIO 1 to node 1, XIO 3 to node 3 and XIO 0 to node 0"
layer:
  kind: module
  id: cx-brick
  requires: {architecture: sn1, assembly: ip53}
  data:
    components:
      - id: chassis
        name: Cx-brick
        kind: module
        provenance: vendor-document
        sources: [cx-composition]
        notes: >-
          The brick's L1 type character is unknown, so the chassis carries
          no brick_type.
      - id: router-board
        name: Cx-brick router board
        kind: board
        provenance: vendor-document
        parent: chassis
        sources: [cx-router]
      - id: router
        name: SN1 Router
        kind: router-asic
        hardware_kind: router
        router_asic: {port_count: 8, role: router}
        provenance: vendor-document
        parent: router-board
        sources: [cx-composition, cx-router]
        notes: >-
          Eight ports: four internal links to the node boards and four
          external connectors. Which router port each node board's link and
          each connector uses is unknown, so no connection names one.
      - id: numalink-a
        name: NUMAlink 1 Port A
        kind: connector
        provenance: vendor-document
        parent: router
        connector: {interface: NUMAlink 3, location: rear panel, occupancy: opaque, notes: "Joins the neighbouring Cx-brick, with port F."}
        sources: [cx-numalink-labels]
      - id: numalink-h
        name: NUMAlink 8 Port H
        kind: connector
        provenance: vendor-document
        parent: router
        connector: {interface: NUMAlink 3, location: rear panel, occupancy: opaque, notes: "Goes to an R-brick in router-based systems, or to another Cx-brick."}
        sources: [cx-numalink-labels]
      - id: numalink-g
        name: NUMAlink 7 Port G
        kind: connector
        provenance: vendor-document
        parent: router
        connector: {interface: NUMAlink 3, location: rear panel, occupancy: opaque, notes: "Goes to an R-brick in router-based systems, or to another Cx-brick."}
        sources: [cx-numalink-labels]
      - id: numalink-f
        name: NUMAlink 6 Port F
        kind: connector
        provenance: vendor-document
        parent: router
        connector: {interface: NUMAlink 3, location: rear panel, occupancy: opaque, notes: "Joins the neighbouring Cx-brick, with port A."}
        sources: [cx-numalink-labels]
      - id: node0-board
        name: IP53 node board
        kind: board
        hardware_kind: ip53
        provenance: vendor-document
        parent: chassis
        sources: [cx-node-board]
        notes: >-
          Node board 0, labelled N0. Its part number and revision are
          unknown; the Origin 350's IP53 board records do not transfer.
      - id: node0-bedrock
        name: Bedrock
        kind: node-asic
        hardware_kind: bedrock
        node_asic: {processor_interfaces: 2, cpus_per_interface: 2}
        provenance: vendor-document
        parent: node0-board
        sources: [cx-node-board]
        notes: The Bedrock revision and clock on a Cx-brick node board are unknown.
      - id: node0-cpu0
        name: R16000-family CPU
        kind: cpu
        hardware_kind: r16000
        provenance: derived
        parent: node0-bedrock
        notes: >-
          Processor A. No clock, cache, part or reset input is
          asserted for a Cx-brick processor.
      - id: node0-cpu1
        name: R16000-family CPU
        kind: cpu
        hardware_kind: r16000
        provenance: derived
        parent: node0-bedrock
        notes: >-
          Processor B. No clock, cache, part or reset input is
          asserted for a Cx-brick processor.
      - id: node0-cpu2
