# SPDX-License-Identifier: BSD-3-Clause
# Origin 3000 Cx-brick with IP59 node boards: four node boards and one router board in one
# brick, with four external NUMAlink 3 ports and one XIO port per node board.
layer_version: 1
sources:
  cx-composition: "007-4572-001 printed pages 1 and 3, Table 1: the Cx-brick holds one to four IP53 node boards, one router board and a power entry module, with 4 internal and 4 external NUMAlink 3 ports and 4 internal and 4 external XIO ports"
  cx-node-board: "007-4572-001 printed pages 3 and 4: each IP53 node board carries one Bedrock, zero or four processors A to D, and up to eight DIMMs, with one XIO and one NUMAlink 3 MegArray connector to the router board"
  cx-memory: "007-4572-001 printed pages 4 and 13: 512 MB or 1 GB DDR DIMMs added in matched pairs, the first pair in slots 0 and 1, 1 to 8 GB per node board"
  cx-router: "007-4572-001 printed pages 4 and 5: the router board's router ASIC is the same ASIC as the R-brick's, with four internal NUMAlink 3 links, one per node board, and four external NUMAlink 3 connectors"
  cx-numalink-labels: "007-4572-001 printed pages 5 and 11: the rear NUMAlink connectors are labelled, left to right, NUMAlink 1 Port A, NUMAlink 8 Port H, NUMAlink 7 Port G and NUMAlink 6 Port F; ports A and F both join one neighbouring Cx-brick"
  cx-xio: "007-4572-001 printed page 10: XIO 2 to node 2, XIO 1 to node 1, XIO 3 to node 3 and XIO 0 to node 0"
  cx-bedrock-identity: "web:nekonomicon-16729141  an Origin 350 hinv -v reports ASIC BEDROCK Rev 2 at 200 MHz; every published Origin 3000 inventory reports the same for a C-brick"
  ip59-processors: "web:irixnet-thread-2263  module 001c01 of the captured system: four 1.0 GHz R16000 revision 3.0 with 16 MB secondary cache; qemu:docs/system/mips/sgi/ip35.rst#sgi-ip59-profiles  the reset word is a synthetic input"
  ip59-field-upgrade: "openbsd-sgi:2df91d80c104636deeef8124252ddd5951b55fbf share/man/man4/man4.sgi/intro.4 lines 113-114: IP59 is the 1GHz IP53 design"
  cx-l1: "007-4572-001 printed pages 5 and 10: the Cx-brick has one L1 controller, on the router board, with a front display, a console connector and a USB L1 port"
  cx-router-ports: "007-4572-001 printed pages 4 and 11: the external connectors are NUMAlink 1 Port A, 8 Port H, 7 Port G and 6 Port F, so ports 1, 8, 7 and 6 are external; 007-4311-002 printed pages 36 and 37: a C-brick takes router port 2, 3, 4 or 5"
layer:
  kind: module
  id: cx-brick
  requires: {architecture: sn1, assembly: ip53}
  data:
    components:
      - id: chassis
        name: Cx-brick
        kind: module
        provenance: vendor-document
        sources: [cx-composition]
        notes: >-
          The brick's L1 type character is unknown, so the chassis carries
          no brick_type.
      - id: router-board
        name: Cx-brick router board
        kind: board
        provenance: vendor-document
        parent: chassis
        sources: [cx-router]
      - id: router
        name: SN1 Router
        kind: router-asic
        hardware_kind: router
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/router.rst]
        router_asic: {port_count: 8, role: router, node_ports: [2, 3, 4, 5]}
        identity: {part: "0x3017", hardware_revision: 1, chip_inputs: 0}
        provenance: vendor-document
        parent: router-board
        sources: [cx-composition, cx-router]
        notes: >-
          Eight ports: four internal links to the node boards and four
          external connectors. The connector labels number the external
          ports 1, 8, 7 and 6, which leaves 2 to 5, the ports a C-brick
          takes on an R-brick, for the node links. That node board n takes
          port n+2 is a model choice; no source orders them. The part and
          revision are the R-brick's (the addendum says the same ASIC),
          reused; the zero chip inputs are an emulator policy.
      - id: l1
        name: L1 system controller
        kind: system-controller
        hardware_kind: l1
        system_controller: {kind: l1, owner: module, profile: cx-brick}
        provenance: vendor-document
        parent: router-board
        description: >-
          The brick's one L1, on the router board. It serves the four node
          boards over one link each and holds the brick's identity.
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/l1.rst]
        sources: [cx-l1]
      - id: numalink-a
        name: NUMAlink 1 Port A
        kind: connector
        provenance: vendor-document
        parent: router
        connector: {interface: NUMAlink 3, location: rear panel, occupancy: opaque, notes: "Joins the neighbouring Cx-brick, with port F."}
        sources: [cx-numalink-labels]
      - id: numalink-h
        name: NUMAlink 8 Port H
        kind: connector
        provenance: vendor-document
        parent: router
        connector: {interface: NUMAlink 3, location: rear panel, occupancy: opaque, notes: "Goes to an R-brick in router-based systems, or to another Cx-brick."}
        sources: [cx-numalink-labels]
      - id: numalink-g
        name: NUMAlink 7 Port G
        kind: connector
        provenance: vendor-document
        parent: router
        connector: {interface: NUMAlink 3, location: rear panel, occupancy: opaque, notes: "Goes to an R-brick in router-based systems, or to another Cx-brick."}
