          - qemu:docs/system/mips/sgi/hardware/bedrock.rst#sgi-bedrock-xb
        node_asic: {processor_interfaces: 2, cpus_per_interface: 2}
        identity: {widget_part: "0xc110", widget_mfg: "0x036", hardware_revision: 2, clock_mhz: 200}
        provenance: derived
        parent: node0-board
        sources: [cx-node-board, cx-bedrock-identity]
        notes: >-
          Approximation. The identity is the Bedrock every published Origin
          3000 and Origin 350 inventory reports (revision 2, 200 MHz); no
