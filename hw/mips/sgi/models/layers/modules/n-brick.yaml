# SPDX-License-Identifier: BSD-3-Clause
# Onyx 3000 N-brick: four XBridges, one per board, each joining one
# C-brick connector to one graphics pipe connector, with no PCI and no XIO
# slots. Which of ports A and B faces the C-brick is unknown; this layer
# puts the C-brick on A and the pipe on B on every chip, as the I-brick
# layer puts its C-brick on A. That connector C-brick n pairs with Graphics
# pipe n through chip n is inferred from the four numbered pairs, not
# printed. The real brick's L1 hears any of the four C-bricks, so the
# C-bricks' L1s reach one controller, as each C-brick's reaches its I-brick's.
layer_version: 1
layer:
  kind: module
  id: n-brick
  requires: {architecture: sn1}
  data:
    components:
      - id: brick
        name: N-brick
        kind: module
        provenance: vendor-document
        sources: ["007-4264-002 printed pages 58 to 60: the N-brick has four pairs of connectors, C-brick 0 to 3 to the C-bricks' XIO (II) connectors and Graphics pipe 0 to 3 to G-brick Ktown2 connectors", "N-brick Overview, revision 10/24/01, printed page 5: the N-brick L1 hears any of the four C-bricks, no one designated master"]
        notes: >-
          The 2U connector brick of an InfiniteReality system. Its fans, LEDs
          and power board are not modelled. No brick-type character is
          established for its L1.
      - id: l1
        name: L1 system controller
        kind: system-controller
        hardware_kind: l1
        system_controller: {kind: l1}
        provenance: vendor-document
        parent: brick
        description: >-
          The N-brick's L1. It hears each C-brick cabled to the brick, and
          those C-bricks' L1s reach it over their XIO cables.
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/l1.rst]
        sources: ["007-4264-002 printed pages 58 to 60: the N-brick has four pairs of connectors, C-brick 0 to 3 to the C-bricks' XIO (II) connectors and Graphics pipe 0 to 3 to G-brick Ktown2 connectors", "N-brick Overview, revision 10/24/01, printed page 5: the N-brick L1 hears any of the four C-bricks, no one designated master"]
      - id: chip-board0
        name: XBridge board 0
        kind: board
        provenance: vendor-document
        parent: brick
        sources: ["007-4264-002 printed pages 58 to 60: the N-brick has four pairs of connectors, C-brick 0 to 3 to the C-bricks' XIO (II) connectors and Graphics pipe 0 to 3 to G-brick Ktown2 connectors", "N-brick Overview, revision 10/24/01, printed pages 1 and 3 to 4: four XBridge ASICs on four boards, each exposing only Crosstown2 ports A and B; ports 8, 9, C, D, E and F are logically disconnected and the brick has no other I/O"]
        notes: Which board serves which connector pair is not printed; board 0 serving pair 0 is this layer's choice.
      - id: xbridge0
        name: XBridge 0
        kind: crossbar
        hardware_kind: xbridge
        datasheet_contracts: [qemu:docs/system/mips/sgi/hardware/xbridge.rst]
        crossbar: {kind: xbridge}
        identity:
          widget_revision: 2
          notes: >-
            The revision the QEMU XBridge model presents, as the I-brick's
            chip does. The N-brick's fitted XBridge revision is unknown; a
            widget scan of a real N-brick would settle it.
        provenance: vendor-document
        parent: chip-board0
        sources: ["007-4264-002 printed pages 58 to 60: the N-brick has four pairs of connectors, C-brick 0 to 3 to the C-bricks' XIO (II) connectors and Graphics pipe 0 to 3 to G-brick Ktown2 connectors", "N-brick Overview, revision 10/24/01, printed pages 1 and 3 to 4: four XBridge ASICs on four boards, each exposing only Crosstown2 ports A and B; ports 8, 9, C, D, E and F are logically disconnected and the brick has no other I/O"]
        notes: No PCI heads or Crosstalk ports are in use. The chip's revision line is not established; the identity block records the model's choice.
      - id: c-brick-0
        name: C-brick 0 connector
        kind: connector
        provenance: vendor-document
        parent: xbridge0
        connector:
          interface: Crosstown2
          location: rear panel
          occupancy: opaque
          port: 0xa
          notes: >-
            To a C-brick's XIO (II) connector. Port A is this layer's choice;
            which port faces the C-brick is unknown.
        sources: ["007-4264-002 printed pages 58 to 60: the N-brick has four pairs of connectors, C-brick 0 to 3 to the C-bricks' XIO (II) connectors and Graphics pipe 0 to 3 to G-brick Ktown2 connectors", "108-0240-002 printed pages 2-26 and 2-27: XBridge Crosstown2 ports A (10) and B (11)"]
