# SPDX-License-Identifier: BSD-3-Clause
# Shared SN1 address architecture.
layer_version: 1
layer:
  kind: architecture
  id: sn1
  contract: {generation: SN1, architecture_ip: IP35, kernel_ip: IP27}
  data:
    model_version: 1
    evidence_policy: strict
    space_selection:
      mechanism: processor-attribute
      bits: "58:57"
      count: 4
      provenance: public-header
      sources: ["openbsd-sgi:2df91d80c104 sys/arch/mips64/include/cpu.h lines 92 to 113", "linux-ip35:9f613a321ea03fb91bd9947cca7dda2888ccb447 arch/mips/include/asm/mach-ip35/spaces.h lines 13 to 22", "linux-history:7570df54ef8c include/asm-ia64/sn/sn1/bedrock.h lines 40 to 44"]
      notes: >-
        Unchanged from the Origin 200: two uncached-attribute bits the R10000-family
        processor drives beside the 40-bit physical address. The seven-space,
        address-field encoding this file once carried matches no public source, MIPS
        or Itanium; the Origin 200's two-bit emulation carrier therefore fits this
        generation as it stands.

    processors:
      - part: r12000
        variants:
          - clock_mhz: 400
            cache_mib: 8
            processor_identification: "0x0e35"
            fpu_identification: "0x0935"
            cache_clock_mhz: 266
            reset_mode_bits: "0x0014a785"
            notes: >-
              The Origin 3200 C-brick's selected fit. Established: a posted
              Origin 3200 inventory reports four 400 MHz R12000s per C-brick
              at revision 3.5, each with an 8 MB secondary cache at 266 MHz,
              and an R12010 FPU at revision 3.5. Inferred: the PRId and the
              FPU identification, from those printed revisions and the
              R10000-family implementation numbers. Approximated: the
              reset-mode word is the low 25 bits of the stock IP35 PROM's
              configuration-table word for a 400 MHz, 8 MB C-brick, the way
              the Origin 300's R14000 word is its row's; no capture of a
              C-brick's reset mode exists.
        provenance: observed-hardware
        sources: ["web:nekonomicon-16723604 hinv -mv of an Origin 3200, the CPU 0 to 7, FPU and Scache lines", "firmware:ip35-prom-6.210 CPU-configuration table, the 400 MHz, 8 MiB C-brick row, word 0x5414a785", "108-0240-002 printed page 2-4: a PIMM carries R12000 processors at 360 MHz or R12000A at 400 MHz with a 4 or 8 MB secondary cache", "linux:db2ddb87143519e20a95aa36c60b36107b736a58 arch/mips/include/asm/cpu.h lines 76 and 229: R12000 implementation and revision mask"]
      - part: r14000
        variants:
          - clock_mhz: 500
            cache_mib: 2
            reset_mode_bits: "0x009aa985"
            notes: "QEMU's currently shipping 500 MHz/2 MiB Origin 300 configuration writes this exact Config0 low-25-bit reset word (readback 0x6c9aa985). No product here yet reads this field; it moves machine.firmware_config.processor_reset_mode here for a future compiler once a Bedrock-node compile path exists. The complete Config0 write mask remains unestablished for R14000, so only the literal word is carried, not a named-field encoding."
          - clock_mhz: 600
            cache_mib: 2
          - clock_mhz: 600
            cache_mib: 8
            processor_identification: "0x0f24"
            cache_clock_mhz: 300
            reset_mode_bits: "0x009cab85"
            notes: >-
              The 600 MHz C-brick PIMM, part 030-1734-00x. Established: the
              retained inventories capture it with 8 MB per processor at
              300 MHz and Tap 0xa, and print processor revisions 2.3 and
              2.4; the PRId 0x0f24 is the revision 2.4 one (the model's
              R14000 type, implementation 0x0f). Approximated: the
              reset-mode word is the low 25 bits of the stock IP35 PROM's
              configuration-table word for a 600 MHz, 8 MB C-brick,
              0x549cab85, whose SS field selects 8 MB; no capture of a
              C-brick's reset mode exists. Unknown: the FPU revision.
        provenance: observed-hardware
        sources: ["108-0263-004 (Origin 300 scan tools guide), configuration names", "firmware:ip35-prom-6.210 CPU-configuration table, the 600 MHz, 8 MiB C-brick row, word 0x549cab85", "108-0266-001 printed page 28: a C-brick PIMM option of R14000 processors with 8 MB per processor"]
      - part: r16000
        variants:
          - clock_mhz: 700
            cache_mib: 8
            notes: >-
              Selected software profile for the Origin 3900 IP53 runtime model.
              This tuple does not identify a processor stepping or prove a
              physical Origin 3900 configuration.
          - clock_mhz: 800
            cache_mib: 8
            cache_clock_mhz: 400
            reset_mode_bits: "0x009caf85"
            cache_tap: 0xa
            firmware_word: "0x549caf85"
            notes: >-
              Captured on module 001c01 in the customized Onyx 350 system,
              and printed by the 030-1959-002 and 030-1959-003 boards of
              Origin 350 and Tezro inventories, each with a 400 MHz cache
              clock and tap 0xa. The flash word is the stock IP35 PROM's
              configuration-table word for it (row 21; the row carries
              machine type 2 where the profiles store 0) and the reset word
              is its low 25 bits, a model derivation. Processor
              identification differs by board and is authored where a board
              fits the part. The observed tuple does not prove standalone
              operation.
          - clock_mhz: 1000
            cache_mib: 16
            cache_clock_mhz: 333
            notes: >-
              Public HINV reports this tuple for module 001c01, an IP59_4CPU
              board; the IP59 products and the Onyx 4 host experiment use it.
              Every retained 1.0 GHz module prints a 333 MHz cache clock. It
              does not establish reset behavior.
          - clock_mhz: 700
            cache_mib: 4
            cache_clock_mhz: 350
            reset_mode_bits: "0x009bad85"
            cache_tap: 0xc
            firmware_word: "0x589bad85"
            notes: >-
              Origin 350 and Tezro tuple, printed by the 030-1868-001 and
              030-1869-001 boards with a 350 MHz cache clock and tap 0xc. The
              flash word is the stock IP35 PROM's configuration-table word
              for it (row 26; the row carries machine type 2 where the
              profiles store 0) and the reset word is its low 25 bits, a
              model derivation. Processor identification differs by board
              and is authored where a board fits the part.
          - clock_mhz: 800
            cache_mib: 4
            cache_clock_mhz: 400
            reset_mode_bits: "0x009baf85"
            cache_tap: 0xa
            firmware_word: "0x549baf85"
            notes: >-
              Tezro tuple, printed by the 030-1956-002 board with a 400 MHz
              cache clock and tap 0xa. The flash word is the stock IP35
              PROM's configuration-table word for it (row 20; the row
              carries machine type 2 where the profiles store 0) and the
              reset word is its low 25 bits, a model derivation. Processor
              identification differs by board and is authored where a board
              fits the part.
        provenance: derived
        sources: ["qemu:docs/system/mips/sgi/ip53.rst#sgi-ip53-serial-profiles  selected Origin 350 processor inputs", "web:graphica-onyx350-hinv  module 001c01 CPU inventory, four 800 MHz R16000 with 8 MiB cache; single-module operation remains unverified", "web:irixnet-thread-2263  module 001c01 reports 1 GHz/16 MiB; Onyx 4 host assignment remains inferred"]

    address_spaces:
      - id: cached
        name: cached
        unmapped_base: "0xa800_0000_0000_0000"
        node_stride: "0x2_0000_0000"
        provenance: datasheet
        notes: The cached xkphys base, with no attribute; the same value as the Origin 200.

      - id: hub-special
        name: Hub special
        selector: 0
        unmapped_base: "0x9000_0000_0000_0000"
        node_stride: "0x2_0000_0000"
        provenance: datasheet
        notes: >-
          Attribute 0, as on the Origin 200. Split on IP35 into a 128 MB local
          register window at 0x1000_0000 and a 128 MB boot window at 0x1800_0000,
          with remote forms at 0x3000_0000 and 0x3800_0000. The L1 UART is inside
          the register window. The OpenBSD board-identification read remains an
          unresolved consumer requirement.

      - id: io
        name: I/O
        selector: 1
        unmapped_base: "0x9200_0000_0000_0000"
        node_stride: "0x2_0000_0000"
        provenance: datasheet
        notes: >-
          16 MB small windows at widget times 16 MB; 512 MB big windows in M mode at
          (entry plus one) times 512 MB, selected by seven translation entries; the
          Bedrock's own registers are widget 1 of the node.

      - id: memory-special
        name: memory special
        selector: 2
        unmapped_base: "0x9400_0000_0000_0000"
        node_stride: "0x2_0000_0000"
        provenance: datasheet
        notes: Attribute 2.

      - id: memory
        name: uncached memory
        selector: 3
        unmapped_base: "0x9600_0000_0000_0000"
        node_stride: "0x2_0000_0000"
        provenance: datasheet
        notes: >-
          Attribute 3. The node number sits at physical bits 39:33 in M mode, seven
          bits, an 8 GB node window and 128 nodes; N mode halves the window and is
          out of scope.
