# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: architecture
  id: ip30
  contract:
    generation: IP30
    architecture_ip: IP30
    kernel_ip: IP30
  data:
    model_version: 1
    evidence_policy: strict
    space_selection:
      mechanism: processor-attribute
      bits: '58:57'
      count: 4
      provenance: derived
      sources:
      - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-space-selection
    processors:
    - part: r10000
      variants:
      - clock_mhz: 195
        cache_mib: 1
      provenance: derived
      sources:
      - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-processors
    - part: r12000
      variants:
      - clock_mhz: 360
        cache_mib: 2
        # Approximation. The module's sampled reset word is unknown; only
        # SS=010 follows from the reported 2 MiB cache
        # (docs/specs/sgi-ip30.rst, R12000 catalogue defaults). This is the word the
        # emulator's Octane2 qtests have run with: big-endian, SS=010,
        # SB=1 (32-word blocks), Kseg0 algorithm 3, and the remaining
        # divisor and mode fields chosen only to be valid encodings.
        reset_mode_bits: '0x001aa683'
        notes: >-
          Emulator compatibility value, not a measured Octane2 reset word.
          The machine's r12000-reset-mode, r12000-scache-bytes and
          r12000-scache-block-words properties override it.
      provenance: derived
      sources:
      - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-processors
    address_spaces:
    - id: physical
      name: IP30 physical address space
      provenance: derived
      sources:
      - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-address-map
