# SPDX-License-Identifier: BSD-3-Clause
# Experimental direct NI attachment of the PCI expansion assembly.
layer_version: 1
sources:
  owner-2cpu: "web:nekonomicon-16726611 two-CPU Origin 300 inventory, IP45_2CPU, slices A and C"
  007-4365-002: "007-4365-002 printed pages 1 and 10 to 12: two or four processors and 512 MB to 4 GB"
  108-0263-004: "108-0263-004 printed page 2-18: two- and four-processor 500 MHz R14000 configurations with 2 MB cache"
layer:
  kind: product
  id: origin300-pci-expansion-unconnected-uart-experiment
  requires: {assembly: ip45}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[2], [4]]
    provenance: derived
    sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-topology, 007-4365-002, 108-0263-004]
  population:
    nodes: 1
    cpus_per_node: [2]
    provenance: derived
    sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-topology, owner-2cpu, 007-4365-002, 108-0263-004]
  cpu_selection:
    default: {clock_mhz: 500, cache_mib: 2}
    slots: [cpu0, cpu2, cpu1, cpu3]
  memory_kits_per_node: [kit-512-at-banks-2-3]
  data:
    machine:
      name: Origin 300
      model_role: emulation-target
      notes: >-
        Explicit synthetic unconnected 16550 register bank at the remote BIC
        Hub-special window, with no backend or packet service.
        Experimental PCI expansion composition using the reviewed CPU-free
        and RAM-free BIC, NI route and synthetic interrupt adapter. The BIC
        resets with node number zero. Firmware must discover it by route
        and assign its node number. Board records are optional operator
        inputs. The selected functional controller startup experiment assigns
        rack and bay through completed BIC bytes; it models no physical bus.
        Caller-backed configuration storage requires one explicit writable raw
        image. It supplies no factory contents or physical flash identification.
        Construction support does not establish stock PROM or IRIX acceptance.
      emulation:
        bedrock_nodes:
          compute-bedrock:
            board_id_word: 32769
            local_region: 0
            initiator_region: 0
            installed_bank_mask: {mode: fixed, value: 12}
            provenance: derived
            sources: [qemu:hw/mips/sgi/sn1-node.c, qemu:docs/specs/sgi-sn.rst#sgi-sn-topology, qemu:hw/mips/sgi/sn-machine.c]
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
        l1_controllers:
          compute-l1:
            reported_type: 52
            revision: {major: 1, minor: 18, patch: 5}
            provenance: derived
            sources: [qemu:hw/mips/sgi/sn1-node.c, qemu:docs/specs/sgi-sn.rst#sgi-sn-serial-order, qemu:hw/mips/sgi/sn-machine.c]
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
        io_boards:
          compute-xbridge-bridge-f:
            ioc3_subsystem_id: 65535
            mac_source: module-l1
            provenance: derived
            sources: [hw/mips/sgi/baseio.c, qemu:docs/specs/sgi-sn.rst#sgi-sn-board-devices]
            notes: The IOC3 takes its station address from the IO8 board record in the node's L1, the record the stock BASEIO PROM reads through request 0x0006. The unavailable physical subsystem field remains explicit.
        system_timekeepers:
          compute-xbridge-bridge-f:
            kind: m48t35-compatible
            year_base: 1968
            initial_ip27_fixture: false
            provenance: derived
            sources: ["openbsd-sgi:2df91d80c104636deeef8124252ddd5951b55fbf sys/arch/sgi/dev/dsrtc.c lines 169 to 174"]
            notes: IP35 software uses the 1968 year convention. Blank initial storage is emulator policy. Existing compatibility part, capacity and mapping assumptions are unchanged.
        # The IP35 flash configuration block's product values. PROM 6.210
        # compares the block with the CPU-configuration table row its PIMM
        # speed code selects; Origin 300's 0x8000-branch rows carry machine
        # type 1 (SN10) and the 500 MHz, 2 MiB row's mode word is
        # 0x549aa985.
        ip35_firmware:
          machine_type: 1
          cpu_mode_word: 0x549aa985
          provenance: derived
          sources: ["firmware:ip35-prom-6.210 CPU-configuration table rows 6 and 7 and the flash comparison", hw/mips/sgi/sn1-node.c]
          notes: The values every Origin 300 run has flashed, now carried as data; established against the PROM's own table.
        machine_name: origin300
        display_description: SGI Origin 300 (IP45), synthetic unconnected expansion UART experiment
        profile: pci-expansion-unconnected-uart-experiment
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib: [512]
        firmware_payload:
          argument: -bios
          path: firmware/6.5.30/ip35prom.payload.bin
          size: "0x1686a8"
          sha256: 554924380189a03a512156af2faa38344902f251b49fd5c80c253c23ecaff27b
          read_only: true
          views:
            - name: CPU reset view
              address: "0x000_001fc00000"
              payload_offset: "0x0"
              size: "0x1686a8"
            - name: local Hub-special boot view
              address: "0x100_18000000"
              payload_offset: "0x0"
              size: "0x1686a8"
            - name: bounded high local Hub-special boot view
              address: "0x100_1fc00000"
              payload_offset: "0x0"
              size: "0x1686a8"
            - name: node-zero remote Hub-special boot view
              address: "0x100_38000000"
              payload_offset: "0x0"
              size: "0x1686a8"
          second_selection:
            address: "0x100_1a000000"
            size: "0x0080_0000"
          provenance: derived
          sources: [qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-carrier, qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-trampolines, qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-ip35-views]
          notes: >-
            The four views alias one operator-supplied payload. This is emulator
            compatibility policy; it does not identify a fitted flash part, a
            physical reset decoder, a repeating mask, or any decode beyond each
            bounded payload-length view.
        io_assemblies:
          - version: 1
            kind: origin300-pci-expansion
            peer: expansion-bedrock
            module: expansion-enclosure
            controller: expansion-l1
            placement: 1
            initial_node_number: 0
            bedrock_revision: 2
            xbridge_revision: 2
            head_ports: [8, 9, 12, 13]
            controller_profile: pci-expansion
            # Functional controller assignment; not a physical BIC bus model.
            controller_startup: bic-functional-experiment
            configuration_storage: bedrock-flash-experiment
            unconnected_uart: true
            main_power: functional-experiment
            initial_main_power: true
            power_command_issuer: compute-l1
            bic_identity: 49152
            intx_map: [1, 5, 1, 5, 2, 6, 2, 6,
                       1, 5, 1, 5, 2, 6, 2, 6,
                       1, 5, 1, 5, 2, 6, 2, 6,
                       1, 5, 1, 5, 2, 6, 2, 6,
                       1, 5, 1, 5, 2, 6, 2, 6,
                       1, 5, 1, 5, 2, 6, 2, 6]
        l1_management:
          owners:
            - {controller: compute-l1, identity: 101}
            - {controller: expansion-l1, identity: 102}
          associations:
            - {from: 0, to: 1, reachable: true}
            - {from: 1, to: 0, reachable: true}
          attachments:
            - {issuer: 0, owner: 1}
            - {issuer: 1, owner: 0}
        synthetic_identities:
          - component: expansion-bedrock
            serial: "0x51454d554e01"
            reason: Synthetic node identity N1, carrying the "QEMU" marker; not hardware evidence.
          - component: compute-bedrock
            serial: "0x51454d554e00"
            reason: Synthetic node identity N0, carrying the "QEMU" marker; not hardware evidence.
          - component: compute-xbridge
            serial: "0x51454d555800"
            reason: Synthetic XBridge identity X0, carrying the "QEMU" marker; not hardware evidence.
          - component: compute-ioc3
            serial: "0x5e7454d55000"
            reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
        initially_operational_crossbow_links:
          - component: compute-xbridge-crossbar
            widgets: [14, 15]
            reason: >-
              Static emulator startup health for the XBridge's two PCI
              bridge heads, both part of the one physical chip and
              always populated (unlike a Crossbow's cabled Hub links,
              nothing here is removable). Machine launch and
              whole-machine reset reapply it; this does not model
              Crossbow-style link training.
      harness:
        console: l1-uart
        prom_dialogue: ip35-l1-prompt
        default_cpu_model: R14000
        disk_bus: scsi.0
        netboot_adapter: ioc3-ethernet
        default_topology: one-chassis
        identity_inputs: [chassis-eeprom, board-eeprom, spd-eeprom, brick-serial, l1-debug-switches]
        supported_guests: [irix]
        install_media: [disk-image, netboot]
        provenance: derived
        sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-launch-disk-bus, qemu:docs/specs/sgi-sn.rst#sgi-sn-launch-metadata]
    components:
      - id: compute-module
        name: Origin 300 compute server
        kind: module
        provenance: vendor-document
        sources: ["007-4365-002 printed pages 1, 10 to 12 and 38"]
    buses:
      - id: expansion-cable
        name: Experimental compute LINK to expansion NI cable
        kind: fabric
        master: compute-bedrock
        link: {kind: cable}
        provenance: derived
        sources: ["qemu:docs/specs/sgi-pci-expansion.rst#sgi-pci-expansion-origin300"]
    connections:
      - component: compute-bedrock
        bus: expansion-cable
        role: master
        provenance: derived
        sources: ["qemu:docs/specs/sgi-pci-expansion.rst#sgi-pci-expansion-origin300"]
