# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: product
  id: o2
  requires: {assembly: ip32, module: o2-module}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[1]]
    provenance: derived
    sources: ["qemu:docs/system/mips/sgi/ip32.rst#sgi-ip32-processor"]
  population:
    nodes: 1
    cpus_per_node: [1]
    provenance: derived
    sources: ["qemu:docs/system/mips/sgi/ip32.rst#sgi-ip32-memory"]
  cpu_selection:
    default: {clock_mhz: 195, cache_mib: 1}
    slots: [cpu0]
  memory_kits_per_node: [selected-1g]
  data:
    machine:
      name: O2 functional profile
      model_role: emulation-target
      emulation:
        machine_name: o2
        display_description: SGI O2 (IP32)
        lifecycle: implemented
        profile: serial
        emulator_constraints: {accepted_bank_sizes_mib: [128]}
      harness:
        console: mace-serial-a
        launch_recipe: ip32
        prom_dialogue: none
        default_cpu_model: R10000
        disk_bus: aic0.0
        netboot_adapter: mace-ethernet
        default_topology: o2
        firmware_bytes: 524288
        identity_inputs: [identity-test-serial, identity-eprom-file, identity-status, password-clear-input]
        supported_guests: [irix]
        install_media: [disk-image, netboot]
