      - {id: crossbow-0, name: Crossbow 1, kind: crossbar, hardware_kind: xbow, crossbar: {kind: xbow}, identity: {widget_part: "0x0", widget_mfg: "0x0", widget_revision: 2, notes: "Select Crossbow 1.1, the earliest revision accepted by IRIX 6.5.30; not a captured chassis revision."}, datasheet_contracts: [docs/datasheets/xbow.md], provenance: vendor-document, parent: module-midplane, sources: ["108-0175-001 Figures 3-5 and Table 1 printed pages 4-8 PDF pages 18-22 mapping trusted"]}
      - {id: crossbow-1, name: Crossbow 2, kind: crossbar, hardware_kind: xbow, crossbar: {kind: xbow}, identity: {widget_part: "0x0", widget_mfg: "0x0", widget_revision: 2, notes: "Select Crossbow 1.1, the earliest revision accepted by IRIX 6.5.30; not a captured chassis revision."}, datasheet_contracts: [docs/datasheets/xbow.md], provenance: vendor-document, parent: module-midplane, sources: ["108-0175-001 Figures 3-5 and Table 1 printed pages 4-8 PDF pages 18-22 mapping trusted"]}
      - {id: router-board-1, name: Router board R1, kind: board, identity: {part: "030-0841-002", notes: "The Standard Router board the rack module's R1 fits (docs/machines/layers/modules/origin2000-module.yaml)."}, provenance: vendor-document, parent: compute-module, physical_slot: {kind: router, number: 1}, sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "007-3439-002 printed page 57 PDF page 71: the Standard Router cables together 2 to 32 Node boards in 1 to 8 enclosures"]}
      - {id: router-1, name: Router 1, kind: router-asic, hardware_kind: router, router_asic: {port_count: 6, role: router}, identity: {part: "0x1", hardware_revision: 1, chip_inputs: 15, notes: "The same part and R1 slot inputs as the rack module's Router 1."}, datasheet_contracts: [docs/datasheets/router.md], provenance: vendor-document, parent: router-board-1, sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified"]}
      - {id: router-board-2, name: Router board R2, kind: board, identity: {part: "030-0841-002", notes: "The Standard Router board the rack module's R2 fits (docs/machines/layers/modules/origin2000-module.yaml)."}, provenance: vendor-document, parent: compute-module, physical_slot: {kind: router, number: 2}, sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "007-3439-002 printed page 57 PDF page 71: the Standard Router cables together 2 to 32 Node boards in 1 to 8 enclosures"]}
      - {id: router-2, name: Router 2, kind: router-asic, hardware_kind: router, router_asic: {port_count: 6, role: router}, identity: {part: "0x1", hardware_revision: 1, chip_inputs: 14, notes: "The same part and R2 slot inputs as the rack module's Router 2."}, datasheet_contracts: [docs/datasheets/router.md], provenance: vendor-document, parent: router-board-2, sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified"]}
