# SPDX-License-Identifier: BSD-3-Clause
# The Origin 2000 deskside: the eight-processor module in a deskside
# enclosure (docs/datasheets/onyx2.md, Telling an Onyx2 from an Origin 2000),
# with a plain BaseIO in IO1 and no graphics, and one to four node boards
# fitted in SGI's fill order. The composition describes the chassis with all
# four fitted on two Standard Routers, the rack module's fabric, which one
# enclosure may carry (007-3439-002 printed page 57). Fewer node boards take
# fewer boards in the Router slots: none for one, a Null Router for two. SGI's
# cheaper fit for three or four, a Router and a Star Router joined by a
# jumper (007-3453-002 Figure 2-9), is not modelled:
# docs/datasheets/origin2000-module.md, Node-board populations, says why and
# grades each row below.
layer_version: 1
layer:
  kind: product
  id: origin2000-deskside
  requires:
    assembly: ip27
  topology:
    min_nodes: 1
    max_nodes: 4
    supported_cpu_populations:
    - [2, 2, 2, 2]
    provenance: vendor-document
    sources: ["007-3439-002 printed page 57 PDF page 71: the Standard Router cables together 2 to 32 Node boards in 1 to 8 enclosures", "007-3453-002 printed page 1 PDF page 19: up to four node boards"]
    node_populations:
    - node_slots: [1]
      routers: []
      fabric_links: []
      xio_slots: {xio-slot-2: 1, xio-slot-3: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1}
      supported_cpu_populations: [[2], [1]]
      grade: inferred
      sources: ["007-3453-002 printed page 21 PDF page 39, Table 2-2: without a router board only one Node board and XIO slots 1-6 work", "007-3453-002 printed page 22 PDF page 40, Figure 2-9: one node board needs no router board"]
      notes: >-
        Figure 2-9 draws one node board with no router board, but the same
        guide's printed page 21 says every deskside ships with the first
        router board installed. Which a one-node deskside carried is not
        settled, so leaving both Router slots empty is inferred.
    - node_slots: [1, 2]
      routers: []
      fabric_links: [null-router]
      xio_slots: {xio-slot-2: 1, xio-slot-3: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2], [1, 1], [2, 1]]
      grade: established
      sources: ["007-3453-002 printed page 22 PDF page 40, Figure 2-9: a two-node Origin 2000 deskside with a Null Router", "007-3453-002 printed page 21 PDF page 39, Table 2-2: XIO slots 7-12 work with a second Node board", "sgi-hw/origin-onyx2-hardware-quick-reference-booklet.pdf Table 41 printed page 130 PDF page 132: in a 2-node system N1 controls IO1-IO6 and N2 IO7-IO12"]
    - node_slots: [1, 2, 3]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3]
      xio_slots: {xio-slot-2: 3, xio-slot-3: 1, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2, 2], [1, 1, 1], [2, 1, 1], [2, 2, 1]]
      grade: inferred
      sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "007-3439-002 printed page 57 PDF page 71: the Standard Router cables together 2 to 32 Node boards in 1 to 8 enclosures", "docs/datasheets/origin2000-module.md Node-board populations: the joint-buck capture boots PROM 6.156 on node slots 1-3 with both Routers", "sgi-hw/origin-onyx2-hardware-quick-reference-booklet.pdf Table 41 printed page 130 PDF page 132: the four-node quadrants"]
      notes: >-
        Which node controls IO8, IO10 and IO12 with node board 4 absent is
        inferred: node 2 is the only Hub on Crossbow 1. Two Standard Routers
        in a deskside is the model's choice among fits SGI documents; see
        the four-node row.
    - node_slots: [1, 2, 3, 4]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3, r2-node4]
      xio_slots: {xio-slot-2: 3, xio-slot-3: 1, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 4, xio-slot-9: 2, xio-slot-10: 4, xio-slot-11: 2, xio-slot-12: 4}
      supported_cpu_populations: [[2, 2, 2, 2], [1, 1, 1, 1], [2, 1, 1, 1], [2, 2, 1, 1], [2, 2, 2, 1]]
      grade: inferred
      notes: >-
        SGI shipped three- and four-node desksides with a Router and a Star
        Router (007-3453-002 Figure 2-9), and 007-3439-002 printed page 57
        says 3- and 4-node configurations are built that way. The two
        Standard Routers here rest on a chain: the deskside is one module
        (007-3456-003 printed page 30), 108-0170-001 section 6.2.1 gives a
        fully populated single module two Routers, and 007-3439-002 printed
        page 57 lets Standard Routers join node boards in one enclosure.
        The Star is not modelled because the stock PROM's partner probe
        does not finish on it in the model.
      sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "007-3439-002 printed page 57 PDF page 71: the Standard Router cables together 2 to 32 Node boards in 1 to 8 enclosures", "sgi-hw/origin-onyx2-hardware-quick-reference-booklet.pdf Table 41 printed page 130 PDF page 132: the four-node quadrants", "docs/datasheets/origin2000-module.md Node-board populations: the joint-buck capture's IRIX hinv lists four Hubs and both Routers, each with active ports 4, 5 and 6"]
  population:
    nodes: 4
    cpus_per_node: [2, 2, 2, 2]
    provenance: derived
    sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "007-3439-002 printed page 57 PDF page 71: the Standard Router cables together 2 to 32 Node boards in 1 to 8 enclosures"]
  cpu_selection:
    default: {clock_mhz: 180, cache_mib: 1}
    slots: [cpu-a, cpu-b]
  memory_kits_per_node: [kit-256, kit-256, kit-256, kit-256]
  data:
    machine:
      name: Origin 2000 deskside
      model_role: emulation-target
      notes: >-
        Four node boards, each with two processors and 256 MiB in two
        128 MB banks, two Standard Routers, and a plain BaseIO (io6) in
        IO1, and no graphics, as a shipped Origin 2000 deskside has none.
        The Routers are the model's choice: SGI shipped three- and four-node
        desksides with a Router and a Star Router. The
        machine's nodes= property fits fewer node boards, in SGI's fill
        order: one takes no Router board and two a Null Router
        (007-3453-002 Figure 2-9). This is the eight-processor module, so
        node 1 reaches Crossbow 0 at widget 9, node 2 Crossbow 1 at widget
        A, node 3 Crossbow 0 at widget A and node 4 Crossbow 1 at widget 9.
        This is a selected population, not a captured machine inventory.
        The full processor mode word is not the full CP0 Config register;
        only the reviewed low 25 bits transfer. Stock image configuration
        must agree and is never rewritten by descriptor generation.
      firmware_config:
        cpu_clock_hz: 180000000
        hub_clock_hz: 90000000
        processor_reset_mode:
          kseg0_cache_algorithm: cacheable-coherent-exclusive-on-write
          processor_device_number: 0
          coherent_request_target: external-agent
          processor_eliminate_requests: false
          maximum_outstanding_processor_requests: 4
          system_clock_divisor: 2
          secondary_cache_block_words: 32
          secondary_cache_error_correction: retry-access-through-corrector
          memory_endianness: big
          secondary_cache_size_kib: 1024
          secondary_cache_clock_divisor: 1.5
          secondary_cache_clock_tap: 9
          open_drain_system_interface: false
          cache_test_mode: false
        machine_type: 0
        flash_read_cycles: 8
        flash_write_cycles: 1
        provenance: derived
        sources: ["docs/datasheets/origin2000-cpu-reset-mode.md selects the documented 180 MHz R10000, 90 MHz Hub, 1 MiB cache composition matching the unchanged stock mode word.", "docs/reviews/origin2000-firmware-configuration-review-20260905.md independently cleared the stock firmware record and flash controller fields.", "docs/datasheets/hub-processor-interface.md shared RTC contract specifies 1250000 Hz."]
      emulation:
        machine_name: origin2000
        display_description: SGI Origin 2000 deskside
        profile: origin2000-deskside
        lifecycle: implemented
        emulator_constraints:
          # Per-node totals -m may select. QEMU lays 256 MiB out as two
          # 128 MB banks, never the single 256 MB bank the stock PROM refuses
          # on this board.
          accepted_bank_sizes_mib:
          - 64
          - 256
        initial_module_numbers:
        - component: compute-module
          number: 1
          reason: >-
            Selected initial identity, matching the rack module. With 0 the
            stock PROM votes a module number and resets once more before it
            settles.
        initially_operational_crossbow_links:
        - component: crossbow-0
          widgets: [8, 9, 10]
          reason: >-
            Static emulator startup health for the fitted BaseIO and the Hub
            links of nodes 1 and 3. Machine launch and whole-machine reset
            reapply it; migration restores runtime link state instead. This
            does not model Crossbow training or establish diagnostic
            acceptance.
        - component: crossbow-1
          widgets: [9, 10]
          reason: >-
            Static emulator startup health for the Hub links of nodes 2 and
            4. Machine launch and whole-machine reset reapply it; migration
            restores runtime link state instead.
        hub_ni_revision_overrides:
        - component: node-board-1-hub
          ni_revision: 5
          reason: >-
            Stock Origin 2000 inventories report Hub revision code 5: the
            two-node Origin 2200 capture model-toad (an 8P12_MPLN module
            with no graphics) prints HUB Revision 5 on both node slots, and
            no stock capture shows code 3. The reusable node-board module's
            code 3 (Hub 2.1, the earliest IRIX 6.5.30 accepts) stays the
            baseline for products this override does not name.
        - component: node-board-2-hub
          ni_revision: 5
          reason: Matches node-board-1-hub; a module's Hubs share one manufactured revision.
        - component: node-board-3-hub
          ni_revision: 5
          reason: Matches node-board-1-hub; a module's Hubs share one manufactured revision.
        - component: node-board-4-hub
          ni_revision: 5
          reason: Matches node-board-1-hub; a module's Hubs share one manufactured revision.
        module_semantic_serials:
        - component: compute-module
          serial: SGIMODULE2
          reason: >-
            Stable synthetic module identity for this selected emulated
            installation, distinct from the rack module's SGIMODULE1 because
            the two are separate selected installations of the same physical
            module type, never running together.
        module_responder_identities:
        - component: node-board-1-hub
          serial: '0x100000000009'
          reason: Stable synthetic node-local module responder identity, the rack module's own value for the same node slot.
        - component: node-board-2-hub
          serial: '0x10000000000a'
          reason: Stable synthetic node-local module responder identity, the rack module's own value for the same node slot.
        - component: node-board-3-hub
          serial: '0x10000000000b'
          reason: Stable synthetic node-local module responder identity, the rack module's own value for the same node slot.
        - component: node-board-4-hub
          serial: '0x10000000000c'
          reason: Stable synthetic node-local module responder identity, the rack module's own value for the same node slot.
        synthetic_identities:
        - component: node-board-1-hub
          serial: '0x100000000001'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for the same node slot.
        - component: node-board-2-hub
          serial: '0x100000000002'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for the same node slot.
        - component: node-board-3-hub
          serial: '0x100000000003'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for the same node slot.
        - component: node-board-4-hub
          serial: '0x100000000004'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for the same node slot.
        - component: router-1
          serial: '0x100000000005'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for its Router 1.
        - component: router-2
          serial: '0x100000000006'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for its Router 2.
        - component: baseio-bridge
          serial: '0x100000000007'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for its BaseIO Bridge.
        - component: baseio-ioc3
          serial: '0x100000000008'
          reason: Stable synthetic identity for this selected physical component; not hardware evidence. The rack module's own value for its BaseIO IOC3.
    evidence_policy: strict
    components:
      - {id: origin2000-chassis, name: Origin 2000 chassis, kind: chassis, provenance: vendor-document, sources: ["108-0175-001 Figures 3-5 printed pages 4-8 PDF pages 18-22 mapping trusted"]}
      - {id: compute-module, name: system module, kind: module, provenance: vendor-document, parent: origin2000-chassis, sources: ["108-0175-001 Figures 3-5 printed pages 4-8 PDF pages 18-22 mapping trusted", "007-3453-002 printed page 22 PDF page 40, Figure 2-9: two node boards and a Null Router"]}
