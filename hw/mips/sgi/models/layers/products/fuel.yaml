# SPDX-License-Identifier: BSD-3-Clause
# Revision G Fuel board with one processor and minimum supported memory.
layer_version: 1
layer:
  kind: product
  id: fuel
  requires: {assembly: ip34, module: fuel-base-module}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[1]]
    provenance: vendor-document
    sources: ["007-4480-001 printed pages 30 to 32: one PIMM and minimum memory configuration"]
  population:
    nodes: 1
    cpus_per_node: [1]
    provenance: vendor-document
    sources: ["007-4480-001 printed pages 30 to 32 and 60: 500 MHz R14000A option, two 256 MiB DIMMs in matched pair 1"]
  cpu_selection:
    default: {clock_mhz: 500, cache_mib: 2}
    slots: [cpu0]
  memory_kits_per_node: [fuel-512-test-map]
  data:
    machine:
      name: Fuel
      model_role: emulation-target
      notes: >-
        This selects the observed 030-1707-003 revision G board's 500 MHz
        R14000 and 11c1:5802 USB variant with the guide's supported 512 MiB
        minimum. The public revision G machine has 1536 MiB, so this exact
        memory population is inferred from the guide, not observed on that
        specimen.
        The 256/256 MiB bank positions 0 and 1 are a test hypothesis from
        one revision F software inventory, not established Bedrock wiring.
        A register test must inspect bank presence and the 512 MiB boundary;
        a stock Fuel PROM run must report 512 MiB and boot without a memory
        error. A revision-matched wiring record or register capture would
        settle the physical mapping. Widget 14's Intel 82550 in the public
        OpenBSD capture is an add-in card and is absent here. Widget 13's
        VPro is also absent from this initial serial configuration. The
        selected revision G has a documented Lucent OHCI identity at PCI
        device 5. Its widget 15 placement is inferred from another Fuel
        capture with an unidentified board revision. Other Fuel revisions
        may use a different controller.
        This target can be selected for a QEMU catalogue export.
        An installed IRIX 6.5.30 guest reached IOC3-A serial login with
        explicit board inputs and synthetic node records.
        Physical board wiring and factory identity remain unverified.
      emulation:
        bedrock_nodes:
          bedrock:
            board_id_input: {option: fuel-board-id-word, required: true}
            board_id_mask: 61440
            board_id_required_bits: 16384
            revision_input: {option: fuel-bedrock-revision, required: true}
            local_region: 0
            initiator_region: 0
            installed_bank_mask: {mode: fitted-banks}
            provenance: derived
            sources: [hw/mips/sgi/sn1-node.c, hw/mips/sgi/sn-machine.c]
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
        l1_controllers:
          l1:
            reported_type_input: {option: fuel-l1-type-code, required: true}
            revision_input: {option: fuel-l1-revision, required: false}
            mac_eeprom_input: {option: fuel-mac-eeprom, required: false}
            provenance: derived
            sources: [hw/mips/sgi/sn1-node.c, hw/mips/sgi/sn-machine.c]
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
        io_boards:
          ip34-system-board:
            ioc3_subsystem_input: {option: fuel-ioc3-subsystem-id, required: true}
            mac_source: module-l1
            provenance: derived
            sources: [hw/mips/sgi/baseio.c]
            notes: Preserves existing subsystem and supplied MAC policy. The unavailable physical subsystem field remains explicit.
        pci_function_revisions:
          scsi:
            revision: 6
            provenance: derived
            sources: [hw/scsi/qlogic-isp.c]
            notes: Preserves the implemented ISP12160 class revision. The Fuel silicon revision is unverified.
          ioc3:
            revision: 1
            provenance: derived
            sources: [include/hw/misc/sgi-ioc3.h]
            notes: Preserves the implemented IOC3 class revision. The Fuel silicon revision is unverified.
        system_timekeepers:
          ip34-system-board:
            kind: m48t35-compatible
            year_base: 1968
            initial_ip27_fixture: false
            provenance: derived
            sources: [docs/datasheets/ip34-system-timekeeper.md]
            notes: Flat independent 32 KiB storage is a compatibility assumption. Physical part, capacity, decode and wiring are unknown.
        machine_name: fuel
        display_description: SGI Fuel (IP34)
        profile: base
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib: [512]
        firmware_payload:
          argument: -bios
          path: firmware/6.5.30/ip35prom.payload.bin
          size: "0x1686a8"
          sha256: 554924380189a03a512156af2faa38344902f251b49fd5c80c253c23ecaff27b
          read_only: true
          views:
            - {name: CPU reset view, address: "0x000_001fc00000", payload_offset: "0x0", size: "0x1686a8"}
            - {name: local Hub-special boot view, address: "0x100_18000000", payload_offset: "0x0", size: "0x1686a8"}
            - {name: bounded high local Hub-special boot view, address: "0x100_1fc00000", payload_offset: "0x0", size: "0x1686a8"}
            - {name: node-zero remote Hub-special boot view, address: "0x100_38000000", payload_offset: "0x0", size: "0x1686a8"}
          second_selection: {address: "0x100_1a000000", size: "0x0080_0000"}
          provenance: derived
          sources: ["docs/machines/layers/products/origin300.yaml: existing bounded IP35 PROM compatibility carrier", "docs/decisions/D-0024-origin300-stock-prom-reset-carrier.md"]
          notes: >-
            This boot spike reuses the Origin 300 emulator's bounded views of
            the operator-supplied IP35 PROM payload. The physical Fuel reset
            decoder, flash part and selection priority are unknown. A stock
            Fuel PROM fetch trace and independent board evidence must test
            these addresses before this can become a hardware claim.
        synthetic_identities:
          - {component: bedrock, serial: "0x0d0c0b0a0909", reason: Stable synthetic Fuel node identity for this spike; not a recovered board serial.}
          - {component: xbridge, serial: "0x0b0a090808", reason: Stable synthetic Fuel XBridge identity for this spike; not a recovered board serial.}
          - {component: ioc3, serial: "0x5e7000000003", reason: Stable synthetic Fuel IOC3 identity for this spike; not a recovered board serial.}
        initially_operational_crossbow_links:
          - component: xbridge-crossbar
            widgets: [14, 15]
            reason: Both PCI bridge heads are present on the selected XBridge; startup health is emulator policy pending a Fuel reset test.
      harness:
        # Preserve the existing diagnostic launch recipe.
        smdk:
          package_path: assets/boot/smdk-fuel-6526
          tftp_mode: requested
          diagnostic_mac_bootarg: true
          requires_boot_flash: true
          requires_network_identity: true
          discovery_prerequisites: [io8bt, xbg, launcher]
        console: ioc3-serial-a
        prom_dialogue: ip35-l1-prompt
        default_cpu_model: R14000
        disk_bus: scsi.0
        netboot_adapter: ioc3-ethernet
        default_topology: one-chassis
        requires_per_node_flash: false
        has_managed_boot_flash: false
        timekeeper_nvram: true
        identity_inputs: [chassis-eeprom, board-eeprom]
        identity_record_slots: [node-board]
        supported_guests: []
        install_media: []
        provenance: derived
        sources: ["boot-logs/tingo-sgi-fuel-irix-console.html raw HTML lines 139 to 146: IP34 node board inventory", "boot-logs/tingo-sgi-fuel-irix-console.html raw HTML lines 426 to 525: serial login after console=d", "007-4480-001 printed pages 6 and 28: separate serial and L1 diagnostic connections"]
