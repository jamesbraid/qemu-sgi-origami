# SPDX-License-Identifier: BSD-3-Clause
# Explicit software-only Tezro deskside serial trial.
layer_version: 1
sources:
  tezro-deskside-trial: "qemu:docs/specs/sgi-ip53.rst#sgi-ip53-serial-profiles  selected 700 MHz and 4 MiB Tezro runtime inputs"
  tezro-deskside-trial-review: "qemu:docs/specs/sgi-ip53.rst#sgi-ip53-serial-profiles  selected Tezro runtime inputs and unmeasured hardware limits"
  tezro-l1-version-compatibility: "web:ip35-patch-sg0007149 SG0007149 README identifies IP35 support; decoded L1 member has image identifier 1.48.1"
layer:
  kind: product
  id: tezro-deskside-700mhz-4mib-serial-trial
  requires: {assembly: ip53-tezro}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[4]]
    provenance: derived
    sources: [tezro-deskside-trial, tezro-deskside-trial-review]
  population:
    nodes: 1
    cpus_per_node: [4]
    provenance: derived
    sources: [tezro-deskside-trial, tezro-deskside-trial-review]
  memory_kits_per_node: [kit-4096-at-banks-0-5-tezro-deskside]
  cpu_selection:
    default: {clock_mhz: 700, cache_mib: 4}
    slots: [cpu0, cpu1, cpu2, cpu3]
  data:
    machine:
      name: Tezro deskside serial compatibility trial
      model_role: emulation-target
      notes: >-
        Explicit software-only trial for the named Tezro deskside profile.
        The CPU model, reset mode, cache size, logical bank placement, Bedrock
        board word, L1 type, PIC policy, PCI addresses, endpoint revisions,
        interrupt routes and IOC4 clock are compatibility inputs. They do not
        establish those values or behaviors on physical Tezro systems. The
        trial has no graphics devices and must be selected explicitly.
      firmware_config:
        processor_reset_mode: 0x009bad85
        machine_type: 0x00000001
        flash_read_cycles: 16
        flash_write_cycles: 16
        provenance: derived
        sources: [tezro-deskside-trial, tezro-deskside-trial-review]
      emulation:
        machine_name: tezro
        display_description: SGI Tezro deskside, serial compatibility trial
        profile: tezro-deskside-700mhz-4mib-serial-trial
        synthetic_identities:
          - component: bedrock
            serial: "0x51454d554e00"
            reason: Emulator-assigned identity for the software-only trial.
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib: [4096]
        pic_profiles:
          pic-xio-b: pic-rev3-bedrock-experimental
          pic-xio-f: pic-rev3-bedrock-experimental
        bedrock_nodes:
          bedrock:
            board_id_word: 8193
            local_region: 0
            initiator_region: 0
            installed_bank_mask: {mode: fitted-banks}
            provenance: derived
            sources: [tezro-deskside-trial, tezro-deskside-trial-review]
            notes: >-
              Board word 0x2001 is a software input selected for this
              trial. It is not established as the physical Tezro board value.
        l1_controllers:
          l1:
            reported_type: 57
            revision: {major: 1, minor: 48, patch: 1}
            provenance: derived
            sources: ["web:lore-kaloz-ip35-35 brick type '9' is Tezro deskside", tezro-l1-version-compatibility]
            notes: >-
              The Linux mapping supports the reported brick type. The public
              SG0007149 IP35 update contains an L1 image identified as 1.48.1;
              selecting it supports software compatibility and does not
              establish Tezro fitment or a factory revision.
        firmware_payload:
          argument: -bios
          path: firmware/6.5.30/ip35prom.payload.bin
          size: "0x1686a8"
          sha256: 554924380189a03a512156af2faa38344902f251b49fd5c80c253c23ecaff27b
          read_only: true
          views:
            - {name: processor reset execution view, address: "0x1fc00000", payload_offset: "0x0", size: "0x1686a8"}
            - {name: bounded high LBOOT execution alias, address: "0x100_1fc0_0000", payload_offset: "0x0", size: "0x1686a8"}
          second_selection:
            address: "0x100_1a000000"
            size: "0x0080_0000"
          provenance: derived
          sources: [tezro-deskside-trial]
          notes: >-
            The launch recipe applies the Tezro row-17 seed to this selected base payload.
            The payload and seed are software inputs; their hashes do not
            establish installed Tezro firmware or flash wiring.
      harness:
        console: l1-uart
        console_records:
          - {kind: console, node_id: bedrock, argument: "-serial chardev:l1", launcher_name: l1}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_0", launcher_name: ioc4-serial-0}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_1", launcher_name: ioc4-serial-1}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_2", launcher_name: ioc4-serial-2}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_3", launcher_name: ioc4-serial-3}
        launch_recipe: ip53-discovery
        prom_dialogue: none
        default_cpu_model: R16000
        disk_bus: scsi.0
        netboot_adapter: unsupported
        smdk:
          package_path: assets/boot/smdk
          tftp_mode: fixed
          diagnostic_mac_bootarg: false
          requires_boot_flash: false
          requires_network_identity: false
          discovery_prerequisites: []
        default_topology: tezro-deskside-700mhz-4mib-serial-trial
        requires_per_node_flash: false
        has_managed_boot_flash: true
        operator_firmware: true
        firmware_bytes: 1476264
        identity_inputs: []
        supported_guests: []
        install_media: []
        provenance: derived
        sources: [tezro-deskside-trial, tezro-deskside-trial-review]
    evidence_policy: strict
    components:
      - {id: chassis, name: Tezro deskside, kind: chassis, provenance: vendor-document, sources: [tezro-deskside-trial]}
      - {id: ip53-board, name: IP53 four-processor board, kind: board, hardware_kind: ip53, parent: chassis, identity: {part: "030-1868-001-C"}, provenance: vendor-document, sources: [tezro-deskside-trial]}
      - {id: bedrock, name: Bedrock, kind: node-asic, hardware_kind: bedrock, datasheet_contracts: [qemu:docs/specs/sgi-bedrock.rst#sgi-bedrock-pi, qemu:docs/specs/sgi-bedrock.rst#sgi-bedrock-lb, qemu:docs/specs/sgi-bedrock.rst#sgi-bedrock-ni, qemu:docs/specs/sgi-bedrock.rst#sgi-bedrock-io, qemu:docs/specs/sgi-bedrock.rst#sgi-bedrock-md, qemu:docs/specs/sgi-bedrock.rst#sgi-bedrock-xb], parent: ip53-board, node_asic: {processor_interfaces: 2, cpus_per_interface: 2}, identity: {ni_revision: 2, widget_revision: 2, clock_mhz: 200}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: cpu0, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350, r16000_reset_mode: 0x009bad85, r16000_scache_bytes: 4194304, required_properties: [r16000-experimental, r16000-reset-mode, r16000-scache-bytes]}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: cpu1, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350, r16000_reset_mode: 0x009bad85, r16000_scache_bytes: 4194304, required_properties: [r16000-experimental, r16000-reset-mode, r16000-scache-bytes]}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: cpu2, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350, r16000_reset_mode: 0x009bad85, r16000_scache_bytes: 4194304, required_properties: [r16000-experimental, r16000-reset-mode, r16000-scache-bytes]}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: cpu3, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350, r16000_reset_mode: 0x009bad85, r16000_scache_bytes: 4194304, required_properties: [r16000-experimental, r16000-reset-mode, r16000-scache-bytes]}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: memory, name: node memory, kind: memory, parent: bedrock, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: l1, name: L1 system controller, kind: system-controller, hardware_kind: l1, datasheet_contracts: [qemu:docs/specs/sgi-l1.rst], system_controller: {kind: l1}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: pic-board-b, name: PIC board at widget 11, kind: board, parent: chassis, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: pic-board-f, name: PIC board at widget 15, kind: board, parent: chassis, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: pic-xio-b, name: PIC at widget 11, kind: pci-host-bridge, hardware_kind: pic, datasheet_contracts: [qemu:docs/specs/sgi-ip53.rst#sgi-ip53-pic], parent: pic-board-b, pci_host_bridge: {heads: 2}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: pic-xio-f, name: PIC at widget 15, kind: pci-host-bridge, hardware_kind: pic, datasheet_contracts: [qemu:docs/specs/sgi-ip53.rst#sgi-ip53-pic], parent: pic-board-f, pci_host_bridge: {heads: 2}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: io9, name: IO9 card, kind: board, hardware_kind: io9, parent: chassis, identity: {part: "030-1771-005-A"}, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: ioc4, name: IOC4, kind: io-controller, hardware_kind: ioc4, datasheet_contracts: [qemu:docs/specs/sgi-ip53.rst#sgi-ip53-ioc4], parent: io9, identity: {pci_revision: 83}, ioc4: {clock_hz: 66666667, serial_dma_experimental: true}, provenance: derived, sources: [tezro-deskside-trial, tezro-deskside-trial-review]}
      - id: ds1742
        name: DS1742-compatible clock resource
        kind: rtc
        hardware_kind: ds1742
        datasheet_contracts: [qemu:docs/specs/sgi-ip53.rst#sgi-ip53-ds1742]
        parent: io9
        ds1742_fresh_year_base: 1968
        provenance: derived
        sources: [tezro-deskside-trial, tezro-deskside-trial-review]
        notes: >-
          Software-selected persistent clock resource for this trial. IO9
          fitted-part identity, byte address decode, and physical IOC4 clock
          wiring are not established for Tezro.
      - {id: isp12160, name: QLogic ISP12160, kind: subfunction, hardware_kind: isp12160, parent: io9, identity: {pci_revision: 6}, provenance: derived, sources: [tezro-deskside-trial, tezro-deskside-trial-review]}
      - {id: bcm5701, name: Broadcom BCM5701, kind: subfunction, hardware_kind: bcm5701, parent: io9, identity: {pci_revision: 0}, provenance: derived, sources: [tezro-deskside-trial, tezro-deskside-trial-review]}
    buses:
      - {id: sysad0, name: SysAD, kind: sysad, master: cpu0, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: xio, name: XIO, kind: xio, master: bedrock, provenance: derived, sources: [tezro-deskside-trial]}
      - {id: io9-pci, name: IO9 PCI bus, kind: pci, master: pic-xio-f, provenance: derived, sources: [tezro-deskside-trial]}
    connections:
      - {component: bedrock, bus: sysad0, role: endpoint, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: cpu1, bus: sysad0, role: master, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: cpu2, bus: sysad0, role: master, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: cpu3, bus: sysad0, role: master, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: bedrock, bus: xio, role: master, widget: 10, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: pic-xio-b, bus: xio, role: bridge-upstream, widget: 11, controlled_by: bedrock, xio: {physical_attachment: direct-link, enumerated_widget: 11, discovery_widget: 11, decoded_widgets: [11], identity_aliases: [{widget: 11, roles: [enumerated, discovery, decoded, legacy]}]}, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: pic-xio-f, bus: xio, role: bridge-upstream, widget: 15, controlled_by: bedrock, xio: {physical_attachment: direct-link, enumerated_widget: 15, discovery_widget: 15, decoded_widgets: [15], identity_aliases: [{widget: 15, roles: [enumerated, discovery, decoded, legacy]}]}, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: pic-xio-f, bus: io9-pci, role: bridge-downstream, pci_head: 0, provenance: derived, sources: [tezro-deskside-trial]}
      - {component: ioc4, bus: io9-pci, role: endpoint, pci_device: 1, pci_function: 0, intx_pin: inta, pic_input: 0, provenance: derived, sources: [tezro-deskside-trial, tezro-deskside-trial-review]}
      - {component: isp12160, bus: io9-pci, role: endpoint, pci_device: 3, pci_function: 0, intx_pin: inta, pic_input: 2, provenance: derived, sources: [tezro-deskside-trial, tezro-deskside-trial-review]}
      - {component: bcm5701, bus: io9-pci, role: endpoint, pci_device: 4, pci_function: 0, intx_pin: inta, pic_input: 3, provenance: derived, sources: [tezro-deskside-trial, tezro-deskside-trial-review]}
    links:
      - {kind: ioc4-clock, source: ds1742, target: ioc4}
