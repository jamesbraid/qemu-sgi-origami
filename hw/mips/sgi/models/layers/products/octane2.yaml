# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: product
  id: octane2
  requires:
    assembly: ip30
    module: octane2-module
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations:
    - - 1
    provenance: derived
    sources:
    - docs/datasheets/ip30-octane2-machine.md
  population:
    nodes: 1
    cpus_per_node:
    - 1
    provenance: derived
    sources:
    - docs/datasheets/ip30-octane2-machine.md
  cpu_selection:
    default:
      clock_mhz: 360
      cache_mib: 2
    slots:
    - cpu0
  memory_kits_per_node:
  - kit-256
  data:
    machine:
      name: Octane2 serial profile
      model_role: emulation-target
      emulation:
        machine_name: octane2
        display_description: SGI Octane2 (IP30)
        lifecycle: implemented
        profile: serial
        # The fitted part, its select and the strap are unknown (Origami
        # docs/datasheets/ip30-flash.md). Select 0 with the strap low is
        # the compatibility default every launch has used.
        boot_flash_wiring:
          select: false
          strap: false
          provenance: unsourced
          sources:
          - docs/datasheets/ip30-flash.md
          notes: Unknown wiring; the compatibility default, not a measured board.
        emulator_constraints:
          accepted_bank_sizes_mib:
          - 64
          - 128
          - 256
          accepted_bank_layouts_mib:
          - - 256
            - 0
            - 0
            - 0
          - - 128
            - 128
            - 0
            - 0
          - - 64
            - 64
            - 64
            - 64
        synthetic_identities:
        - component: bridge
          serial: '0x7a3002000002'
          reason: Reviewed virtual system-board identity.
        - component: ioc3
          serial: '0x5e7000000001'
          reason: Existing virtual IOC3 identity; not a physical serial.
      harness:
        console: ioc3-serial-a
        prom_dialogue: none
        default_cpu_model: R12000
        disk_bus: scsi
        netboot_adapter: none
        default_topology: octane2
        # The candidate part's 1 MiB array (Origami docs/designs/
        # ip30-flash-configuration.md), which the reviewed CFI01 boot flash
        # ("hw/mips/sgi: use CFI01 for Octane boot flash") implements and
        # octane.c sizes from this catalogue entry. The fitted physical
        # part is still unknown.
        firmware_bytes: 1048576
        identity_inputs: []
        supported_guests:
        - irix
        install_media: []
        provenance: derived
        sources:
        - hw/mips/sgi/octane.c
        - docs/datasheets/ip30-octane2-machine.md
