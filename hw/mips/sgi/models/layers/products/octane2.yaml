# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: product
  id: octane2
  requires:
    assembly: ip30
    module: octane2-module
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations:
    - - 1
    provenance: derived
    sources:
    - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-topology
  population:
    nodes: 1
    cpus_per_node:
    - 1
    provenance: derived
    sources:
    - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-topology
  cpu_selection:
    default:
      clock_mhz: 360
      cache_mib: 2
    slots:
    - cpu0
  memory_kits_per_node:
  - kit-256
  # The slots a graphics pipe can take, what each offers and the pipe
  # the machine fits by default; products and values are
  # hw/mips/sgi/models/graphics-products.yaml's (docs/system/mips/sgi/sn.rst,
  # Graphics pipes).
  graphics:
    max_pipes: 1
    headless: true
    slots:
      - name: widget-11
        description: "Crossbow port 11, the default graphics port"
        placement: {slot: widget-11}
        default:
          family: odyssey
          product: v12
        families:
          - family: mgras
            products:
              - {product: si, fidelity: implemented, pairing: inferred}
              - {product: si-t, fidelity: implemented, pairing: inferred}
              - {product: ssi, fidelity: approximated, limitations: ["no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
              - {product: mxi, fidelity: approximated, limitations: ["no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
              - {product: esi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1"], pairing: inferred}
              - {product: esi-t, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1"], pairing: inferred}
              - {product: essi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1", "no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
              - {product: emxi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1", "no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
          - family: odyssey
            products:
              - {product: v12, fidelity: implemented, pairing: established, assembly: "030-1611-001"}
      - names: [widget-9, widget-10, widget-12]
        description: "Crossbow port {number}, an XIO graphics slot"
        placement: {slot: "{name}"}
        families:
          - family: mgras
            products:
              - {product: si, fidelity: implemented, pairing: inferred}
              - {product: si-t, fidelity: implemented, pairing: inferred}
              - {product: ssi, fidelity: approximated, limitations: ["no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
              - {product: mxi, fidelity: approximated, limitations: ["no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
              - {product: esi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1"], pairing: inferred}
              - {product: esi-t, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1"], pairing: inferred}
              - {product: essi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1", "no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
              - {product: emxi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1", "no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
  data:
    machine:
      name: Octane2 serial profile
      model_role: emulation-target
      emulation:
        machine_name: octane2
        display_description: SGI Octane2 (IP30)
        lifecycle: implemented
        profile: serial
        # The fitted part, its select and the strap are unknown (docs/system/mips/sgi/ip30.rst,
        # Boot flash wiring). Select 0 with the strap low is
        # the compatibility default every launch has used.
        boot_flash_wiring:
          select: false
          strap: false
          provenance: unsourced
          sources:
          - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-flash-wiring
          notes: Unknown wiring; the compatibility default, not a measured board.
        system_timekeepers:
          ip30-board:
            kind: ds1685
            initial_ip27_fixture: false
            provenance: derived
            sources:
            - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-timekeeper
            - hw/mips/sgi/octane.c
            notes: The board's IOC3 drives a DS1685-family clock, whose 512-byte NVRAM and the model's 24-byte clock record a new machine starts zeroed; the part treats an all-zero image as fresh.
        emulator_constraints:
          # The Octane2 guide (007-4207-002, printed page 47): 64 MiB to 2 GiB a
          # bank, banks filled from bank 1 without a gap, highest density first
          # (docs/system/mips/sgi/ip30.rst, Memory kits and capacity).
          accepted_bank_sizes_mib:
          - 64
          - 128
          - 256
          - 512
          - 1024
          - 2048
          bank_order: descending
        synthetic_identities:
        - component: bridge
          serial: '0x51454d554e00'
          reason: The system-board record's marked synthetic serial; the Bridge part holds that record.
        - component: ioc3
          serial: '0x5e7454d55000'
          reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
      harness:
        console: ioc3-serial-a
        prom_dialogue: none
        default_cpu_model: R12000
        disk_bus: scsi
        netboot_adapter: ioc3-ethernet
        default_topology: octane2
        # The candidate part's 1 MiB array (docs/system/mips/sgi/ip30.rst,
        # Boot flash wiring), which the reviewed CFI01 boot flash
        # ("hw/mips/sgi: use CFI01 for Octane boot flash") implements and
        # octane.c sizes from this catalogue entry. The fitted physical
        # part is still unknown.
        firmware_bytes: 1048576
        identity_inputs: []
        supported_guests:
        - irix
        install_media: [disk-image, netboot]
        provenance: derived
        sources:
        - hw/mips/sgi/octane.c
        - qemu:docs/system/mips/sgi/ip30.rst#sgi-ip30-launch
