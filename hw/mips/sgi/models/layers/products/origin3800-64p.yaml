          - {component: c08-chassis, number: 10, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 10 of rack 002."}
          - {component: c09-chassis, number: 13, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 13 of rack 002."}
          - {component: c10-chassis, number: 16, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 16 of rack 002."}
          - {component: c11-chassis, number: 21, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 21 of rack 002."}
          - {component: c12-chassis, number: 24, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 24 of rack 002."}
          - {component: c13-chassis, number: 29, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 29 of rack 002."}
          - {component: c14-chassis, number: 32, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 32 of rack 002."}
          - {component: c15-chassis, number: 35, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 35 of rack 002."}
          - {component: ibrick-brick, number: 20, reason: "The I-brick position of the shipped I/O rack layouts, units 20 to 23, in rack 101 (rack name inferred). Which C-brick it cables to is a model choice."}
          - {component: rbrick0-brick, number: 19, reason: "The cabling draft's 64-processor table, Table 2-14: this R-brick at unit 19 of rack 001."}
          - {component: rbrick1-brick, number: 27, reason: "The cabling draft's 64-processor table, Table 2-14: this R-brick at unit 27 of rack 001."}
