  data:
    machine:
      name: Origin 350
      model_role: reference
      notes: >-
        One Origin 350 compute module (IP53): the posted PROM inventory reports
        Bedrock ASIC revision 2 and separately reports ASIC XBOW revision 3.
        Bedrock's crossbar-facing XIO widget on this board is unverified. The PIC at
        widget 0xF has two heads that share that one widget number. The second
        head's registers start at offset +0x800000. IO9 is on the PIC's first
        head, PCI devices 1 (IOC4), 3 (QLogic ISP12160) and 4
        (BCM5701), the PROM's device numbers running one
        higher than the PIC's internal slots 0-3. No processors-catalogue entry
        for R16000 exists in the shared SN1 architecture layer, so this
        composition asserts no processor clock or cache identity, even though
        the closure record names 600 and 700 MHz at 4 MiB as established; adding
        that catalogue entry is left to a step that also re-baselines the
        existing origin300 goldens it would otherwise perturb. This
        configuration never compiles: Origami's QEMU consumer has no Origin 350
        machine today. Device 2 remains unspecified until an Origin 350 IO9
        revision and its PCI population are identified.
    evidence_policy: strict
