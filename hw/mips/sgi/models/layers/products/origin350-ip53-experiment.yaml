# SPDX-License-Identifier: BSD-3-Clause
# One-node Origin 350 experiment inputs. Values marked as software choices do
# not establish a fitted physical configuration or successful firmware boot.
layer_version: 1
sources:
  ip53-product-capacity: "007-4566-001 printed pages 68-75 and 114-120: IP53 two/four R16000 configurations, 2 or 4 processors, 8 DIMM slots and 512 MiB or 1 GiB DIMMs"
  ip53-runtime-review: "docs/reviews/chimera-ip53-runtime-experiment-review-20261002.md: reviewed software experiment inputs and explicit unknowns"
  ip53-flash-review: "docs/reviews/chimera-ip53-flash-experiment-review-20261002.md: configured PROM payload, two-position seed and bounded views"
  ip53-platform-driver: "openbsd-sgi revision 2df91d80c104636deeef8124252ddd5951b55fbf: sys/arch/sgi/sgi/ip27_machdep.c:166-185 and sys/arch/sgi/sgi/ip27.h:43-46"
  ip53-platform-contract: "docs/datasheets/ip53-platform-identity-experiment.md: selected input and limits"
  ip53-platform-review: "docs/reviews/ip53-platform-identity-evidence-review-20261003.md: clearance for the inferred 0x2001 software input"
  ip53-l1-contract: "docs/datasheets/ip53-l1-identity-experiment.md: selected local controller input and limits"
  ip53-l1-review: "docs/reviews/ip53-l1-product-identity-evidence-review-20261003.md: clearance for the product-specific 0x37 software input"
layer:
  kind: product
  id: origin350-ip53-experiment
  requires: {assembly: ip53-experiment}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[4]]
    provenance: derived
    sources: [ip53-product-capacity, ip53-runtime-review]
  population:
    nodes: 1
    cpus_per_node: [4]
    provenance: derived
    sources: [ip53-product-capacity, ip53-runtime-review]
  cpu_selection:
    default: {clock_mhz: 700, cache_mib: 8}
    slots: [cpu0, cpu1, cpu2, cpu3]
  memory_kits_per_node: [kit-2048-at-banks-0-1-experiment]
  data:
    machine:
      name: Origin 350 IP53 software experiment
      model_role: emulation-target
      notes: >-
        Opt-in one-node model experiment using the reviewed 700 MHz, 8 MiB
        R16000 input tuple, four CPUs, 2 GiB memory, Bedrock at 200 MHz,
        PIC revision 3 runtime profile and a launcher-configured PROM seed.
        Reset word 0x009cad85 is an updater-derived candidate, not a measured
        electrical reset value. The two-DIMM 2 GiB population and its positions
        in banks 0 and 1 are synthetic software inputs; no SPD bytes or DIMM
        part identity are supplied. The base PROM payload metadata names the
        original operator asset; the launcher applies the selected seed and
        records the configured seed hash separately. This does not establish a
        fitted flash part or stock PROM boot.
      firmware_config:
        processor_reset_mode: 0x009cad85
        machine_type: 0x00000001
        flash_read_cycles: 16
        flash_write_cycles: 16
        provenance: derived
        sources: [ip53-runtime-review, ip53-flash-review]
      emulation:
        machine_name: origin350
        display_description: SGI Origin 350 (IP53), experimental software profile
        profile: ip53-experiment
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib: [2048]
        pic_profiles:
          pic: pic-rev3-bedrock-experimental
        synthetic_identities:
          - component: bedrock
            serial: "0x51454d554e00"
            reason: >-
              Synthetic node identity N0 with the QEMU marker; no physical
              board serial is supplied.
        bedrock_nodes:
          bedrock:
            board_id_word: 8193
            local_region: 0
            initiator_region: 0
            installed_bank_mask: {mode: fitted-banks}
            provenance: derived
            sources: [ip53-platform-driver, ip53-platform-contract,
                     ip53-platform-review, "hw/mips/sgi/sn1-node.c",
                     "hw/mips/sgi/sn-machine.c"]
            notes: >-
              Selects subtype 2 under the public OpenBSD product mapping. The
              retained low twelve bits, 0x001, are an unmeasured software
              choice. This does not identify an observed IP53 reset state.
              The installed bank mask follows the synthetic bank placement
              above.
        l1_controllers:
          l1:
            reported_type: 55
            revision: {major: 1, minor: 18, patch: 5}
            provenance: derived
            sources: [ip53-l1-contract, ip53-l1-review]
            notes: >-
              Product-specific software approximation for the selected local
              controller, inferred from the 2U_INT_53 product context. This
              does not establish a physical response, reset value or the
              identity of a separately queried I/O controller.
        firmware_payload:
          argument: -bios
          path: firmware/6.5.30/ip35prom.payload.bin
          size: "0x1686a8"
          sha256: 554924380189a03a512156af2faa38344902f251b49fd5c80c253c23ecaff27b
          read_only: true
          views:
            - name: processor reset execution view
              address: "0x1fc00000"
              payload_offset: "0x0"
              size: "0x1686a8"
            - name: bounded high LBOOT execution alias
              address: "0x100_1fc0_0000"
              payload_offset: "0x0"
              size: "0x1686a8"
          second_selection:
            address: "0x100_1a000000"
            size: "0x0080_0000"
          provenance: derived
          sources: [ip53-flash-review]
          notes: >-
            This path and digest identify the raw original base payload accepted
            by the existing launcher. The launcher constructs the experiment
            seed from this payload and records that configured seed's separate
            hash. The reset and execution views are software choices, not claims
            about IP53 physical decode or fitted flash.
      harness:
        console: l1-uart
        console_records:
          - {kind: console, node_id: bedrock, argument: "-serial chardev:l1", launcher_name: l1}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_0", launcher_name: ioc4-serial-0}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_1", launcher_name: ioc4-serial-1}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_2", launcher_name: ioc4-serial-2}
          - {kind: second-port, node_id: bedrock, argument: "-serial chardev:ioc4_serial_3", launcher_name: ioc4-serial-3}
        launch_recipe: ip53-discovery
        prom_dialogue: none
        default_cpu_model: R16000
        disk_bus: scsi.0
        netboot_adapter: unsupported
        smdk:
          package_path: assets/boot/smdk
          tftp_mode: fixed
          diagnostic_mac_bootarg: false
          requires_boot_flash: false
          requires_network_identity: false
          discovery_prerequisites: []
        default_topology: origin350-ip53-experiment
        requires_per_node_flash: false
        has_managed_boot_flash: true
        operator_firmware: true
        firmware_bytes: 1476264
        identity_inputs: []
        supported_guests: []
        install_media: []
        provenance: derived
        sources: [ip53-runtime-review, ip53-flash-review]
  evidence_policy: strict
