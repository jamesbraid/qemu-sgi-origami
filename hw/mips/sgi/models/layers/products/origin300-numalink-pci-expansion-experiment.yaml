layer_version: 1
layer:
  kind: product
  id: origin300-numalink-pci-expansion-experiment
  requires:
    assembly: ip45
  topology:
    min_nodes: 2
    max_nodes: 2
    supported_cpu_populations:
    - - 2
      - 2
    - - 4
      - 2
    - - 2
      - 4
    - - 4
      - 4
    provenance: derived
    sources:
    - 'docs/datasheets/origin300-numalink-module.md: two base modules minimum; eight numbered ports; expansion
      uses ports 2-5'
    - '007-4365-002: two or four processors per Origin 300 base module'
  population:
    nodes: 2
    cpus_per_node:
    - 2
    - 2
    provenance: derived
    sources:
    - 'docs/datasheets/origin300-numalink-module.md: two base modules minimum; eight numbered ports; expansion
      uses ports 2-5'
    - '007-4365-002: two or four processors per Origin 300 base module'
  cpu_selection:
    default:
      clock_mhz: 500
      cache_mib: 2
    slots:
    - cpu0
    - cpu2
    - cpu1
    - cpu3
  memory_kits_per_node:
  - kit-512-at-banks-2-3
  - kit-512-at-banks-2-3
  data:
    machine:
      name: Origin 300 routed NUMAlink and PCI expansion experiment
      model_role: emulation-target
      notes: Two Origin 300 compute modules reach a PCI expansion module through an inferred eight-port
        SN1 router. This selects explicit numbered cables and the reviewed router revision inference.
        Router cold-zero storage and L1 identity type 0x52 are approximations. The router L1 refuses
        compute lifecycle commands. USB/L2 transport, router main power and inter-module reset propagation
        remain unsupported. Routes and node inventory are
        not initialized for firmware. Construction support does not establish stock PROM or IRIX acceptance.
      emulation:
        bedrock_nodes:
          master-bedrock:
            board_id_word: 32769
            local_region: 0
            initiator_region: 0
            installed_bank_mask:
              mode: fixed
              value: 12
            provenance: derived
            sources:
            - hw/mips/sgi/sn1-node.c
            - hw/mips/sgi/sn-machine.c
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
          slave-bedrock:
            board_id_word: 32769
            local_region: 0
            initiator_region: 0
            installed_bank_mask:
              mode: fixed
              value: 12
            provenance: derived
            sources:
            - hw/mips/sgi/sn1-node.c
            - hw/mips/sgi/sn-machine.c
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
        l1_controllers:
          master-l1:
            reported_type: 52
            revision:
              major: 1
              minor: 18
              patch: 5
            provenance: derived
            sources:
            - hw/mips/sgi/sn1-node.c
            - hw/mips/sgi/sn-machine.c
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
          slave-l1:
            reported_type: 52
            revision:
              major: 1
              minor: 18
              patch: 5
            provenance: derived
            sources:
            - hw/mips/sgi/sn1-node.c
            - hw/mips/sgi/sn-machine.c
            notes: Preserves existing emulator initialization. This policy adds no physical hardware claim.
        io_boards:
          master-xbridge-bridge-f:
            ioc3_subsystem_id: 65535
            mac_source: none
            provenance: derived
            sources:
            - hw/mips/sgi/baseio.c
            notes: Preserves existing subsystem and supplied MAC policy. The unavailable physical subsystem
              field remains explicit.
          slave-xbridge-bridge-f:
            ioc3_subsystem_id: 65535
            mac_source: none
            provenance: derived
            sources:
            - hw/mips/sgi/baseio.c
            notes: Preserves existing subsystem and supplied MAC policy. The unavailable physical subsystem
              field remains explicit.
        system_timekeepers:
          master-xbridge-bridge-f:
            kind: m48t35-compatible
            year_base: 1968
            initial_ip27_fixture: false
            provenance: derived
            sources:
            - openbsd:2df91d80c104636deeef8124252ddd5951b55fbf sys/arch/sgi/dev/dsrtc.c lines 169 to 174
            - docs/reviews/fuel-rtc-refinement-review-20261001.md
            notes: IP35 software uses the 1968 year convention. Blank initial storage is emulator policy.
              Existing compatibility part, capacity and mapping assumptions are unchanged.
          slave-xbridge-bridge-f:
            kind: m48t35-compatible
            year_base: 1968
            initial_ip27_fixture: false
            provenance: derived
            sources:
            - openbsd:2df91d80c104636deeef8124252ddd5951b55fbf sys/arch/sgi/dev/dsrtc.c lines 169 to 174
            - docs/reviews/fuel-rtc-refinement-review-20261001.md
            notes: IP35 software uses the 1968 year convention. Blank initial storage is emulator policy.
              Existing compatibility part, capacity and mapping assumptions are unchanged.
        machine_name: origin300
        display_description: SGI Origin 300 (IP45), routed NUMAlink and PCI expansion experiment
        profile: numalink-pci-expansion-experiment
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib:
          - 512
        firmware_payload:
          argument: -bios
          path: firmware/6.5.30/ip35prom.payload.bin
          size: '0x1686a8'
          sha256: 554924380189a03a512156af2faa38344902f251b49fd5c80c253c23ecaff27b
          read_only: true
          views:
          - name: CPU reset view
            address: '0x000_001fc00000'
            payload_offset: '0x0'
            size: '0x1686a8'
          - name: local Hub-special boot view
            address: '0x100_18000000'
            payload_offset: '0x0'
            size: '0x1686a8'
          - name: bounded high local Hub-special boot view
            address: '0x100_1fc00000'
            payload_offset: '0x0'
            size: '0x1686a8'
          - name: node-zero remote Hub-special boot view
            address: '0x100_38000000'
            payload_offset: '0x0'
            size: '0x1686a8'
          second_selection:
            address: '0x100_1a000000'
            size: '0x0080_0000'
          provenance: derived
          sources:
          - 'docs/library/ip35-source-map.md: measured container, payload, load address, entry address
            and ten trampolines'
          - 'docs/library/origin300-evidence-matrix.md: real IP35 PROM copy from local LBOOT for the exact
            payload length'
          - 'docs/library/origin300-reset-alias-evidence.md: stock firmware preserves the high local LBOOT
            address and offset'
          - 'D-0024: bounded emulator carrier with the physical decoder left unresolved'
          notes: 'The one-chassis product''s payload and views, carried by each chassis''s own node: both
            servers run the same stock IP35 PROM, and each node''s flash answers at its own node''s window.
            Emulator compatibility policy, as on one chassis; no fitted flash part or physical reset decoder
            is claimed.'
        initial_module_numbers:
        - component: master-module
          number: 1
          reason: Synthetic distinct compute controller bay for this routed experiment.
        - component: slave-module
          number: 2
          reason: Synthetic distinct compute controller bay for this routed experiment.
        - component: router-enclosure
          number: 20
          reason: Synthetic router controller bay; distinct from the compute and expansion controllers.
        - component: expansion-enclosure
          number: 3
          reason: Synthetic expansion controller bay for the existing functional startup experiment.
        synthetic_identities:
        - component: master-bedrock
          serial: '0x0d0c0b0a0908'
          reason: Stable synthetic node identity; the master keeps the one-chassis Origin 300's value.
        - component: master-xbridge
          serial: '0x0b0a090807'
          reason: The master's IO-8 identity, the one-chassis Origin 300's value.
        - component: master-ioc3
          serial: '0x5e7000000002'
          reason: The master's IOC3 identity, the one-chassis Origin 300's value.
        - component: slave-bedrock
          serial: '0x0d0c0b0a0909'
          reason: Stable synthetic node identity for the slave chassis, one past the master's, as the
            dual-module Origin 200 strides its second node. The captured pairs show distinct barcodes
            per module; the values themselves are a model choice.
        - component: slave-xbridge
          serial: '0x0b0a090808'
          reason: The slave's IO-8 identity, one past the master's.
        - component: slave-ioc3
          serial: '0x5e7000000003'
          reason: The slave's IOC3 identity, one past the master's.
        - component: expansion-bedrock
          serial: '0x123456'
          reason: Preserves the existing expansion experiment synthetic BIC identity.
        - component: router-router
          serial: '0x123457'
          reason: Synthetic router descriptor identity; no physical barcode is claimed.
        - component: expansion-u0
          serial: '0x123458'
          reason: Synthetic installation identity only. No physical XBridge serial behavior is claimed.
        - component: expansion-u1
          serial: '0x123459'
          reason: Synthetic installation identity only. No physical XBridge serial behavior is claimed.
        - component: expansion-u2
          serial: '0x12345a'
          reason: Synthetic installation identity only. No physical XBridge serial behavior is claimed.
        initially_operational_crossbow_links:
        - component: master-xbridge-crossbar
          widgets:
          - 14
          - 15
          reason: Static emulator startup health for the master XBridge's two PCI bridge heads, as on
            one chassis.
        - component: slave-xbridge-crossbar
          widgets:
          - 14
          - 15
          reason: Static emulator startup health for the slave XBridge's two PCI bridge heads, as on one
            chassis.
