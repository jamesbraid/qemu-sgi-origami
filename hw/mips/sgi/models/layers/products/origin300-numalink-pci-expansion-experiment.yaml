          - 5
          - 1
          - 5
          - 2
          - 6
          - 2
          - 6
          - 1
          - 5
          - 1
          - 5
          - 2
          - 6
          - 2
          - 6
          - 1
          - 5
          - 1
          - 5
          - 2
          - 6
          - 2
          - 6
          - 1
          - 5
          - 1
          - 5
          - 2
          - 6
          - 2
          - 6
          - 1
          - 5
          - 1
          - 5
          - 2
          - 6
          - 2
          - 6
          - 1
          - 5
          - 1
          - 5
          - 2
          - 6
          - 2
          - 6
        l1_management:
          owners:
          - controller: master-l1
            identity: 101
          - controller: slave-l1
            identity: 102
          - controller: router-l1
            identity: 103
          - controller: expansion-l1
            identity: 104
          associations:
          - from: 0
            to: 3
            reachable: true
          - from: 3
            to: 0
            reachable: true
          attachments:
          - issuer: 0
            owner: 3
          - issuer: 3
            owner: 0
    evidence_policy: strict
    components:
    - id: rack
      name: Origin 300 experimental rack
      kind: chassis
      provenance: derived
      sources:
      - 'docs/datasheets/origin300-numalink-module.md: two base modules minimum; eight numbered ports;
        expansion uses ports 2-5'
    - id: master-module
      name: Origin 300 compute module one
      kind: module
      provenance: vendor-document
      sources:
      - '007-4365-002 printed page 38: designate one server master and one slave; console on the master'
      - 'boot-logs/openbsd-sgi-list/marc-139223952727384-origin-300-numalink-1.html lines 17 to 62: IP35
        Node Board, Module 001c01 and Module 001c02'
      parent: rack
    - id: slave-module
      name: Origin 300 compute module two
      kind: module
      provenance: vendor-document
      sources:
      - '007-4365-002 printed page 38: brick slot 02 on the slave''s L1 before connecting the servers'
      - 'boot-logs/nekonomicon-thread-17314-origin300-8cpu-hinv-prom.html: IRIX hinv of a cabled pair,
        modules 001c01 and 001c02 each with a node, four processors and IO-8 at xtalk 14 and 15; the 001c02
        L1''s cfg v lists 001c01 as the attached C'
      parent: rack
    - id: router-enclosure
      name: Experimental Origin 300 NUMAlink module
      kind: module
      provenance: derived
      sources:
      - 'docs/datasheets/origin300-numalink-module.md: two base modules minimum; eight numbered ports;
        expansion uses ports 2-5'
      notes: One logical SN1 router and independent L1 are selected for the experiment. The physical internal
        USB hub and rack L2 transport are unsupported.
      parent: rack
    - id: router-router
      name: Eight-port SN1 router
      kind: router-asic
      hardware_kind: router
      parent: router-enclosure
      router_asic:
        port_count: 8
        role: router
      identity:
        part: '0x3017'
        hardware_revision: 1
        chip_inputs: 0
      datasheet_contracts:
      - docs/datasheets/sn1-router.md
      provenance: derived
      sources:
      - 'docs/datasheets/sn1-router.md: public chip identity and reviewed revision-one inference'
      notes: Chip revision one is an inference from the software-reported revision, not a measurement
        of fitted silicon. Zero chip inputs are an emulator configuration policy.
    - id: router-l1
      name: Independent router L1 controller
      kind: system-controller
      hardware_kind: l1
      parent: router-enclosure
      system_controller:
        kind: l1
      provenance: derived
      sources:
      - 'docs/datasheets/sn1-router.md: reviewed generic L1 type 0x52 approximation'
      notes: Explicit noncompute router controller profile through its own UART, with no firmware revision selected.
      datasheet_contracts:
      - docs/datasheets/sn1-router.md
