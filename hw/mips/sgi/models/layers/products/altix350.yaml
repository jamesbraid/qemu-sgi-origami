# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: product
  id: altix350
  requires: {assembly: ip57, module: altix350-module}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[1], [2]]
    provenance: derived
    sources: ["qemu:docs/system/ia64/altix350.rst#altix350"]
  population:
    nodes: 1
    cpus_per_node: [2]
    provenance: derived
    sources: ["qemu:docs/system/ia64/altix350.rst#altix350"]
  cpu_selection:
    default: {clock_mhz: 1600, cache_mib: 3}
    slots: [cpu0, cpu1]
  memory_kits_per_node: [selected-2g]
  data:
    machine:
      name: Altix 350
      model_role: emulation-target
      emulation:
        machine_name: altix350
        display_description: SGI Altix 350 (IP57)
        lifecycle: implemented
        profile: serial
        emulator_constraints: {accepted_bank_sizes_mib: [2048]}
        firmware_payload:
          argument: -bios
          path: firmware/snprom-10.54/shub1snprom.bin
          size: '0x600000'
          sha256: 51ccf9ad830b85ee6c88d6d73d2512322a86454e63db51c57454679283a34617
          read_only: true
          views:
          - {name: reset-window, address: '0xffa00000', payload_offset: '0x0', size: '0x600000'}
          provenance: derived
          sources: ["qemu:docs/system/ia64/altix350.rst#altix350"]
          notes: The unmodified SGI SN PROM image the machine boots, from snprom 10.54 build 70399 (SAL 5.04).
      harness:
        console: l1-uart
        launch_recipe: ia64
        prom_dialogue: efi-shell
        default_cpu_model: madison-1600-3m
        netboot_adapter: none
        default_topology: altix350
        supported_guests: [linux]
        install_media: [disk-image]
