# The Onyx2 rack: the eight-processor Origin 2000 compute module with a
# BaseIO-G in IO1 and one InfiniteReality pipe in a graphics module, cabled
# from an Xtown in IO3 (docs/datasheets/onyx2.md, Rack). Firmware and IRIX
# name its slots exactly as an Origin 2000's; what makes it an Onyx2 is the
# BaseIO-G and the KONA widget behind the Xtown. IO3 is where the real rack
# capture (true-wombat) has its one pipe, Crossbow 0 widget F.
layer_version: 1
layer:
  kind: product
  id: onyx2-rack
  requires:
    assembly: ip27
  topology:
    min_nodes: 1
    max_nodes: 4
    provenance: derived
    sources: ["007-3439-002 Memory Specifications printed page 35 PDF page 49; 108-0170-001 printed page 1-4 PDF page 18", "007-3457-005 printed page 1 PDF page 25: 2 to 8 processors in a single rack"]
    supported_cpu_populations:
    - [2, 2, 2, 2]
    # The compute module's rows are the Origin 2000 rack module's
    # (layers/products/origin2000-rack.yaml): the pipe's Xtown in IO3 is
    # Crossbow 0's, which node 1 controls at every count, and one pipe
    # needs only one node board (docs/datasheets/onyx2.md, Node-board
    # populations).
    node_populations:
    - node_slots: [1]
      routers: []
      fabric_links: []
      xio_slots: {pci-expansion: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1}
      supported_cpu_populations: [[2], [1]]
      grade: inferred
      sources: ["sgi-hw/origin-onyx2-hardware-quick-reference-booklet.pdf Table 42 printed page 131 PDF page 133: one node, one pipe, N1 controls the IO6G and the Xtown in IO2-IO6", "007-3457-005 printed page 45 PDF page 69: a compute module with only one Node board needs no Router"]
      notes: >-
        The manual says a one-node compute module needs no Router, not that
        one ships without; leaving both Router slots empty is inferred.
    - node_slots: [1, 2]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2]
      xio_slots: {pci-expansion: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2], [1, 1], [2, 1]]
      grade: established
      sources: ["sgi-hw/origin-onyx2-hardware-quick-reference-booklet.pdf Table 41 printed page 130 PDF page 132: in a 2-node system N1 controls IO1-IO6 and N2 IO7-IO12", "docs/datasheets/onyx2.md Node-board populations: the true-wombat rack capture's two-node module keeps both Routers"]
    - node_slots: [1, 2, 3]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3]
      xio_slots: {pci-expansion: 3, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2, 2], [1, 1, 1], [2, 1, 1], [2, 2, 1]]
      grade: inferred
      sources: ["docs/datasheets/origin2000-module.md Node-board populations: the joint-buck capture boots PROM 6.156 on node slots 1-3 with both Routers", "sgi-hw/origin-onyx2-hardware-quick-reference-booklet.pdf Table 41 printed page 130 PDF page 132: the four-node quadrants"]
      notes: >-
        Which node controls IO8, IO10 and IO12 with node board 4 absent
        is inferred: node 2 is the only Hub on Crossbow 1.
    - node_slots: [1, 2, 3, 4]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3, r2-node4]
      xio_slots: {pci-expansion: 3, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 4, xio-slot-9: 2, xio-slot-10: 4, xio-slot-11: 2, xio-slot-12: 4}
      supported_cpu_populations: [[2, 2, 2, 2], [1, 1, 1, 1], [2, 1, 1, 1], [2, 2, 1, 1], [2, 2, 2, 1]]
      grade: established
      sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "sgi-hw/origin-onyx2-hardware-quick-reference-booklet.pdf Table 41 printed page 130 PDF page 132: the four-node quadrants", "docs/datasheets/origin2000-module.md Node-board populations: the joint-buck capture's IRIX hinv lists four Hubs and both Routers, each with active ports 4, 5 and 6"]
  population:
    nodes: 4
    cpus_per_node:
    - 2
    - 2
    - 2
    - 2
    provenance: derived
    sources: ["007-3439-002 Memory Specifications printed page 35 PDF page 49; 108-0170-001 printed page 1-4 PDF page 18"]
  cpu_selection:
    default: {clock_mhz: 180, cache_mib: 1}
    slots: [node-board-1-cpu-a, node-board-1-cpu-b, node-board-2-cpu-a, node-board-2-cpu-b,
      node-board-3-cpu-a, node-board-3-cpu-b, node-board-4-cpu-a, node-board-4-cpu-b]
  memory_kits_per_node: [kit-64, kit-64, kit-64, kit-64]
  data:
    machine:
      name: Onyx2 rack with one InfiniteReality pipe
      model_role: emulation-target
      notes: >-
        Selected installation with two processors and one 64 MiB bank per
        node. IO1 holds a BaseIO-G with its MediaIO daughtercard, and IO3
        holds the Xtown that cables to one pipe in the graphics module: a
        geometry board, one raster manager with texture memory and a display
        generator, reached through the graphics module's Ktown. The pipe's
        one-wire chain answers the geometry record, then the Ktown's. The
        other optional I/O slots and external CrayLink connectors are empty.
        This is a selected population, not a captured machine inventory. The
        full processor mode word is not the full CP0 Config register; only
        the reviewed low 25 bits transfer. Stock image configuration must
        agree and is never rewritten by descriptor generation.
      firmware_config:
        cpu_clock_hz: 180000000
        hub_clock_hz: 90000000
        processor_reset_mode:
          kseg0_cache_algorithm: cacheable-coherent-exclusive-on-write
          processor_device_number: 0
          coherent_request_target: external-agent
          processor_eliminate_requests: false
          maximum_outstanding_processor_requests: 4
          system_clock_divisor: 2
          secondary_cache_block_words: 32
          secondary_cache_error_correction: retry-access-through-corrector
          memory_endianness: big
          secondary_cache_size_kib: 1024
          secondary_cache_clock_divisor: 1.5
          secondary_cache_clock_tap: 9
          open_drain_system_interface: false
          cache_test_mode: false
        machine_type: 0
        flash_read_cycles: 8
        flash_write_cycles: 1
        provenance: derived
        sources: ["docs/datasheets/origin2000-cpu-reset-mode.md selects the documented 180 MHz R10000, 90 MHz Hub, 1 MiB cache composition matching the unchanged stock mode word.", "docs/reviews/origin2000-firmware-configuration-review-20260905.md independently cleared the stock firmware record and flash controller fields.", "docs/datasheets/hub-processor-interface.md shared RTC contract specifies 1250000 Hz."]
      emulation:
        machine_name: onyx2
        display_description: SGI Onyx2 rack, one InfiniteReality pipe cabled from IO3
        profile: onyx2-rack
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib:
          - 64
        initially_operational_crossbow_links:
        - component: crossbow-0
          widgets: [8, 9, 10, 15]
          reason: >-
            Static emulator startup health for the fitted BaseIO-G, the
            pipe's XG at widget 15 (IO3, through the Xtown), plus two Hub
            links. Machine launch and whole-machine reset reapply it; migration
            restores runtime link state instead. This does not model Crossbow
            training or establish diagnostic acceptance.
        - component: crossbow-1
          widgets: [9, 10]
          reason: >-
            Static emulator startup health for the two fitted Hub links. Machine
            launch and whole-machine reset reapply it; migration restores runtime
            link state instead. This does not model Crossbow training or establish
            diagnostic acceptance.
        board_identity_overrides:
        - component: baseio
          part: "030-0734-002"
          reason: >-
            The rack's BaseIO is a BaseIO-G: the MediaIO daughtercard fitted
            under this board (the mediaio- module instance in
            docs/machines/onyx2-rack.yaml) already selects QEMU's io6g
            preset through its keyboard-mouse subfunction. The shared
            origin2000-module.yaml layer authors the plain BaseIO part
            030-1124-002 on this board for every product that reuses it, so
            this override states the BaseIO-G base board part the real rack
            capture lists (docs/datasheets/onyx2.md, Product identity).
        hub_ni_revision_overrides:
        - component: node-board-1-hub
          ni_revision: 5
          reason: >-
            Graphics-capable SN0 nodes report Hub NI revision code 5 in every
            capture found: a two-module Origin 200 listing a KONA board
            prints ASIC HUB Rev 5 on both node boards, and an Onyx2 also
            reports code 5, with no machine reporting code 4.
            docs/datasheets/hub-network-interface.md and
            docs/provenance.md#origin-2000-graphics-module-hub-ni-revision-override-2026-09-20
            record the citation chain. The reusable node-board module's own
            code 3 (Hub 2.1) stays the baseline for every product this
            override does not name.
        - component: node-board-2-hub
          ni_revision: 5
          reason: >-
            Matches node-board-1-hub: a module's Hubs share one manufactured
            revision, not a per-node mix. See node-board-1-hub's own reason
            and docs/datasheets/hub-network-interface.md.
        - component: node-board-3-hub
          ni_revision: 5
          reason: >-
            Matches node-board-1-hub: a module's Hubs share one manufactured
            revision, not a per-node mix. See node-board-1-hub's own reason
            and docs/datasheets/hub-network-interface.md.
        - component: node-board-4-hub
          ni_revision: 5
          reason: >-
            Matches node-board-1-hub: a module's Hubs share one manufactured
            revision, not a per-node mix. See node-board-1-hub's own reason
            and docs/datasheets/hub-network-interface.md.
        initial_module_numbers:
        - component: compute-module
          number: 1
          reason: >-
            Selected initial identity for this emulated installation. This value is
            not a measured or factory-default module number.
        module_semantic_serials:
        - component: compute-module
          serial: SGIMODULE1
          reason: Stable synthetic module identity for this selected emulated installation.
        module_responder_identities:
        - component: node-board-1-hub
          serial: '0x100000000009'
          reason: Stable synthetic node-local module responder identity.
        - component: node-board-2-hub
          serial: '0x10000000000a'
          reason: Stable synthetic node-local module responder identity.
        - component: node-board-3-hub
          serial: '0x10000000000b'
          reason: Stable synthetic node-local module responder identity.
        - component: node-board-4-hub
          serial: '0x10000000000c'
          reason: Stable synthetic node-local module responder identity.
        synthetic_identities:
        - component: node-board-1-hub
          serial: '0x100000000001'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: node-board-2-hub
          serial: '0x100000000002'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: node-board-3-hub
          serial: '0x100000000003'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: node-board-4-hub
          serial: '0x100000000004'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: router-1
          serial: '0x100000000005'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: router-2
          serial: '0x100000000006'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: baseio-bridge
          serial: '0x100000000007'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: baseio-ioc3
          serial: '0x100000000008'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: io3-xg
          serial: '0x100000000009'
          reason: Stable synthetic identity for this selected physical component; not hardware
            evidence.
        - component: mediaio-ioc3
          serial: '0x10000000000d'
          reason: >-
            Stable synthetic identity for the BaseIO-G MediaIO daughtercard's
            own IOC3; not hardware evidence.
      harness:
        console: ioc3-serial-a
        prom_dialogue: ip27-menu
        default_cpu_model: R10000
        disk_bus: scsi.0
        netboot_adapter: ioc3-ethernet
        default_firmware_asset: assets/firmware/6.5.30/ip27prom.payload.bin
        default_topology: onyx2-rack
        requires_per_node_flash: true
        has_managed_boot_flash: false
        supported_guests: [irix]
        install_media: [disk-image]
        provenance: derived
        sources: ["tools/origami_lib/node_prom.py: node_prom_drives, the harness's own requirement that every launch seed one independent node flash image per node because the machine takes no -bios", "docs/machines/layers/products/origin2000-module.yaml: the same IP27 PROM dialogue, console and disk bus as the Origin 2000 module this rack is built on"]
    evidence_policy: strict
