# SPDX-License-Identifier: BSD-3-Clause
# The Onyx2 rack: the eight-processor Origin 2000 compute module with a
# BaseIO-G in IO1 and one InfiniteReality pipe in a graphics module, cabled
# from an Xtown in IO3 (docs/specs/sgi-onyx2.rst, Rack compute module). Firmware and IRIX
# name its slots exactly as an Origin 2000's; what makes it an Onyx2 is the
# BaseIO-G and the KONA widget behind the Xtown. IO3 is where the real rack
# capture web:nekonomicon-16285 has its one pipe, Crossbow 0 widget F.
layer_version: 1
layer:
  kind: product
  id: onyx2-rack
  requires:
    assembly: ip27
  topology:
    min_nodes: 1
    max_nodes: 4
    provenance: derived
    sources: ["007-3439-002 Memory Specifications printed page 35 PDF page 49; 108-0170-001 printed page 1-4 PDF page 18", "007-3457-005 printed page 1 PDF page 25: 2 to 8 processors in a single rack"]
    supported_cpu_populations:
    - [2, 2, 2, 2]
    # The compute module's rows are the Origin 2000 rack module's
    # (layers/products/origin2000-rack.yaml): the pipe's Xtown in IO3 is
    # Crossbow 0's, which node 1 controls at every count, and one pipe
    # needs only one node board (docs/specs/sgi-onyx2.rst, Node-board
    # populations).
    node_populations:
    - node_slots: [1]
      routers: []
      fabric_links: []
      xio_slots: {pci-expansion: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1}
      supported_cpu_populations: [[2], [1]]
      grade: inferred
      sources: ["web:origin-onyx2-quick-reference-booklet Table 42 printed page 131 PDF page 133: one node, one pipe, N1 controls the IO6G and the Xtown in IO2-IO6", "007-3457-005 printed page 45 PDF page 69: a compute module with only one Node board needs no Router"]
      notes: >-
        The manual says a one-node compute module needs no Router, not that
        one ships without; leaving both Router slots empty is inferred.
    - node_slots: [1, 2]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2]
      xio_slots: {pci-expansion: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2], [1, 1], [2, 1]]
      grade: established
      sources: ["web:origin-onyx2-quick-reference-booklet Table 41 printed page 130 PDF page 132: in a 2-node system N1 controls IO1-IO6 and N2 IO7-IO12", qemu:docs/specs/sgi-onyx2.rst#sgi-onyx2-populations]
    - node_slots: [1, 2, 3]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3]
      xio_slots: {pci-expansion: 3, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2, 2], [1, 1, 1], [2, 1, 1], [2, 2, 1]]
      grade: inferred
      sources: ["qemu:docs/specs/sgi-origin2000-module.rst#sgi-origin2000-module-routers", "web:origin-onyx2-quick-reference-booklet Table 41 printed page 130 PDF page 132: the four-node quadrants"]
      notes: >-
        Which node controls IO8, IO10 and IO12 with node board 4 absent
        is inferred: node 2 is the only Hub on Crossbow 1.
    - node_slots: [1, 2, 3, 4]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3, r2-node4]
      xio_slots: {pci-expansion: 3, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 4, xio-slot-9: 2, xio-slot-10: 4, xio-slot-11: 2, xio-slot-12: 4}
      supported_cpu_populations: [[2, 2, 2, 2], [1, 1, 1, 1], [2, 1, 1, 1], [2, 2, 1, 1], [2, 2, 2, 1]]
      grade: established
      sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "web:origin-onyx2-quick-reference-booklet Table 41 printed page 130 PDF page 132: the four-node quadrants", "qemu:docs/specs/sgi-origin2000-module.rst#sgi-origin2000-module-routers"]
  population:
    nodes: 4
    cpus_per_node:
    - 2
    - 2
    - 2
    - 2
    provenance: derived
    sources: ["007-3439-002 Memory Specifications printed page 35 PDF page 49; 108-0170-001 printed page 1-4 PDF page 18", "SGI Onyx2 remanufactured product guide 1073 (6/99) printed page 3 PDF page 3: every Onyx2 deskside and single-rack system lists 256MB as the smallest system RAM; the node card minimum is 256MB (1068 printed page 7), the Onyx2 using the same node board"]
  cpu_selection:
    default: {clock_mhz: 180, cache_mib: 1}
    slots: [node-board-1-cpu-a, node-board-1-cpu-b, node-board-2-cpu-a, node-board-2-cpu-b,
      node-board-3-cpu-a, node-board-3-cpu-b, node-board-4-cpu-a, node-board-4-cpu-b]
  memory_kits_per_node: [kit-256, kit-256, kit-256, kit-256]
  # The slots a graphics pipe can take, what each offers and the pipe
  # the machine fits by default; products and values are
  # hw/mips/sgi/models/graphics-products.yaml's (docs/specs/sgi-sn.rst,
  # Graphics pipes).
  graphics:
    max_pipes: 1
    headless: false
    headless_refused: "SGI sold no Onyx2 without an InfiniteReality pipe, and an Onyx2 with no pipe is an Origin 2000, so use origin2000-deskside or origin2000-rack"
    slots:
      - name: io3
        description: "Xtown in XIO slot 3, cabled to the graphics module's Ktown: the rack's InfiniteReality pipe"
        placement: {slot: io3}
        default:
          family: kona
          product: ir3
          settings: {rm-count: "1", display: dg5-2}
        families:
          - family: kona
            products:
              - product: ir2e
                fidelity: approximated
                limitations:
                  - "presents the GE16-4 geometry board, since no InfiniteReality2E capture gives the GE16 variant"
                  - "presents the TM7 as its 64 MB texture board, which is inferred"
                  - "a DG5-2 in a rack presents fancy-akita's 030-1055-001, since no capture shows a plain DG5-2 in an Onyx2 rack"
                pairing: established
                assembly: "030-1398-001"
                settings:
                  geometry: {values: [ge16-4]}
                  rm-type: {values: [rm9]}
                  rm-count: {values: ["1", "2", "4"], default: "1"}
                  texture-mb: {values: ["64"]}
                  display: {values: [dg5-2, dg5-8], default: dg5-2}
              - product: ir3
                fidelity: approximated
                limitations:
                  - "a DG5-2 in a rack presents fancy-akita's 030-1055-001, since no capture shows a plain DG5-2 in an Onyx2 rack"
                pairing: established
                assembly: "030-1398-001"
                settings:
                  geometry: {values: [ge16-4]}
                  rm-type: {values: [rm9]}
                  rm-count: {values: ["1", "2", "4"], default: "1"}
                  texture-mb: {values: ["256"]}
                  display: {values: [dg5-2, dg5-8], default: dg5-2}
        refusals:
          - family: kona
            product: ir2
            reason: "no manual or capture places a GE14 InfiniteReality2 in an Onyx2 rack"
  data:
    machine:
      name: Onyx2 rack with one InfiniteReality pipe
      model_role: emulation-target
      notes: >-
        Selected installation with two processors and 256 MiB in two
        128 MB banks per node. IO1 holds a BaseIO-G with its MediaIO daughtercard, and IO3
        holds the Xtown that cables to one pipe in the graphics module: a
        geometry board, one raster manager with texture memory and a display
        generator, reached through the graphics module's Ktown. The pipe's
        one-wire chain answers the geometry record, then the Ktown's. The
        other optional I/O slots and external CrayLink connectors are empty.
        This is a selected population, not a captured machine inventory. The
        full processor mode word is not the full CP0 Config register; only
        the reviewed low 25 bits transfer. Stock image configuration must
        agree and is never rewritten by descriptor generation.
      firmware_config:
        cpu_clock_hz: 180000000
        hub_clock_hz: 90000000
        processor_reset_mode:
          kseg0_cache_algorithm: cacheable-coherent-exclusive-on-write
          processor_device_number: 0
          coherent_request_target: external-agent
          processor_eliminate_requests: false
          maximum_outstanding_processor_requests: 4
          system_clock_divisor: 2
          secondary_cache_block_words: 32
          secondary_cache_error_correction: retry-access-through-corrector
          memory_endianness: big
          secondary_cache_size_kib: 1024
          secondary_cache_clock_divisor: 1.5
          secondary_cache_clock_tap: 9
          open_drain_system_interface: false
          cache_test_mode: false
        machine_type: 0
        flash_read_cycles: 8
        flash_write_cycles: 1
        provenance: derived
        sources: ["qemu:docs/specs/sgi-origin2000-module.rst#sgi-origin2000-reset-mode", qemu:docs/specs/sgi-hub.rst#sgi-hub-processor-interface]
      emulation:
        machine_name: onyx2
        display_description: SGI Onyx2 rack, one InfiniteReality pipe cabled from IO3
        profile: onyx2-rack
        lifecycle: implemented
        emulator_constraints:
          # Per-node totals -m may select: every sum of up to eight banks of
          # 64, 128 or 512 MiB, to the 4 GB a node board takes (SGI
          # 007-3439-002, printed page 35). 256 MB banks are left out
          # because the stock PROM disables them at 180 MHz. QEMU keeps
          # bank 0 at 128 MiB unless the total needs a 512 MiB bank 0
          # (3072, 3584 and 4096 MiB), so 256 MiB is two 128 MB banks.
          accepted_bank_sizes_mib: [64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768, 832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344, 1408, 1472, 1536, 1600, 1664, 1728, 1792, 1856, 1920, 1984, 2048, 2112, 2176, 2240, 2304, 2368, 2432, 2496, 2560, 2624, 2688, 2752, 2816, 2880, 2944, 3072, 3136, 3200, 3264, 3328, 3584, 3648, 3712, 4096]
        initially_operational_crossbow_links:
        - component: crossbow-0
          widgets: [8, 9, 10, 15]
          reason: >-
            Static emulator startup health for the fitted BaseIO-G, the
            pipe's XG at widget 15 (IO3, through the Xtown), plus two Hub
            links. Machine launch and whole-machine reset reapply it; migration
            restores runtime link state instead. This does not model Crossbow
            training or establish diagnostic acceptance.
        - component: crossbow-1
          widgets: [9, 10]
          reason: >-
            Static emulator startup health for the two fitted Hub links. Machine
            launch and whole-machine reset reapply it; migration restores runtime
            link state instead. This does not model Crossbow training or establish
            diagnostic acceptance.
        board_identity_overrides:
        - component: baseio
          part: "030-0734-002"
          reason: "The rack's BaseIO is a BaseIO-G: the MediaIO daughtercard fitted under this board (the MediaIO module instance in the Onyx2 rack composition) already selects QEMU's io6g preset through its keyboard-mouse subfunction. The shared origin2000-module.yaml layer authors the plain BaseIO part 030-1124-002 on this board for every product that reuses it, so this override states the BaseIO-G base board part the real rack capture lists."
        hub_ni_revision_overrides:
        - component: node-board-1-hub
          ni_revision: 5
          reason: "Graphics-capable SN0 nodes report Hub NI revision code 5 in every capture found: a two-module Origin 200 listing a KONA board prints ASIC HUB Rev 5 on both node boards, and an Onyx2 also reports code 5, with no machine reporting code 4. The reusable node-board module's own code 3 (Hub 2.1) stays the baseline for every product this override does not name."
        - component: node-board-2-hub
          ni_revision: 5
          reason: "Matches node-board-1-hub: a module's Hubs share one manufactured revision, not a per-node mix. See node-board-1-hub's own reason."
        - component: node-board-3-hub
          ni_revision: 5
          reason: "Matches node-board-1-hub: a module's Hubs share one manufactured revision, not a per-node mix. See node-board-1-hub's own reason."
        - component: node-board-4-hub
          ni_revision: 5
          reason: "Matches node-board-1-hub: a module's Hubs share one manufactured revision, not a per-node mix. See node-board-1-hub's own reason."
        initial_module_numbers:
        - component: compute-module
          number: 1
          reason: >-
            Selected initial identity for this emulated installation. This value is
            not a measured or factory-default module number.
        module_semantic_serials:
        - component: compute-module
          serial: KORIGAMI01
          reason: Synthetic module serial for module 1, the "KORIGAMI" marker and the module's number, beginning with K because the kernel takes no other module serial; not hardware evidence.
        module_onewire_parts:
        - component: compute-module
          identity_serial: '0x51454d555900'
          midplane_serial: '0x51454d554c00'
          midplane:
            name: 8P12_MPLN
            part: 030-0762-006
            revision: H
          reason: Synthetic ROM serials for module 1's MODULEID part, letter Y, and its 8P12_MPLN midplane part, letter L, each at the module's index 0 and carrying the "QEMU" marker. The midplane record is the four-node module's 030-0762-006 rev H, the 030- part most often seen in real inventories; the serials are not hardware evidence.
        synthetic_identities:
        - component: node-board-1-hub
          serial: '0x51454d554e00'
          reason: Synthetic node identity N0, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-2-hub
          serial: '0x51454d554e01'
          reason: Synthetic node identity N1, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-3-hub
          serial: '0x51454d554e02'
          reason: Synthetic node identity N2, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-4-hub
          serial: '0x51454d554e03'
          reason: Synthetic node identity N3, carrying the "QEMU" marker; not hardware evidence.
        - component: router-1
          serial: '0x51454d555200'
          reason: Synthetic Router identity R0, carrying the "QEMU" marker; not hardware evidence.
        - component: router-2
          serial: '0x51454d555201'
          reason: Synthetic Router identity R1, carrying the "QEMU" marker; not hardware evidence.
        - component: baseio-bridge
          serial: '0x51454d554200'
          reason: Synthetic Bridge identity B0, carrying the "QEMU" marker; not hardware evidence.
        - component: baseio-ioc3
          serial: '0x5e7454d55000'
          reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
        - component: io3-xg
          serial: '0x51454d554700'
          reason: Synthetic graphics board identity G0, carrying the "QEMU" marker; not hardware evidence.
        - component: mediaio-ioc3
          serial: '0x5e7454d55001'
          reason: Synthetic IOC3 identity 1. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
      harness:
        console: ioc3-serial-a
        prom_dialogue: ip27-menu
        default_cpu_model: R10000
        disk_bus: scsi.0
        netboot_adapter: ioc3-ethernet
        default_topology: onyx2-rack
        supported_guests: [irix]
        install_media: [disk-image, netboot]
        provenance: derived
        sources: ["query-sgi-machines: the node<N>-flash storage items, one per node board, that qemu-sgi-machine-init creates and a launch binds", "qemu:hw/mips/sgi/models/layers/products/origin2000-rack.yaml the same IP27 PROM dialogue, console and disk bus as the Origin 2000 module this rack is built on"]
    evidence_policy: strict
