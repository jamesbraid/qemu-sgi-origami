# SPDX-License-Identifier: BSD-3-Clause
# Origin 3800 of 8 compute racks (256 processors) and an I/O rack: in each
# compute rack four C-bricks on ports 2 to 5 of each of two R-bricks, the
# racks' routers joined as the cabling draft's 256-processor table has it,
# and an I-brick in rack 101 on the first C-brick's XIO (II) connector.
layer_version: 1
sources:
  007-4311-002-3800: "007-4311-002 printed pages 79 and 80 and Appendix C, printed page 93: an Origin 3800 compute rack holds up to eight C-bricks and three R-bricks, eight-port R-bricks, and only C- and R-bricks; I-bricks sit in an I/O rack"
  007-4311-002-bundles: "007-4311-002 printed pages 79 and 80: the 16- and 32-processor Origin 3800 bundles list two R-bricks and one L2 controller per compute rack"
  007-4311-002-256p: "007-4311-002 printed pages 56 to 58: the 256-processor interconnect is sixty-four C-bricks, sixteen rack routers and four MetaRouters, with 104 cables"
  108-xxxx-PR2-256p: "108-xxxx-PR2 printed page 2-79, Table 2-23 (preliminary draft, port-level agreement with the shipped drawing): eight racks of eight C-bricks on ports 2 to 5 of routers at units 19 and 27, in-rack ports 1 and 6, neighbouring racks joined by port 7, and each rack router's port 8 cabled to port 3, 4, 7 or 8 of one of four MetaRouters in racks 002, 003, 012 and 013"
  007-4311-002-numbering: "007-4311-002 Appendix C, printed pages 94 to 97, and 108-xxxx-PR2 Figure 1-2 (printed page 1-6): compute racks are numbered 001 and up, I/O racks 101 and up, and a brick is named by its bottom rack unit; an I-brick sits at units 20 to 23, bay 20, of an I/O rack"
  007-4311-002-router-ports: "007-4311-002 printed pages 36 and 37: ports 1, 6, 7 and 8 join R-bricks and ports 2 to 5 take C-bricks"
  007-4311-002-l2: "007-4311-002 printed page 42: an L2 controller is required in a rack that holds an R-brick"
  007-4240-002-cbrick-ports: "007-4240-002 printed page 196 and 007-4311-002 printed page 36: C-bricks are cabled only to router ports 2, 3, 4 and 5"
  007-4240-002-xio: "007-4240-002 printed page 124: the XIO (II) connector joins a C-brick to an I-, P- or X-brick"
  108-0240-002-ports: "108-0240-002 printed pages 2-28 and 2-29: I-brick ports A and B go to compute nodes"
layer:
  kind: product
  id: origin3800-256p
  requires: {assembly: ip35}
  topology:
    min_nodes: 1
    max_nodes: 64
    # This composition fixes the selected fit, four processors in each of
    # 64 C-bricks, so it is the only population an emulator built from
    # it would accept.
    supported_cpu_populations: [[4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4]]
    supported_processors:
      - {part: r12000, clock_mhz: 400, cache_mib: 8}
    supported_bank_mib_per_node:
      - [512, 512, 0, 0, 0, 0, 0, 0]
      - [512, 512, 512, 512, 512, 512, 512, 512]
    provenance: vendor-document
    sources: [007-4311-002-3800, 007-4311-002-bundles]
  population:
    nodes: 64
    cpus_per_node: [4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4]
    provenance: vendor-document
    sources: [007-4311-002-bundles, 007-4311-002-3800]
  cpu_selection:
    default: {clock_mhz: 400, cache_mib: 8}
    slots: [cpu0, cpu1, cpu2, cpu3]
  memory_kits_per_node: [kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks, kit-1024-two-512-banks]
  composition_rules:
    counts:
      - {bricks: [c-brick], min: 1, max: 64}
      - {bricks: [r-brick], min: 2, max: 20}
      - {bricks: [i-brick, p-brick, x-brick], max: 8, require: i-brick}
    provenance: vendor-document
    sources: [007-4311-002-3800, 007-4311-002-bundles]
    notes: >-
      Two R-bricks per compute rack, as the 32-processor bundle ships, and
      a MetaRouter in the third slot of four racks. The I-brick is in the
      I/O rack.
  data:
    machine:
      name: Origin 3800 (256 processors)
      model_role: emulation-target
      notes: >-
        An Origin 3800 of eight compute racks, 001 to 004 and 011 to 014,
        and 256 processors: 64 four-processor C-bricks, eight in each rack,
        four on ports 2 to 5 of each of 16 rack R-bricks, two to a rack, and
        four MetaRouters, one in each of racks 002, 003, 012 and 013, at unit
        38. The rack R-bricks of a rack are joined port 1 to port 1 and 6 to
        6, neighbouring racks (001 and 002, 003 and 004, 011 and 012, 013 and
        014) by port 7 between R-bricks at the same unit, and each rack
        R-brick's port 8 goes to a MetaRouter's port 3, 4, 7 or 8 (unit 19
        to 3 or 4, unit 27 to 7 or 8), so each MetaRouter takes four uplinks
        and no two MetaRouters are cabled together. That is the cabling
        draft's 256-processor table, and its port-level wiring agrees with
        the shipped drawing, so the wiring is established; the 104 cables
        and 20 R-bricks match the drawing's counts. Which port a rack router
        uses for the neighbouring-rack cable and which for the uplink is the
        draft's statement (inferred for shipped systems: the stock PROM
        accepts the two swapped). The four MetaRouters carry the role the
        PROM needs to number the graph; the draft labels no router's role,
        so the assignment is inferred from the wiring, and that the L1's
        role nibble reaches the router's role bits is inferred too. A
        MetaRouter's ports 1, 2, 5 and 6 are left empty. Each rack repeats
        the one-rack layout: C-bricks at bays 10, 13, 16 and 21 on the
        unit-19 R-brick and 24, 29, 32 and 35 on the unit-27 R-brick, so a
        bay repeats across the racks and only the rack tells the bricks
        apart. An I-brick sits in I/O rack 101 at bay 20 (inferred, as at 64
        processors) and is cabled to the first C-brick's XIO (II) connector
        at its XBridge port A, a model choice and an approximation; the I/O
        racks' cabling at this size is unknown. Each R-brick presents all
        eight ports, and the rack L2 controllers are not modelled. Each
        C-brick carries four 400 MHz R12000s with 8 MB secondary caches and
        1024 MB in two 512 MB banks, so the default total is 64 GiB. The
        routers answer the model's synthetic diagnostics, which no hardware
        record settles. No automated check boots the stock PROM on this
        topology; the build is checked and no guest has run on it.
      emulation:
        # A rack with an R-brick holds an L2 (established), but starting
        # one is a launch choice. Nobody has booted this topology with the
        # L2 attached, so it stays off.
        l2_controller:
          default: "off"
          rating: approximated
          reason: >-
            Starting the L2 is a launch choice. This topology has never been
            booted with the L2 attached, so it is not started by default.
          provenance: unsourced
          sources: ["qemu:docs/system/mips/sgi/hardware/l1-l2-link.rst"]
        bedrock_nodes:
          c00-bedrock: &cbrick-bedrock
            # Product code 0 in bits 15:12 is a C-brick to OpenBSD and the
            # stock PROM. The low nibble selects the PROM's configuration
            # row; 2 is the 400 MHz, 8 MB row this fit matches. The other
            # bits are unknown and read zero.
            board_id_word: 2
            local_region: 0
            initiator_region: 0
            installed_bank_mask: {mode: fitted-banks}
            provenance: derived
            sources: ["openbsd-sgi:2df91d80c104 sys/arch/sgi/sgi/ip27.h lines 43 to 46: product code 0 is a C-brick", "firmware:ip35-prom-6.210 CPU-configuration table, the 400 MHz, 8 MiB C-brick row"]
            notes: >-
              Approximation. Established: product code 0. Chosen: low nibble
              2, the configuration row of the selected fit; which nibble a
              physical C-brick presents is unknown, and a register read on a
              matching board would settle it.
          # @generated layer-bedrock-aliases
          c01-bedrock: *cbrick-bedrock
          c02-bedrock: *cbrick-bedrock
          c03-bedrock: *cbrick-bedrock
