          - {component: c04-chassis, number: 24, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 24 of rack 001."}
          - {component: c05-chassis, number: 29, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 29 of rack 001."}
          - {component: c06-chassis, number: 32, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 32 of rack 001."}
          - {component: c07-chassis, number: 35, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 35 of rack 001."}
          - {component: c08-chassis, number: 10, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 10 of rack 002."}
