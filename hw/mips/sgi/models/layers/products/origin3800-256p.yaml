          # @end
          ibrick-l1:
            profile: ibrick
            revision: {major: 1, minor: 44, patch: 0}
            provenance: derived
            sources: [qemu:docs/system/mips/sgi/hardware/l1.rst]
            notes: The I-brick profile of the L1 model, reached from c0's L1 over the XIO cable. Its firmware revision is the same approximation as the C-bricks'.
        io_boards:
          ibrick-xbridge-bridge-f:
            ioc3_subsystem_id: 65535
            mac_source: none
            provenance: derived
            sources: [qemu:docs/system/mips/sgi/hardware/bricks.rst#sgi-sn-family-ibrick, hw/misc/tsb12lv22.c]
            notes: >-
              The IOC3 subsystem field is the unobserved placeholder, and no
              source gives where the IO7's Ethernet address comes from. The
              IEEE 1394 link controller's PHY is the model's lone
              unconnected PHY, an approximation: the fitted PHY part is
              unidentified, and no 1394 bus or CD-ROM is modelled.
        system_timekeepers:
          ibrick-xbridge-bridge-f:
            kind: m48t35-compatible
            year_base: 1968
            initial_ip27_fixture: false
            provenance: derived
            sources: ["openbsd-sgi:2df91d80c104636deeef8124252ddd5951b55fbf sys/arch/sgi/dev/dsrtc.c lines 169 to 174"]
            notes: >-
              The IO7's time-of-day part is not identified; this is the
              Origin 300's M48T35-compatible choice, an approximation. IP35
              software uses the 1968 year convention.
        # The IP35 flash configuration block's product values: machine type
        # 0, the C-brick rows' class, and the 400 MHz, 8 MB row's word.
        ip35_firmware:
          machine_type: 0
          cpu_mode_word: 0x5414a785
          provenance: derived
          sources: ["firmware:ip35-prom-6.210 CPU-configuration table, the 400 MHz, 8 MiB C-brick row and its machine-type byte"]
          notes: Inferred from the PROM's own table, as the Origin 300's values are; no C-brick flash block has been captured.
        # The router answers the model's synthetic diagnostics, which no
        # hardware record settles.
        synthetic_router_diagnostics: true
        machine_name: origin3000
        display_description: SGI Origin 3800 (IP35), 256 processors, 64 C-bricks in 8 racks on 20 R-bricks and an I-brick in an I/O rack
        profile: origin3800-256p
        lifecycle: implemented
        # Each C-brick runs the 1024 MB fit. The 4096 MB fit is not offered:
        # no measurement covers a guest of that size.
        emulator_constraints:
          accepted_bank_sizes_mib: [1024]
        firmware_payload:
          argument: -bios
          path: firmware/6.5.30/ip35prom.payload.bin
          size: "0x1686a8"
          sha256: 554924380189a03a512156af2faa38344902f251b49fd5c80c253c23ecaff27b
          read_only: true
          views:
            - name: CPU reset view
              address: "0x000_001fc00000"
              payload_offset: "0x0"
              size: "0x1686a8"
            - name: local Hub-special boot view
              address: "0x100_18000000"
              payload_offset: "0x0"
              size: "0x1686a8"
            - name: bounded high local Hub-special boot view
              address: "0x100_1fc00000"
              payload_offset: "0x0"
              size: "0x1686a8"
            - name: node-zero remote Hub-special boot view
              address: "0x100_38000000"
              payload_offset: "0x0"
              size: "0x1686a8"
          second_selection:
            address: "0x100_1a000000"
            size: "0x0080_0000"
          provenance: derived
          sources: [qemu:docs/system/mips/sgi/prom-image.rst#sgi-prom-image-carrier, qemu:docs/system/mips/sgi/prom-image.rst#sgi-prom-image-trampolines, qemu:docs/system/mips/sgi/prom-image.rst#sgi-prom-image-ip35-views]
          notes: >-
            The Origin 300's stock IP35 PROM 6.210 payload and views, carried
            by each C-brick's node; the Origin 3200 inventory reports the same
            PROM revision. Emulator compatibility policy; no fitted flash part
            or physical reset decoder is claimed.
        # The racks are numbered here and the bay is the number of the
        # brick's bottom rack unit, so a bay repeats across racks. The
        # cabling draft's 256-processor table gives each rack's C-bricks the
        # units below and its R-bricks units 19 and 27.
        rack_numbers:
          - {component: rack-001, number: 1, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 001."}
          - {component: rack-002, number: 2, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 002."}
          - {component: rack-003, number: 3, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 003."}
          - {component: rack-004, number: 4, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 004."}
          - {component: rack-011, number: 11, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 011."}
          - {component: rack-012, number: 12, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 012."}
          - {component: rack-013, number: 13, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 013."}
          - {component: rack-014, number: 14, reason: "The cabling draft's 256-processor table, Table 2-23: compute rack 014."}
          - {component: rack-101, number: 101, reason: "Inferred: the base I/O rack of a system with compute racks takes the first I/O rack number, 101; no source prints it."}
        router_roles:
          # @generated layer-router-roles
          - {component: rbrick16-router, role: 14, reason: "R-brick 16 at unit 38 of rack 002 takes rack-router uplinks on ports 3, 4, 7 and 8, so it is a MetaRouter. The cabling draft labels no role: inferred from the wiring."}
          - {component: rbrick17-router, role: 14, reason: "R-brick 17 at unit 38 of rack 003 takes rack-router uplinks on ports 3, 4, 7 and 8, so it is a MetaRouter. The cabling draft labels no role: inferred from the wiring."}
          - {component: rbrick18-router, role: 14, reason: "R-brick 18 at unit 38 of rack 012 takes rack-router uplinks on ports 3, 4, 7 and 8, so it is a MetaRouter. The cabling draft labels no role: inferred from the wiring."}
          - {component: rbrick19-router, role: 14, reason: "R-brick 19 at unit 38 of rack 013 takes rack-router uplinks on ports 3, 4, 7 and 8, so it is a MetaRouter. The cabling draft labels no role: inferred from the wiring."}
          # @end
        initial_module_numbers:
          # @generated layer-chassis-numbers
          - {component: c00-chassis, number: 10, reason: "The cabling draft's 64-processor table, Table 2-14: this C-brick at unit 10 of rack 001."}
