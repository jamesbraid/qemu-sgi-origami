# SPDX-License-Identifier: BSD-3-Clause
# Origin 200 product topology and default runtime population.
layer_version: 1
layer:
  kind: product
  id: origin200
  requires:
    assembly: ip29
    module: logic-carrier
  excluded_components:
    - match: {kind: crossbar}
      reason: The base Origin 200 connects Hub directly to Bridge and contains no physical Crossbow.
      provenance: vendor-document
      sources: ["007-3708-002 Figure 1-4 printed page 6 PDF page 32 mapping trusted"]
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[1], [2]]
    provenance: vendor-document
    sources: ["007-3708-002 Table 1-1 printed page 5 PDF page 31 and Figure 1-4 printed page 6 PDF page 32 mapping trusted"]
  population:
    nodes: 1
    cpus_per_node: [1]
    provenance: derived
    sources: ["007-3709-002 printed pages 46, 48, and 53, establishes paired DIMMs and bank 0 in sockets 1-2"]
  cpu_selection:
    default: {clock_mhz: 180, cache_mib: 1}
    slots: [cpu0]
    # Every processor module this board takes: SGI fitted these to real
    # Origin 200s (docs/specs/sgi-sn.rst, Origin 200 processor options).
    # processors_per_node lists the PIMM sizes a real machine shows.
    offered:
      - {part: r10000, clock_mhz: 180, cache_mib: 1, processors_per_node: [1, 2]}
      - {part: r10000, clock_mhz: 180, cache_mib: 2, processors_per_node: [1, 2]}
      - {part: r10000, clock_mhz: 225, cache_mib: 2, processors_per_node: [2]}
      - {part: r12000, clock_mhz: 270, cache_mib: 4, processors_per_node: [2]}
  memory_kits_per_node: [kit-64]
  # The slots a graphics pipe can take, what each offers and the pipe
  # the machine fits by default; products and values are
  # hw/mips/sgi/models/graphics-products.yaml's (docs/specs/sgi-sn.rst,
  # Graphics pipes).
  graphics:
    max_pipes: 1
    headless: true
    slots:
      - name: pci-5
        description: "PCI option slot, device 5, on the system board's Bridge"
        placement: {bus: pci, addr: "{number}"}
        families:
          - family: psitech
            products:
              - {product: rad4, fidelity: validated, pairing: established}
              - {product: rad4-km, fidelity: implemented, pairing: established}
      - names: [pci-6, pci-7]
        description: "PCI option slot on the system board's Bridge"
        placement: {bus: pci, addr: "{number}"}
        families:
          - family: psitech
            products:
              - {product: rad4, fidelity: implemented, pairing: established}
              - {product: rad4-km, fidelity: implemented, pairing: established}
  data:
    machine:
      name: Origin 200 (one-module form)
      model_role: emulation-target
      firmware_config:
        machine_type: 1
        flash_read_cycles: 15
        flash_write_cycles: 4
        provenance: derived
        sources: [qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-config-block, qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-ip27-values, qemu:docs/specs/sgi-prom-image.rst]
      emulation:
        machine_name: origin200
        display_description: SGI Origin 200 (IP29)
        profile: base
        lifecycle: implemented
        emulator_constraints:
          # Per-node totals -m may select: every sum of up to four banks of
          # 64, 128 or 512 MiB. 256 MB banks are left out because the stock
          # PROM disables them at 180 and 195 MHz. QEMU keeps bank 0 at
          # 128 MiB unless the total needs a 512 MiB bank 0 (1024, 1536 and
          # 2048 MiB).
          accepted_bank_sizes_mib: [64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768, 832, 896, 1024, 1088, 1152, 1216, 1280, 1536, 1600, 1664, 2048]
          # The same with 256 MB banks, which the stock PROM keeps for every
          # other processor clock: bank 0 up to 256 MiB unless 2048 MiB needs
          # a 512 MiB one, the rest up to 512.
          accepted_bank_sizes_mib_with_256mb_banks: [64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768, 832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344, 1408, 1536, 1600, 1664, 1792, 2048]
        synthetic_identities:
          - component: hub
            serial: "0x51454d554e00"
            reason: Synthetic node identity N0, carrying the "QEMU" marker; not hardware evidence.
          - component: bridge
            serial: "0x51454d554200"
            reason: Synthetic Bridge identity B0, carrying the "QEMU" marker; not hardware evidence.
          - component: ioc3
            serial: "0x5e7454d55000"
            reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
      harness:
        console: ioc3-serial-a
        prom_dialogue: ip27-menu
        default_cpu_model: R10000
        disk_bus: scsi.0
        netboot_adapter: ioc3-ethernet
        default_topology: single-node
        has_synthesized_firmware_toggle: false
        needs_debug_leds_off: true
        supported_guests: [irix, linux, openbsd, gentoo]
        install_media: [disk-image, netboot]
        provenance: derived
        sources: [qemu:docs/specs/sgi-sn.rst#sgi-sn-launch-console, qemu:docs/specs/sgi-sn.rst#sgi-sn-launch-metadata, qemu:docs/specs/sgi-sn.rst#sgi-sn-launch-disk-bus, "QEMU commit bd935b711b0d71244c1e59fb1e18e7b73d8a3dfa (\"hw/mips/sgi/sn0: delete the node's synthesized-firmware hooks\") deletes the synthesized-firmware property from the SN0 machine class entirely; origin200-machine no longer has it under any value"]
      notes: >-
        This model covers the one-module Origin 200 and QEMU's base profile. The
        Owner's Guide also documents a two-module form with three or four CPUs.
        [Dual-module Origin 200](origin200-dual.md) records that form separately.
        The node number occupies physical address bits 39:32 and a node owns 4 GB,
        so every offset below is node-relative and a second node is a different
        base rather than a different map.
    evidence_policy: strict
