# SPDX-License-Identifier: BSD-3-Clause
# The Onyx2 deskside: two node boards on the 4P1G5 midplane, a BaseIO-G in
# IO1 and one InfiniteReality pipe on XIO4 (docs/specs/sgi-onyx2.rst,
# Deskside). layers/modules/onyx2-deskside-module.yaml holds the chassis.
layer_version: 1
layer:
  kind: product
  id: onyx2-deskside
  requires:
    assembly: ip27
  topology:
    min_nodes: 1
    max_nodes: 2
    supported_cpu_populations:
    - [2, 2]
    provenance: vendor-document
    sources: ["007-3454-005 printed pages 1-2 PDF pages 19-20: one or two node boards and up to four processors"]
    # One or two node boards, node slot 1 first (docs/specs/sgi-onyx2.rst,
    # Node-board populations). The deskside's one Crossbow carries every
    # XIO slot, so a single node board controls all of them.
    node_populations:
    - node_slots: [1]
      routers: []
      fabric_links: []
      xio_slots: {xio-slot-2: 1, xio-slot-3: 1, xio-slot-5: 1, xio-slot-6: 1}
      supported_cpu_populations: [[2], [1]]
      grade: inferred
      sources: ["007-3454-005 printed page 1 PDF page 19: the standard deskside has one Node board, the entry level one processor", "007-3454-005 printed page 21 PDF page 39: the first Node board is always installed in the right-hand slot"]
      notes: >-
        Node 1 controlling every widget is inferred from its being the only
        Hub on the one Crossbow. A one-node deskside probably still carries
        the Null Router (007-3457-005 printed page 46), whose other end is
        then an empty slot; fitting no link is inferred to be the same to
        firmware.
    - node_slots: [1, 2]
      routers: []
      fabric_links: [null-router]
      xio_slots: {xio-slot-2: 1, xio-slot-3: 1, xio-slot-5: 1, xio-slot-6: 1}
      supported_cpu_populations: [[2, 2], [1, 1], [2, 1]]
      grade: established
      sources: ["007-3454-005 printed pages 1-2 PDF pages 19-20: one or two node boards and up to four processors", "007-3454-005 printed page 19 PDF page 37: the Null-Router board joins the node boards"]
  population:
    nodes: 2
    cpus_per_node: [2, 2]
    provenance: derived
    sources: ["007-3454-005 printed pages 1-2 PDF pages 19-20: one or two node boards and up to four processors"]
  cpu_selection:
    default: {clock_mhz: 180, cache_mib: 1}
    slots: [cpu-a, cpu-b]
  memory_kits_per_node: [kit-64, kit-64]
  data:
    machine:
      name: Onyx2 deskside with one InfiniteReality pipe
      model_role: emulation-target
      notes: >-
        Selected installation of two node boards, each with two processors
        and one 64 MiB bank, joined by the midplane's Null Router. IO1 holds
        a BaseIO-G with its MediaIO daughtercard; the graphics board set
        takes XIO4 directly, with a geometry board, one raster manager with
        texture memory and a display generator, and no Ktown, so the pipe's
        one-wire chain answers the geometry record alone. The other XIO
        slots are empty. This is a selected population, not a captured
        machine inventory. The full processor mode word is not the full CP0
        Config register; only the reviewed low 25 bits transfer. Stock image
        configuration must agree and is never rewritten by descriptor
        generation.
      firmware_config:
        cpu_clock_hz: 180000000
        hub_clock_hz: 90000000
        processor_reset_mode:
          kseg0_cache_algorithm: cacheable-coherent-exclusive-on-write
          processor_device_number: 0
          coherent_request_target: external-agent
          processor_eliminate_requests: false
          maximum_outstanding_processor_requests: 4
          system_clock_divisor: 2
          secondary_cache_block_words: 32
          secondary_cache_error_correction: retry-access-through-corrector
          memory_endianness: big
          secondary_cache_size_kib: 1024
          secondary_cache_clock_divisor: 1.5
          secondary_cache_clock_tap: 9
          open_drain_system_interface: false
          cache_test_mode: false
        machine_type: 0
        flash_read_cycles: 8
        flash_write_cycles: 1
        provenance: derived
        sources: ["docs/datasheets/origin2000-cpu-reset-mode.md selects the documented 180 MHz R10000, 90 MHz Hub, 1 MiB cache composition matching the unchanged stock mode word.", qemu:docs/specs/sgi-hub.rst#sgi-hub-processor-interface, qemu:docs/specs/sgi-onyx2.rst#sgi-onyx2-node-slot-codes]
      emulation:
        machine_name: onyx2
        display_description: SGI Onyx2 deskside, one InfiniteReality pipe on XIO4
        profile: onyx2-deskside
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib:
          - 64
        initial_module_numbers:
        - component: compute-module
          number: 1
          reason: >-
            Selected initial identity, matching the Origin 2000 module. With 0
            the stock PROM votes a module number and resets once more before
            it settles.
        initially_operational_crossbow_links:
        - component: crossbow-0
          widgets: [8, 9, 10, 15]
          reason: >-
            Static emulator startup health for the pipe at widget 8, the two
            Hub links at 9 and A, and the BaseIO-G at F. Machine launch and
            whole-machine reset reapply it; migration restores runtime link
            state instead. This does not model Crossbow training or
            establish diagnostic acceptance.
        hub_ni_revision_overrides:
        - component: node-board-1-hub
          ni_revision: 5
          reason: "Graphics-capable SN0 nodes report Hub NI revision code 5 in every capture found, as the onyx2-rack product layer records."
        - component: node-board-2-hub
          ni_revision: 5
          reason: Matches node-board-1-hub; a module's Hubs share one manufactured revision.
        module_semantic_serials:
        - component: compute-module
          serial: EMUM000001
          reason: Synthetic module serial for module 1, carrying the "EMU" marker; not hardware evidence.
        module_responder_identities:
        - component: node-board-1-hub
          serial: '0x51454d554d10'
          reason: Synthetic module-identity responder serial for node 1, the module letter M at instance 16, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-2-hub
          serial: '0x51454d554d11'
          reason: Synthetic module-identity responder serial for node 2, the module letter M at instance 17, carrying the "QEMU" marker; not hardware evidence.
        synthetic_identities:
        - component: node-board-1-hub
          serial: '0x51454d554e00'
          reason: Synthetic node identity N0, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-2-hub
          serial: '0x51454d554e01'
          reason: Synthetic node identity N1, carrying the "QEMU" marker; not hardware evidence.
        - component: baseio-bridge
          serial: '0x51454d554200'
          reason: Synthetic Bridge identity B0, carrying the "QEMU" marker; not hardware evidence.
        - component: baseio-ioc3
          serial: '0x5e7454d55000'
          reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
        - component: mediaio-ioc3
          serial: '0x5e7454d55001'
          reason: Synthetic IOC3 identity 1. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
        - component: io4-xg
          serial: '0x51454d554700'
          reason: Synthetic graphics board identity G0, carrying the "QEMU" marker; not hardware evidence.
      harness:
        console: ioc3-serial-a
        prom_dialogue: ip27-menu
        default_cpu_model: R10000
        disk_bus: scsi.0
        netboot_adapter: ioc3-ethernet
        default_topology: onyx2-deskside
        supported_guests: [irix]
        install_media: [disk-image]
        provenance: derived
        sources: ["query-sgi-machines: the node<N>-flash storage items, one per node board, that qemu-sgi-machine-init creates and a launch binds", "qemu:hw/mips/sgi/models/layers/products/origin2000-rack.yaml the same IP27 PROM dialogue, console and disk bus as the Origin 2000 module"]
    evidence_policy: strict
