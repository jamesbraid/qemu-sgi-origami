# SPDX-License-Identifier: BSD-3-Clause
# Revision G Fuel board with a VPro graphics board.
layer_version: 1
layer:
  kind: product
  id: fuel-vpro
  requires: {assembly: ip34}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[1]]
    provenance: vendor-document
    sources: ["007-4480-001 printed pages 30 to 32: one PIMM and minimum memory configuration"]
  population:
    nodes: 1
    cpus_per_node: [1]
    provenance: vendor-document
    sources: ["007-4480-001 printed pages 30 to 32 and 60: 500 MHz R14000A option, two 256 MiB DIMMs in matched pair 1"]
  cpu_selection:
    default: {clock_mhz: 500, cache_mib: 2}
    slots: [cpu0]
  memory_kits_per_node: [fuel-512-test-map]
  data:
    machine:
      name: Fuel with VPro
      model_role: emulation-target
      notes: >-
        The serial Fuel with a VPro board in its graphics slot at widget 13,
        the position a Fuel IRIX inventory and an OpenBSD capture both
        report. Memory, processor and board inputs match the base Fuel
        profile. The board model is the Odyssey device's V12 default; the
        observed Fuel carried a V10. Display output on this composition is
        unverified until a guest drives it.
      emulation:
        bedrock_nodes:
          bedrock:
            # Bits 15:12 are established: OpenBSD reads them and classifies
            # 0x4 as Fuel (docs/datasheets/ip34-fuel.md). The low nibble is
            # the PIMM speed code PROM 6.210 adds to 0x20 to choose its
            # CPU-configuration table row (docs/research/
            # origin300-flash-cpu-identity.md). 4 selects row 9, the 500 MHz,
            # 2 MiB R14000 module this product fits; that row match is
            # established from the PROM's table. Whether a real 500 MHz PIMM
            # presents 4 or 6, which select the same row, is unknown. The
            # earlier 1 selected the 800 MHz, 4 MiB row and rested only on
            # earlier model runs. The other bits, the reset value and the
            # producer are unknown.
            board_id_word: 16388
            board_id_mask: 61440
            board_id_required_bits: 16384
            local_region: 0
            initiator_region: 0
            installed_bank_mask: {mode: fitted-banks}
            provenance: derived
            sources: ["openbsd-sgi:2df91d80c104636deeef8124252ddd5951b55fbf sys/arch/sgi/sgi/ip27.h lines 43 to 46 and sgi/ip27_machdep.c lines 165 to 185: Fuel product code 0x4 in bits 15:12", hw/mips/sgi/sn1-node.c, hw/mips/sgi/sn-machine.c]
            notes: >-
              The board-identification word is the established Fuel
              product code with the PIMM speed code of the fitted 500 MHz,
              2 MiB module, 4 (inferred; 6 selects the same table row). Regions
              and bank mask preserve existing emulator initialization.
        l1_controllers:
          l1:
            # Inferred. The public Linux IP35 series maps L1 brick type 'A'
            # (0x41) to Fuel and '4' to Origin 300, and PROM 6.210's type
            # converter accepts raw '4' or 'A' but rejects 0x61. No Fuel
            # L1 identity reply is captured (docs/datasheets/ip34-fuel.md).
            reported_type: 65
            # No revision: the two public Fuel captures report 1.48.1 and
            # 1.14.4 and neither is tied to the selected revision G board,
            # so the reply stays the observable unknown-version error.
            mac_eeprom_input: {option: fuel-mac-eeprom, required: false}
            provenance: guest-source
            sources: ["web:lore-kaloz-ip35-35 brick type 'A' is SGI Fuel", "firmware:ip35-prom-6.210 I/O type lookup"]
            notes: >-
              The reported type comes from a published driver table and the
              PROM's accepted set, not a captured Fuel reply. The older
              Linux-MIPS IP34 constant 0x61 ('a') fails PROM 6.210's I/O
              type lookup.
        io_boards:
          ip34-system-board:
            # Inferred. Mainline Linux assigns subsystem device 0xc30a to
            # the IP34 system board's IOC3; no Fuel configuration-space
            # value is captured (docs/datasheets/ip34-fuel.md).
            ioc3_subsystem_id: 49930
            mac_source: module-l1
            provenance: guest-source
            sources: ["linux:db2ddb871435 arch/mips/pci/pci-xtalk-bridge.c: IP34 IOC3 subsystem device 0xc30a", hw/mips/sgi/baseio.c]
            notes: >-
              The IOC3 subsystem ID is a public driver expectation, not a
              captured Fuel value. The supplied MAC policy is unchanged.
        pci_function_revisions:
          scsi:
            revision: 6
            provenance: derived
            sources: [hw/scsi/qlogic-isp.c]
            notes: Preserves the implemented ISP12160 class revision. The Fuel silicon revision is unverified.
          ioc3:
            revision: 1
            provenance: derived
            sources: [include/hw/misc/sgi-ioc3.h]
            notes: Preserves the implemented IOC3 class revision. The Fuel silicon revision is unverified.
        system_timekeepers:
          ip34-system-board:
            kind: m48t35-compatible
            year_base: 1968
            initial_ip27_fixture: false
            provenance: derived
            sources: ["openbsd-sgi:2df91d80c104636deeef8124252ddd5951b55fbf sys/arch/sgi/dev/dsrtc.c lines 169 to 174"]
            notes: Flat independent 32 KiB storage is a compatibility assumption. Physical part, capacity, decode and wiring are unknown.
        # The IP35 flash configuration block's product values. PROM 6.210's
        # 0x4000-branch (Fuel) table rows all carry machine type 2 (SN11),
        # and a real Fuel's "flash -f" records SN11; the 500 MHz, 2 MiB
        # R14000 row's mode word is 0x549aa985.
        ip35_firmware:
          machine_type: 2
          cpu_mode_word: 0x549aa985
          provenance: derived
          sources: ["firmware:ip35-prom-6.210 CPU-configuration table, 0x4000-branch rows", "web:graphica-o350-chimera-notes stripped text lines 751 to 773: a real Fuel's flash -f machine-type prompt answered 2 (SN11)"]
          notes: Machine type established from the PROM table and one real flash session; the earlier value 1 was Origin 300's and made the PROM report a CPU configuration mismatch.
        machine_name: fuel
        display_description: SGI Fuel (IP34) with VPro
        profile: vpro
        lifecycle: implemented
        emulator_constraints:
          accepted_bank_sizes_mib: [512]
        firmware_payload:
          argument: -bios
          path: firmware/6.5.30/ip35prom.payload.bin
          size: "0x1686a8"
          sha256: 554924380189a03a512156af2faa38344902f251b49fd5c80c253c23ecaff27b
          read_only: true
          views:
            - {name: CPU reset view, address: "0x000_001fc00000", payload_offset: "0x0", size: "0x1686a8"}
            - {name: local Hub-special boot view, address: "0x100_18000000", payload_offset: "0x0", size: "0x1686a8"}
            - {name: bounded high local Hub-special boot view, address: "0x100_1fc00000", payload_offset: "0x0", size: "0x1686a8"}
            - {name: node-zero remote Hub-special boot view, address: "0x100_38000000", payload_offset: "0x0", size: "0x1686a8"}
          second_selection: {address: "0x100_1a000000", size: "0x0080_0000"}
          provenance: derived
          sources: ["qemu:hw/mips/sgi/models/layers/products/origin300.yaml existing bounded IP35 PROM compatibility carrier", qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-ip35-views]
          notes: >-
            This boot spike reuses the Origin 300 emulator's bounded views of
            the operator-supplied IP35 PROM payload. The physical Fuel reset
            decoder, flash part and selection priority are unknown. A stock
            Fuel PROM fetch trace and independent board evidence must test
            these addresses before this can become a hardware claim.
        synthetic_identities:
          - {component: bedrock, serial: "0x51454d554e00", reason: 'Synthetic node identity N0, carrying the "QEMU" marker; not hardware evidence.'}
          - {component: xbridge, serial: "0x51454d555800", reason: 'Synthetic XBridge identity X0, carrying the "QEMU" marker; not hardware evidence.'}
          - {component: ioc3, serial: "0x5e7454d55000", reason: 'Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.'}
          - {component: vpro-v12, serial: "0x51454d554700", reason: 'Synthetic graphics board identity G0, carrying the "QEMU" marker; catalogue metadata only, since the Odyssey device supplies its own NIC serial.'}
        initially_operational_crossbow_links:
          - component: xbridge-crossbar
            widgets: [13, 14, 15]
            reason: Both PCI bridge heads and the graphics board are present on the selected XBridge; startup health is emulator policy pending a Fuel reset test.
