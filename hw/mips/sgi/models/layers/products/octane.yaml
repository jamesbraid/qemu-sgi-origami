# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: product
  id: octane
  requires:
    assembly: ip30
    module: octane-module
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations:
    - - 1
    provenance: derived
    sources:
    - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-topology
  population:
    nodes: 1
    cpus_per_node:
    - 1
    provenance: derived
    sources:
    - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-topology
  cpu_selection:
    default:
      clock_mhz: 195
      cache_mib: 1
    slots:
    - cpu0
  memory_kits_per_node:
  - kit-128
  # Graphics heads heads.<position>=<id> selects; the ids are
  # hw/mips/sgi/models/graphics-heads.yaml's (docs/specs/sgi-sn.rst,
  # Graphics heads).
  graphics:
    max_heads: 1
    positions:
      - names: [widget-9, widget-10]
        description: "Crossbow port of an XIO graphics slot"
        options:
          - {id: none, default: true, fidelity: validated}
          - {id: si, fidelity: implemented, pairing: established}
          - {id: si-t, fidelity: implemented, pairing: established}
          - {id: esi, fidelity: implemented, pairing: established}
          - {id: ssi, fidelity: implemented, pairing: established}
          - {id: essi, fidelity: implemented, pairing: established}
          - {id: esi-t, refused: "the model lacks the texture paths this board needs"}
          - {id: mxi, refused: "the model lacks the texture paths this board needs"}
          - {id: emxi, refused: "the model lacks the texture paths this board needs"}
      - name: widget-11
        description: "Crossbow port 11, the default graphics port"
        options:
          - {id: none, default: true, fidelity: validated}
          - {id: si, fidelity: implemented, pairing: established}
          - {id: si-t, fidelity: implemented, pairing: established}
          - {id: esi, fidelity: implemented, pairing: established}
          - {id: ssi, fidelity: implemented, pairing: established}
          - {id: essi, fidelity: implemented, pairing: established}
          - {id: esi-t, refused: "the model lacks the texture paths this board needs"}
          - {id: mxi, refused: "the model lacks the texture paths this board needs"}
          - {id: emxi, refused: "the model lacks the texture paths this board needs"}
          - id: v10
            refused: "VPro V10 and V12 need Crossbow 1.4, the ER power supply 060-0035-00x and PROM 4.5 (007-4210-003); this Octane presents Crossbow revision code 4, below the 1.4 required, and the SR supply."
            requires:
              - {kind: crossbow-revision, value: "1.4", evidence: "007-4210-003 preface", met: false}
              - {kind: power-supply, value: "060-0035-00x, x >= 1", evidence: "007-4210-003 preface", met: false}
              - {kind: prom-revision, value: "4.5", evidence: "007-4210-003 preface"}
              - {kind: guest-release, value: "IRIX 6.5.10", evidence: "007-4210-003 preface"}
          - id: v12
            refused: "VPro V10 and V12 need Crossbow 1.4, the ER power supply 060-0035-00x and PROM 4.5 (007-4210-003); this Octane presents Crossbow revision code 4, below the 1.4 required, and the SR supply."
            requires:
              - {kind: crossbow-revision, value: "1.4", evidence: "007-4210-003 preface", met: false}
              - {kind: power-supply, value: "060-0035-00x, x >= 1", evidence: "007-4210-003 preface", met: false}
              - {kind: prom-revision, value: "4.5", evidence: "007-4210-003 preface"}
              - {kind: guest-release, value: "IRIX 6.5.10", evidence: "007-4210-003 preface"}
          - id: v6
            refused: "the v6 and v8 profiles present identity only; VPro also needs the ER supply (007-4210-003)."
            requires:
              - {kind: power-supply, value: "060-0035-00x, x >= 1", evidence: "007-4210-003 preface", met: false}
              - {kind: prom-revision, value: "4.0", evidence: "007-4210-003 preface"}
              - {kind: guest-release, value: "IRIX 6.5.10", evidence: "007-4210-003 preface"}
          - id: v8
            refused: "the v6 and v8 profiles present identity only; VPro also needs the ER supply (007-4210-003)."
            requires:
              - {kind: power-supply, value: "060-0035-00x, x >= 1", evidence: "007-4210-003 preface", met: false}
              - {kind: prom-revision, value: "4.0", evidence: "007-4210-003 preface"}
              - {kind: guest-release, value: "IRIX 6.5.10", evidence: "007-4210-003 preface"}
      - name: widget-12
        description: "Crossbow port of an XIO graphics slot"
        options:
          - {id: none, default: true, fidelity: validated}
          - {id: si, fidelity: implemented, pairing: established}
          - {id: si-t, fidelity: implemented, pairing: established}
          - {id: esi, fidelity: implemented, pairing: established}
          - {id: ssi, fidelity: implemented, pairing: established}
          - {id: essi, fidelity: implemented, pairing: established}
          - {id: esi-t, refused: "the model lacks the texture paths this board needs"}
          - {id: mxi, refused: "the model lacks the texture paths this board needs"}
          - {id: emxi, refused: "the model lacks the texture paths this board needs"}
      - name: pci-cage
        description: "the PCI cage at Crossbow port 13"
        modelled: false
        reason: "the model has no Octane PCI cage"
  data:
    machine:
      name: Octane serial profile
      model_role: emulation-target
      emulation:
        machine_name: octane
        display_description: SGI Octane (IP30)
        lifecycle: implemented
        profile: serial
        # The fitted part, its select and the strap are unknown (docs/specs/sgi-ip30.rst,
        # Boot flash wiring). Select 0 with the strap low is
        # the compatibility default every launch has used.
        boot_flash_wiring:
          select: false
          strap: false
          provenance: unsourced
          sources:
          - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-flash-wiring
          notes: Unknown wiring; the compatibility default, not a measured board.
        system_timekeepers:
          ip30-board:
            kind: ds1685
            initial_ip27_fixture: false
            provenance: derived
            sources:
            - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-timekeeper
            - hw/mips/sgi/octane.c
            notes: The board's IOC3 drives a DS1685-family clock, whose 512-byte NVRAM and the model's 24-byte clock record a new machine starts zeroed; the part treats an all-zero image as fresh.
        emulator_constraints:
          # The Octane guide (007-3435-004, printed page 54): 64 to 512 MiB a
          # bank, banks filled from bank 1 without a gap, in any order of size
          # (docs/specs/sgi-ip30.rst, Memory kits and capacity).
          accepted_bank_sizes_mib:
          - 64
          - 128
          - 256
          - 512
        synthetic_identities:
        - component: bridge
          serial: '0x51454d554e00'
          reason: The system-board record's marked synthetic serial; the Bridge part holds that record.
        - component: ioc3
          serial: '0x5e7454d55000'
          reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
      harness:
        console: ioc3-serial-a
        prom_dialogue: none
        default_cpu_model: R10000
        disk_bus: scsi
        netboot_adapter: none
        default_topology: octane
        # The candidate part's 1 MiB array (docs/specs/sgi-ip30.rst,
        # Boot flash wiring), which the reviewed CFI01 boot flash
        # ("hw/mips/sgi: use CFI01 for Octane boot flash") implements and
        # octane.c sizes from this catalogue entry. The fitted physical
        # part is still unknown.
        firmware_bytes: 1048576
        identity_inputs: []
        supported_guests:
        - irix
        install_media: []
        provenance: derived
        sources:
        - hw/mips/sgi/octane.c
        - qemu:docs/specs/sgi-ip30.rst#sgi-ip30-launch
