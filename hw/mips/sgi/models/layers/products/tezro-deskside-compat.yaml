# SPDX-License-Identifier: BSD-3-Clause
# Software compatibility composition for the reviewed Tezro deskside inputs.
layer_version: 1
sources:
  tezro-deskside-review: "docs/reviews/chimera-tezro-deskside-compatibility-review-20261006.md: reviewed compatibility choices and unresolved physical behavior"
layer:
  kind: product
  id: tezro-deskside-compat
  requires: {assembly: ip53-tezro}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[4]]
    provenance: derived
    sources: [tezro-deskside-review]
  population:
    nodes: 1
    cpus_per_node: [4]
    provenance: derived
    sources: [tezro-deskside-review]
  memory_kits_per_node: [kit-4096-at-banks-0-5-tezro-deskside]
  cpu_selection:
    default: {clock_mhz: 700, cache_mib: 4}
    slots: [cpu0, cpu1, cpu2, cpu3]
  data:
    machine:
      name: Tezro deskside compatibility profile
      model_role: reference
      construction_pic_profiles:
        pic-b: pic-rev3-bedrock-tezro-experimental
        pic-f: pic-rev3-bedrock-tezro-experimental
      notes: >-
        A software compatibility composition for one deskside Tezro. CPU
        identity and reset Config0 remain unknown. The R16000 tuple, logical
        memory banks, two PIC placements and empty IO9 endpoint list are
        explicit model choices. PIC silicon revision and reset behavior,
        physical DIMM positions, endpoint population and interrupt bindings
        remain unresolved. This model has no graphics devices.
    evidence_policy: strict
    components:
      - {id: chassis, name: Tezro deskside, kind: chassis, provenance: vendor-document, sources: [tezro-deskside-review]}
      - {id: bedrock, name: Bedrock, kind: node-asic, hardware_kind: bedrock, parent: chassis, node_asic: {processor_interfaces: 2, cpus_per_interface: 2}, identity: {clock_mhz: 200}, provenance: derived, sources: [tezro-deskside-review]}
      - {id: cpu0, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350}, provenance: derived, sources: [tezro-deskside-review]}
      - {id: cpu1, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350}, provenance: derived, sources: [tezro-deskside-review]}
      - {id: cpu2, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350}, provenance: derived, sources: [tezro-deskside-review]}
      - {id: cpu3, name: R16000, kind: cpu, hardware_kind: r16000, parent: bedrock, identity: {cache_clock_mhz: 350}, provenance: derived, sources: [tezro-deskside-review]}
      - {id: memory, name: node memory, kind: memory, parent: bedrock, provenance: derived, sources: [tezro-deskside-review]}
      - {id: pic-board-b, name: PIC board at widget 11, kind: board, parent: chassis, provenance: derived, sources: [tezro-deskside-review]}
      - {id: pic-board-f, name: PIC board at widget 15, kind: board, parent: chassis, provenance: derived, sources: [tezro-deskside-review]}
      - {id: pic-b, name: PIC at widget 11, kind: pci-host-bridge, hardware_kind: pic, parent: pic-board-b, pci_host_bridge: {heads: 2}, provenance: derived, sources: [tezro-deskside-review]}
      - {id: pic-f, name: PIC at widget 15, kind: pci-host-bridge, hardware_kind: pic, parent: pic-board-f, pci_host_bridge: {heads: 2}, provenance: derived, sources: [tezro-deskside-review]}
      - {id: io9, name: IO9 card, kind: io-controller, hardware_kind: io9, parent: chassis, identity: {part: "030-1771-005-A"}, provenance: derived, sources: [tezro-deskside-review]}
    buses:
      - {id: sysad0, name: SysAD, kind: sysad, master: cpu0, provenance: derived, sources: [tezro-deskside-review]}
      - {id: xio, name: XIO, kind: xio, master: bedrock, provenance: derived, sources: [tezro-deskside-review]}
      - {id: io9-pci, name: IO9 PCI bus, kind: pci, master: pic-f, provenance: derived, sources: [tezro-deskside-review]}
    connections:
      - {component: bedrock, bus: sysad0, role: endpoint, provenance: derived, sources: [tezro-deskside-review]}
      - {component: cpu1, bus: sysad0, role: master, provenance: derived, sources: [tezro-deskside-review]}
      - {component: cpu2, bus: sysad0, role: master, provenance: derived, sources: [tezro-deskside-review]}
      - {component: cpu3, bus: sysad0, role: master, provenance: derived, sources: [tezro-deskside-review]}
      - {component: bedrock, bus: xio, role: master, widget: 10, provenance: derived, sources: [tezro-deskside-review]}
      - {component: pic-b, bus: xio, role: endpoint, widget: 11, provenance: derived, sources: [tezro-deskside-review]}
      - {component: pic-f, bus: xio, role: endpoint, widget: 15, provenance: derived, sources: [tezro-deskside-review]}
      - {component: io9, bus: io9-pci, role: endpoint, provenance: derived, sources: [tezro-deskside-review]}
      - {component: pic-f, bus: io9-pci, role: bridge-downstream, pci_head: 0, provenance: derived, sources: [tezro-deskside-review]}
