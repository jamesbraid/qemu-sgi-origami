# SPDX-License-Identifier: BSD-3-Clause
# A GIGAchannel-converted Origin 200 module looped back on itself.
layer_version: 1
layer:
  kind: product
  id: origin200-gigachannel-loopback
  requires: {assembly: ip29}
  topology:
    min_nodes: 1
    max_nodes: 1
    supported_cpu_populations: [[1], [2]]
    provenance: vendor-document
    sources: ["007-3708-002 Table 1-1 printed page 5 PDF page 31 and printed pages 109-110 PDF pages 135-136 mapping trusted"]
  population:
    nodes: 1
    cpus_per_node: [1]
    provenance: derived
    sources: ["007-3709-002 printed pages 46, 48, and 53, establishes paired DIMMs and bank 0 in sockets 1-2"]
  cpu_selection:
    default: {clock_mhz: 180, cache_mib: 1}
    slots: [cpu0]
    # Every processor module this board takes: SGI fitted these to real
    # Origin 200s (docs/specs/sgi-sn.rst, Origin 200 processor options).
    # processors_per_node lists the PIMM sizes a real machine shows.
    offered:
      - {part: r10000, clock_mhz: 180, cache_mib: 1, processors_per_node: [1, 2]}
      - {part: r10000, clock_mhz: 180, cache_mib: 2, processors_per_node: [1, 2]}
      - {part: r10000, clock_mhz: 225, cache_mib: 2, processors_per_node: [2]}
      - {part: r12000, clock_mhz: 270, cache_mib: 4, processors_per_node: [2]}
  memory_kits_per_node: [kit-64]
  # The slots a graphics pipe can take, what each offers and the pipe
  # the machine fits by default; products and values are
  # hw/mips/sgi/models/graphics-products.yaml's (docs/specs/sgi-sn.rst,
  # Graphics pipes).
  graphics:
    max_pipes: 1
    headless: true
    slots:
      - name: pci-5
        description: "PCI option slot, device 5, on the system board's Bridge"
        placement: {bus: pci, addr: "{number}"}
        families:
          - family: psitech
            products:
              - {product: rad4, fidelity: validated, pairing: established}
              - {product: rad4-km, fidelity: implemented, pairing: established}
      - names: [pci-6, pci-7]
        description: "PCI option slot on the system board's Bridge"
        placement: {bus: pci, addr: "{number}"}
        families:
          - family: psitech
            products:
              - {product: rad4, fidelity: implemented, pairing: established}
              - {product: rad4-km, fidelity: implemented, pairing: established}
  data:
    machine:
      name: Origin 200 GIGAchannel loopback
      model_role: emulation-target
      firmware_config:
        machine_type: 1
        flash_read_cycles: 15
        flash_write_cycles: 4
        provenance: derived
        sources: [qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-config-block, qemu:docs/specs/sgi-prom-image.rst#sgi-prom-image-ip27-values, qemu:docs/specs/sgi-prom-image.rst]
      emulation:
        machine_name: origin200
        display_description: SGI Origin 200 (IP29)
        profile: gigachannel-loopback
        lifecycle: implemented
        emulator_constraints:
          # Per-node totals -m may select: every sum of up to four banks of
          # 64, 128 or 512 MiB. 256 MB banks are left out because the stock
          # PROM disables them at 180 and 195 MHz. QEMU keeps bank 0 at
          # 128 MiB unless the total needs a 512 MiB bank 0 (1024, 1536 and
          # 2048 MiB).
          accepted_bank_sizes_mib: [64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768, 832, 896, 1024, 1088, 1152, 1216, 1280, 1536, 1600, 1664, 2048]
          # The same with 256 MB banks, which the stock PROM keeps for every
          # other processor clock: bank 0 up to 256 MiB unless 2048 MiB needs
          # a 512 MiB one, the rest up to 512.
          accepted_bank_sizes_mib_with_256mb_banks: [64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768, 832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344, 1408, 1536, 1600, 1664, 1792, 2048]
        synthetic_identities:
          - component: base-hub
            serial: "0x51454d554e00"
            reason: Synthetic node identity N0, carrying the "QEMU" marker; not hardware evidence.
          - component: base-bridge
            serial: "0x51454d554200"
            reason: Synthetic Bridge identity B0, carrying the "QEMU" marker; not hardware evidence.
          - component: base-ioc3
            serial: "0x5e7454d55000"
            reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
      notes: >-
        A converted module with no cabinet. The upgrade guide's loopback test
        shows the PROM inventory of the base machine plus one added
        030-1264-001 record, with the base I/O Bridge back at widget 8. That
        example prints the record as 2G_MPLN rev B; this configuration fits
        the same rev C board, printing XBOX_EXT, as its GIGAchannel sibling,
        since one converted module carries one Crosstown board whichever way
        it is cabled. The rev C board's name in loopback is not captured.
    evidence_policy: strict
    components:
      - id: origin200-system
        name: Origin 200 system
        kind: chassis
        provenance: vendor-document
        description: >-
          One converted module. In loopback the one XIO cable joins the
          Crosstown board's own two connectors, so the Hub reaches its own
          Bridge with no Crossbow between, over the module's own XIO
          link.
        sources: ["007-3708-002 printed pages 109-110 PDF pages 135-136 mapping trusted", "108-0187-001 section pages 2-9 to 2-11 PDF pages 23-25 mapping trusted"]
      - id: crosstown-cpu
        name: Crosstown adapter
        kind: board
        hardware_kind: crosstown
        provenance: vendor-document
        parent: base-ip29-system-board
        description: >-
          CPU-side adapter replacing the passive XTalk jumper board, PCA XBOX
          EXTENSION BOARD O200, with its XIO A and XIO B connectors joined by
          one loopback cable.
        identity:
          part: "030-1264-001"
        sources: ["108-0187-001 Tables 1-1 and 1-2 section page 1-2 PDF page 14 mapping trusted", "007-3708-002 printed pages 109-110 PDF pages 135-136 mapping trusted"]
      - id: crosstown-identity
        name: Crosstown board-identity NIC
        kind: identity
        provenance: observed-hardware
        parent: crosstown-cpu
        identity:
          part: "030-1264-001"
        description: >-
          The Crosstown board's record, which the upgrade guide's loopback
          example lists in the PROM inventory beside the base machine's. That
          it answers on the IP29 Bridge's own one-wire line is inferred, the
          way the BaseIO-G's MIO record shares its Bridge's line.
        sources: ["108-0187-001 section pages 2-9 to 2-11 PDF pages 23-25 mapping trusted"]
    connections:
      - component: crosstown-identity
        bus: base-bridge-one-wire
        role: endpoint
        provenance: derived
        sources: ["108-0187-001 section pages 2-9 to 2-11 PDF pages 23-25 mapping trusted"]
