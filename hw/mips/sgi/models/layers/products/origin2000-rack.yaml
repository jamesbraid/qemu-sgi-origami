# SPDX-License-Identifier: BSD-3-Clause
layer_version: 1
layer:
  kind: product
  id: origin2000-rack
  requires:
    assembly: ip27
  topology:
    min_nodes: 1
    max_nodes: 4
    provenance: derived
    sources: ["007-3439-002 Memory Specifications printed page 35 PDF page 49; 108-0170-001 printed page 1-4 PDF page 18", "007-3456-003 printed page 20 PDF page 40: a single-rack system can have between one and eight Node boards"]
    supported_cpu_populations:
    - [2, 2, 2, 2]
    # One row per fitted node count, in SGI's fill order. Every row keeps
    # the module's two Standard Routers but the one-node row, which needs
    # none; docs/specs/sgi-origin2000-module.rst, Router fit, grades each
    # fact.
    node_populations:
    - node_slots: [1]
      routers: []
      fabric_links: []
      xio_slots: {pci-expansion: 1, xio-slot-3: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1}
      supported_cpu_populations: [[2], [1]]
      grade: inferred
      sources: ["007-3456-003 printed page 30 PDF page 50: a module with only one Node board needs no Router", "007-3456-003 printed page 20 PDF page 40: with only one Node board, only XIO slots 1 through 6 are activated"]
      notes: >-
        The manual says a one-node module needs no Router, not that a rack
        module ships without one; no capture of a one-node rack module is
        held, so leaving both Router slots empty is inferred.
    - node_slots: [1, 2]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2]
      xio_slots: {pci-expansion: 1, xio-slot-3: 1, xio-slot-4: 1, xio-slot-5: 1, xio-slot-6: 1, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2], [1, 1], [2, 1]]
      grade: established
      sources: ["web:origin-onyx2-quick-reference-booklet Table 41 printed page 130 PDF page 132: in a 2-node system N1 controls IO1-IO6 and N2 IO7-IO12", "qemu:docs/specs/sgi-origin2000-module.rst#sgi-origin2000-module-routers"]
    - node_slots: [1, 2, 3]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3]
      xio_slots: {pci-expansion: 3, xio-slot-3: 1, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 2, xio-slot-9: 2, xio-slot-10: 2, xio-slot-11: 2, xio-slot-12: 2}
      supported_cpu_populations: [[2, 2, 2], [1, 1, 1], [2, 1, 1], [2, 2, 1]]
      grade: inferred
      sources: ["qemu:docs/specs/sgi-origin2000-module.rst#sgi-origin2000-module-routers", "web:origin-onyx2-quick-reference-booklet Table 41 printed page 130 PDF page 132: the four-node quadrants"]
      notes: >-
        Which node controls IO8, IO10 and IO12 with node board 4 absent
        is inferred: node 2 is the only Hub on Crossbow 1.
    - node_slots: [1, 2, 3, 4]
      routers: [router-1, router-2]
      fabric_links: [r1-node1, r1-node2, r1-r2, r2-node3, r2-node4]
      xio_slots: {pci-expansion: 3, xio-slot-3: 1, xio-slot-4: 3, xio-slot-5: 1, xio-slot-6: 3, xio-slot-7: 2, xio-slot-8: 4, xio-slot-9: 2, xio-slot-10: 4, xio-slot-11: 2, xio-slot-12: 4}
      supported_cpu_populations: [[2, 2, 2, 2], [1, 1, 1, 1], [2, 1, 1, 1], [2, 2, 1, 1], [2, 2, 2, 1]]
      grade: established
      sources: ["108-0170-001 Figure 6-2 and Table 6-1 printed page 6-3 PDF page 97 mapping visually verified", "web:origin-onyx2-quick-reference-booklet Table 41 printed page 130 PDF page 132: the four-node quadrants", "qemu:docs/specs/sgi-origin2000-module.rst#sgi-origin2000-module-routers"]
  population:
    nodes: 4
    cpus_per_node:
    - 2
    - 2
    - 2
    - 2
    provenance: derived
    sources: ["007-3439-002 Memory Specifications printed page 35 PDF page 49; 108-0170-001 printed page 1-4 PDF page 18", "SGI Origin 2000 remanufactured product guide 1068 (9/99) printed page 7 PDF page 7: node card main memory 256MB to 4GB per card; printed page 6 PDF page 6: from 256MB to 4GB ECC main memory per board"]
  cpu_selection:
    default: {clock_mhz: 180, cache_mib: 1}
    slots: [node-board-1-cpu-a, node-board-1-cpu-b, node-board-2-cpu-a, node-board-2-cpu-b,
      node-board-3-cpu-a, node-board-3-cpu-b, node-board-4-cpu-a, node-board-4-cpu-b]
  memory_kits_per_node: [kit-256, kit-256, kit-256, kit-256]
  # The slots a graphics pipe can take, what each offers and the pipe
  # the machine fits by default; products and values are
  # hw/mips/sgi/models/graphics-products.yaml's (docs/specs/sgi-sn.rst,
  # Graphics pipes).
  graphics:
    max_pipes: 1
    headless: true
    # The Origin 2000's plain BaseIO has no keyboard or mouse port; the
    # Onyx2's BaseIO-G adds them through its MediaIO daughtercard
    # (HMQ-380-C, "IO6G Cabling and Pin Assignments" and "Mouse and
    # Keyboard Port Pin Assignments"; 007-3439-002 Figure 2-27). The X
    # server needs a keyboard, so a launch that fits a pipe asks for the
    # BaseIO-G, as owners who put an IMPACT board in an Origin 2000 did.
    # A launch without one keeps the plain board.
    machine_properties:
      properties: {baseio-preset: io6g}
      reason: "the plain BaseIO has no keyboard or mouse port; the BaseIO-G that an Onyx2 ships with has them"
    slots:
      - names: [io2, io3, io4, io5, io6, io7, io8, io9, io10, io11, io12]
        description: "XIO slot {number}"
        placement: {slot: "{name}"}
        families:
          - family: mgras
            products:
              - {product: si, fidelity: implemented, pairing: established}
              - {product: si-t, fidelity: implemented, pairing: established}
              - {product: ssi, fidelity: approximated, limitations: ["no capture gives a two-RE board's register values, so the model's are inferred"], pairing: established}
              - {product: mxi, fidelity: approximated, limitations: ["no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
              - {product: esi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1"], pairing: established}
              - {product: esi-t, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1"], pairing: established}
              - {product: essi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1", "no capture gives a two-RE board's register values, so the model's are inferred"], pairing: established}
              - {product: emxi, fidelity: approximated, limitations: ["renders the E-series GE12 and PP1 revision E as the first-generation GE11 and PP1", "no capture gives a two-RE board's register values, so the model's are inferred"], pairing: inferred}
        refusals:
          - family: kona
            reason: "an Origin 2000 with an InfiniteReality pipe is an Onyx2, so use onyx2-rack"
  data:
    machine:
      name: Origin 2000 rack module
      model_role: emulation-target
      notes: Selected installation with two processors and 256 MiB per node in two 128 MB banks. Optional
        I/O slots and external CrayLink connectors are empty. This is a selected population,
        not a captured machine inventory. Selected hardware configuration. The full processor
        mode word is not the full CP0 Config register; only the reviewed low 25 bits transfer.
        Stock image configuration must agree and is never rewritten by descriptor generation.
      firmware_config:
        cpu_clock_hz: 180000000
        hub_clock_hz: 90000000
        processor_reset_mode:
          kseg0_cache_algorithm: cacheable-coherent-exclusive-on-write
          processor_device_number: 0
          coherent_request_target: external-agent
          processor_eliminate_requests: false
          maximum_outstanding_processor_requests: 4
          system_clock_divisor: 2
          secondary_cache_block_words: 32
          secondary_cache_error_correction: retry-access-through-corrector
          memory_endianness: big
          secondary_cache_size_kib: 1024
          secondary_cache_clock_divisor: 1.5
          secondary_cache_clock_tap: 9
          open_drain_system_interface: false
          cache_test_mode: false
        machine_type: 0
        flash_read_cycles: 8
        flash_write_cycles: 1
        provenance: derived
        sources: ["qemu:docs/specs/sgi-origin2000-module.rst#sgi-origin2000-reset-mode", qemu:docs/specs/sgi-hub.rst#sgi-hub-processor-interface]
      emulation:
        machine_name: origin2000
        display_description: SGI Origin 2000 rack module
        profile: origin2000-rack
        lifecycle: implemented
        emulator_constraints:
          # Per-node totals -m may select: every sum of up to eight banks of
          # 64, 128 or 512 MiB, to the 4 GB a node board takes (SGI
          # 007-3439-002, printed page 35). 256 MB banks are left out
          # because the stock PROM disables them at 180 MHz. QEMU keeps
          # bank 0 at 128 MiB unless the total needs a 512 MiB bank 0
          # (3072, 3584 and 4096 MiB), so 256 MiB is two 128 MB banks.
          accepted_bank_sizes_mib: [64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768, 832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344, 1408, 1472, 1536, 1600, 1664, 1728, 1792, 1856, 1920, 1984, 2048, 2112, 2176, 2240, 2304, 2368, 2432, 2496, 2560, 2624, 2688, 2752, 2816, 2880, 2944, 3072, 3136, 3200, 3264, 3328, 3584, 3648, 3712, 4096]
        initially_operational_crossbow_links:
        - component: crossbow-0
          widgets: [8, 9, 10]
          reason: >-
            Static emulator startup health for the fitted BaseIO and two Hub
            links.
            Machine launch and whole-machine reset reapply it; migration restores
            runtime link state instead. This does not model Crossbow training or
            establish diagnostic acceptance.
        - component: crossbow-1
          widgets: [9, 10]
          reason: >-
            Static emulator startup health for the two fitted Hub links. Machine
            launch and whole-machine reset reapply it; migration restores runtime
            link state instead. This does not model Crossbow training or establish
            diagnostic acceptance.
        hub_ni_revision_overrides:
        - component: node-board-1-hub
          ni_revision: 5
          reason: >-
            Stock Origin 2000 inventories report Hub revision code 5: the
            two-node Origin 2200 capture web:nekonomicon-16729560 (an 8P12_MPLN module
            with no graphics) prints HUB Revision 5 on both node slots, and
            no stock capture shows code 3. The reusable node-board module's
            code 3 (Hub 2.1, the earliest IRIX 6.5.30 accepts) stays the
            baseline for products this override does not name.
        - component: node-board-2-hub
          ni_revision: 5
          reason: Matches node-board-1-hub; a module's Hubs share one manufactured revision.
        - component: node-board-3-hub
          ni_revision: 5
          reason: Matches node-board-1-hub; a module's Hubs share one manufactured revision.
        - component: node-board-4-hub
          ni_revision: 5
          reason: Matches node-board-1-hub; a module's Hubs share one manufactured revision.
        initial_module_numbers:
        - component: compute-module
          number: 1
          reason: >-
            Selected initial identity for this emulated installation. This value is
            not a measured or factory-default module number.
        module_semantic_serials:
        - component: compute-module
          serial: KORIGAMI01
          reason: Synthetic module serial for module 1, the "KORIGAMI" marker and the module's number, beginning with K because the kernel takes no other module serial; not hardware evidence.
        module_onewire_parts:
        - component: compute-module
          identity_serial: '0x51454d555900'
          midplane_serial: '0x51454d554c00'
          midplane:
            name: 8P12_MPLN
            part: 030-0762-006
            revision: H
          reason: Synthetic ROM serials for module 1's MODULEID part, letter Y, and its 8P12_MPLN midplane part, letter L, each at the module's index 0 and carrying the "QEMU" marker. The midplane record is the four-node module's 030-0762-006 rev H, the 030- part most often seen in real inventories; the serials are not hardware evidence.
        synthetic_identities:
        - component: node-board-1-hub
          serial: '0x51454d554e00'
          reason: Synthetic node identity N0, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-2-hub
          serial: '0x51454d554e01'
          reason: Synthetic node identity N1, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-3-hub
          serial: '0x51454d554e02'
          reason: Synthetic node identity N2, carrying the "QEMU" marker; not hardware evidence.
        - component: node-board-4-hub
          serial: '0x51454d554e03'
          reason: Synthetic node identity N3, carrying the "QEMU" marker; not hardware evidence.
        - component: router-1
          serial: '0x51454d555200'
          reason: Synthetic Router identity R0, carrying the "QEMU" marker; not hardware evidence.
        - component: router-2
          serial: '0x51454d555201'
          reason: Synthetic Router identity R1, carrying the "QEMU" marker; not hardware evidence.
        - component: baseio-bridge
          serial: '0x51454d554200'
          reason: Synthetic Bridge identity B0, carrying the "QEMU" marker; not hardware evidence.
        - component: baseio-ioc3
          serial: '0x5e7454d55000'
          reason: Synthetic IOC3 identity 0. Its Ethernet-address part keeps the 0x5e7 UniqueWare code drivers match on, then carries the "EMU" marker; not hardware evidence.
      harness:
        console: ioc3-serial-a
        prom_dialogue: ip27-menu
        default_cpu_model: R10000
        disk_bus: scsi.0
        netboot_adapter: ioc3-ethernet
        default_topology: four-node-module
        supported_guests: [irix]
        install_media: [disk-image, netboot]
        provenance: derived
        sources: ["query-sgi-machines: the node<N>-flash storage items, one per node board, that qemu-sgi-machine-init creates and a launch binds", qemu:docs/specs/sgi-sn.rst#sgi-sn-firmware-supply, qemu:docs/specs/sgi-sn.rst#sgi-sn-launch-metadata]
    evidence_policy: strict
