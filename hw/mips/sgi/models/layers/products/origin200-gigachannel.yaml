      - {id: crossbow-link-d, name: Crossbow link D to optional XIO position io4, kind: xio, master: crossbow, provenance: vendor-document, sources: ["007-3708-002 Figure 1-5 printed page 7 PDF page 33 and configurations printed page 22 PDF page 48 mapping trusted", "108-0187-001 Figure 2-3 section page 2-4 PDF page 18 and inventory section page 3-8 PDF page 34 mapping trusted"]}
      - {id: crossbow-link-e, name: Crossbow link E to optional XIO position io5, kind: xio, master: crossbow, provenance: vendor-document, sources: ["007-3708-002 Figure 1-5 printed page 7 PDF page 33 and configurations printed page 22 PDF page 48 mapping trusted", "108-0187-001 Figure 2-3 section page 2-4 PDF page 18 and inventory section page 3-8 PDF page 34 mapping trusted"]}
      - {id: crossbow-link-f, name: Crossbow link F to optional XIO position io6, kind: xio, master: crossbow, provenance: vendor-document, sources: ["007-3708-002 Figure 1-5 printed page 7 PDF page 33 and configurations printed page 22 PDF page 48 mapping trusted", "108-0187-001 Figure 2-3 section page 2-4 PDF page 18 and inventory section page 3-8 PDF page 34 mapping trusted"]}
