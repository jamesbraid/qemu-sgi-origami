      - {component: crossbow, bus: crossbow-link-b, role: master, provenance: vendor-document, sources: ["007-3708-002 Figure 1-5 printed page 7 PDF page 33 and configurations printed page 22 PDF page 48 mapping trusted", "108-0187-001 Figure 2-3 section page 2-4 PDF page 18 and inventory section page 3-8 PDF page 34 mapping trusted"], notes: Link B reaches software position io2; no physical slot is selected.}
      - {component: xio-position-io2, bus: crossbow-link-b, role: endpoint, controlled_by: base-logic-carrier, widget: 11, provenance: datasheet, sources: ["docs/datasheets/sgi-gigachannel.md Crossbow link assignment, established by disassembly of the IP27 PROM 6.156 widget-to-slot table"], notes: The IP27 PROM names widget 11 io2 on an Origin 200.}
      - {component: crossbow, bus: crossbow-link-c, role: master, provenance: vendor-document, sources: ["007-3708-002 Figure 1-5 printed page 7 PDF page 33 and configurations printed page 22 PDF page 48 mapping trusted", "108-0187-001 Figure 2-3 section page 2-4 PDF page 18 and inventory section page 3-8 PDF page 34 mapping trusted"], notes: Link C reaches software position io3; no physical slot is selected.}
      - {component: xio-position-io3, bus: crossbow-link-c, role: endpoint, controlled_by: base-logic-carrier, widget: 12, provenance: datasheet, sources: ["docs/datasheets/sgi-gigachannel.md Crossbow link assignment, established by disassembly of the IP27 PROM 6.156 widget-to-slot table"], notes: The IP27 PROM names widget 12 io3 on an Origin 200.}
