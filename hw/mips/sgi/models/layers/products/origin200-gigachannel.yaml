        notes: >-
          Slots 11-15 correspond as a set to links B-F and software positions
          io2-io6, but the one-to-one physical slot mapping is not established.
      - id: gigachannel-bridge-one-wire
        name: cabinet Bridge one-wire line
        kind: one-wire
        master: gigachannel-bridge
        provenance: derived
        sources: ["docs/datasheets/bridge.md one-wire master", "docs/datasheets/sgi-gigachannel.md Firmware and IRIX view"]
      - {id: gigachannel-pci, name: GIGAchannel PCI, kind: pci, master: gigachannel-bridge, provenance: vendor-document, sources: ["007-3708-002 Figure 1-5 printed page 7 PDF page 33 and configurations printed page 22 PDF page 48 mapping trusted", "108-0187-001 Figure 2-3 section page 2-4 PDF page 18 and inventory section page 3-8 PDF page 34 mapping trusted"]}
    connections:
