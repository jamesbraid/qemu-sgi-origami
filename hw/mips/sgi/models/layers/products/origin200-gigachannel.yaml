        source: gigachannel-bridge
        provenance: derived
        sources: ["007-3708-002 Figure 1-5 printed page 7 PDF page 33 establishes the physical path"]
        description: An enabled error in the cabinet Bridge follows the same XIO write protocol as another Bridge interrupt through Crossbow link 8, the fabric, and link A to Hub.
        chain:
          - {at: gigachannel-bridge, as: enabled Bridge error interrupt, mechanism: level}
          - {at: crossbow, as: routed XIO interrupt write, mechanism: xio-write}
          - {at: base-hub-ii, as: interrupt destination, mechanism: xio-write}
          - {at: base-hub-pi, as: pending bit and processor mask, mechanism: pending-bit}
          - {at: base-cpu0, as: hardware interrupt 0 or 1, mechanism: cause-bit}
