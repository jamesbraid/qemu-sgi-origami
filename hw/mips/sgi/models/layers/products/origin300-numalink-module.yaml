# SPDX-License-Identifier: BSD-3-Clause
# Origin 300 with the NUMAlink module: two base modules with the eight-port NUMAlink enclosure.
layer_version: 1
layer:
  kind: product
  id: origin300-numalink-module
  requires: {assembly: ip45}
  topology:
    min_nodes: 2
    max_nodes: 2
    provenance: vendor-document
    sources: ["007-4498-002 p.2, 8, 93: minimum two base modules; each contains two or four processors; this reference selects two four-processor bases"]
  population:
    nodes: 2
    cpus_per_node: [4, 4]
    fitted_memory:
      status: unknown
      reason: This reference selects two base modules but no installed memory kit.
      provenance: derived
      sources: ["007-4498-002 p.2, 8, 93: minimum two base modules; each contains two or four processors; this reference selects two four-processor bases"]
    provenance: vendor-document
    sources: ["007-4498-002 p.2, 8, 93: minimum two base modules; each contains two or four processors; this reference selects two four-processor bases"]
  cpu_selection:
    default: {clock_mhz: 500, cache_mib: 2}
    slots: [cpu0, cpu1, cpu2, cpu3]
  data:
    machine:
      name: Origin 300 with the NUMAlink module
      model_role: reference
      notes: >-
        Two Origin 300 base modules and the eight-port NUMAlink module form a
        reference to the documented minimum population. Each base is selected
        with four R14000 processors; installed memory remains unspecified.
        The NUMAlink enclosure contains its own L1 and an internal USB hub.
        L2 is a separate rack-level controller. Ports 1, 6, 7 and 8 accept
        base modules only; ports 2-5 accept base or PCI expansion modules and
        carry USB. Connector letters A-H are port labels. No fitted ASIC
        identity, count or revision is established by this composition. No
        base-to-numbered-port cables are selected here. This catalogue
        reference cannot compile or run.
    evidence_policy: strict
    components:
      - id: rack
        name: Origin 300 rack
        kind: chassis
        provenance: vendor-document
        sources: ["007-4498-002 p.93, 96: rack contains base modules, NUMAlink enclosure and separate rack L2"]
      - id: base1-module
        name: First Origin 300 base module
        kind: module
        parent: rack
        provenance: vendor-document
        sources: ["007-4498-002 p.2, 8, 93: minimum two base modules, two or four processors per base"]
      - id: base2-module
        name: Second Origin 300 base module
        kind: module
        parent: rack
        provenance: vendor-document
        sources: ["007-4498-002 p.2, 8, 93: minimum two base modules, two or four processors per base"]
      - id: rack-l2
        name: L2 system controller
        kind: system-controller
        hardware_kind: l2
        system_controller: {kind: l2}
        parent: rack
        provenance: vendor-document
        sources: ["007-4498-002 p.12, 14, 96: separate rack-level controller and power supply"]
        notes: External to the NUMAlink enclosure; no optional omission or protocol is inferred.
