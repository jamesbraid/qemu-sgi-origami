# SPDX-License-Identifier: BSD-3-Clause
# Onyx 350 non-graphics compatibility projection for a captured module,
# with an IP53 node board or its 1 GHz successor, the IP59. Each node
# board is its own topology.
configuration_version: 1
layers:
  - layers/architectures/sn1.yaml
  - layers/assemblies/ip53.yaml
variants:
  - id: ip53
    name: onyx350-ip53
    board: ip53
    default: true
    layers:
      - layers/modules/ip53-onyx350-module.yaml
      - layers/products/onyx350.yaml
  - id: ip59
    name: onyx350-ip59
    board: ip59
    layers:
      - layers/modules/ip59-onyx350-module.yaml
      - layers/products/onyx350-ip59.yaml
